# The version of this service. A release is a tagged commit with a fixed version.
version=0.1.0-SNAPSHOT

# The console-libs version the service builds with (com.iaf.console:*), and the hub commit the copied
# contracts come from; contracts.lock at the root lists every copy with its sha256.
console.libs.version=0.1.0-SNAPSHOT
console.hub.commit=b00db2d

org.gradle.workers.max=2
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.jvmargs=-Xmx1g -Dfile.encoding=UTF-8
org.gradle.java.installations.auto-download=false
