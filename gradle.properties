# The version every module is published as. A release is a tagged commit with a fixed version;
# the branch head stays a snapshot so each push to console-libs can republish it.
version=0.1.0-SNAPSHOT

# The hub commit the copied contracts come from; contracts.lock at the root lists every copy with its sha256.
console.hub.commit=4b8acf47ee8a77ba6628e4a4cf26d97e13179b10

org.gradle.workers.max=2
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.jvmargs=-Xmx1g -Dfile.encoding=UTF-8
org.gradle.java.installations.auto-download=false
