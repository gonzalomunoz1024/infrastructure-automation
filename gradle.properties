# The version of this service; the branch head stays a snapshot.
version=0.1.0-SNAPSHOT

# The console-libs version this service builds with (com.iaf.console:* and the convention plugins),
# and the console-libs ref CI publishes to the local Maven repository until GitHub Packages has it.
console.libs.version=0.1.0-SNAPSHOT
console.libs.ref=console-libs--phase-0

# The hub commit the copied contracts come from; contracts.lock at the root lists every copy with its sha256.
console.hub.commit=e7f1404c5953ee5ff04e02619a736421d8007ffb

org.gradle.workers.max=2
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.jvmargs=-Xmx1g -Dfile.encoding=UTF-8
org.gradle.java.installations.auto-download=false
