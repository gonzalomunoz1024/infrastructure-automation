# The service's own version; the branch head stays a snapshot, a release is a tagged commit.
version=0.1.0-SNAPSHOT

# The console-libs version the service builds against (com.iaf.console:* and the convention plugins).
console.libs.version=0.1.0-SNAPSHOT

# The hub commit the copied contracts come from; contracts.lock at the root lists every copy with its sha256.
console.hub.commit=a281cd35550d6a757337effff783afc28a3ca6bf

org.gradle.workers.max=2
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.jvmargs=-Xmx1g -Dfile.encoding=UTF-8
org.gradle.java.installations.auto-download=false
