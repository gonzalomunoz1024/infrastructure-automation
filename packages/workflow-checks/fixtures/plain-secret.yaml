apiVersion: iaf.platform/v1
kind: Workflow
metadata: { name: ping, title: Ping, noun: host, verb: ping, owner: team-compute, version: 1.0.0 }
policy:
  rbac: [ops]
workflow:
  do:
    - ping:
        call: http
        with: { method: GET, url: "https://example.com/ping", credential: hunter2 }
    - play:
        call: ansible
        with:
          playbook: { git: { repo: github.com/acme/ops, ref: v1, path: ping.yml }, commit: abc1234 }
          extraVars: { password: "s3cret" }
