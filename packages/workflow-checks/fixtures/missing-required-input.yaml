apiVersion: iaf.platform/v1
kind: Workflow
metadata: { name: vm-info, title: VM info, noun: vm, verb: read, owner: team-compute, version: 1.0.0 }
workflow:
  do:
    - getVm:
        call: provider
        with: { provider: vsphere, action: vm.get, input: { name: "{{ $input.vmId }}" } }
    - child:
        run: { workflow: create-vmm, version: "^2", input: {} }
