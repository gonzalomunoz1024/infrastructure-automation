apiVersion: iaf.platform/v1
kind: Workflow
metadata: { name: vm-info, title: VM info, noun: vm, verb: read, owner: team-compute, version: 1.0.0 }
api:
  input:
    type: object
    required: [vmId]
    properties:
      vmId: { type: string }
  response:
    status: 202
    body:
      type: object
      properties:
        powerState: { type: string }
        host: { type: string }
policy:
  rbac: [ops]
workflow:
  do:
    - getVm:
        name: Get VM
        call: provider
        with: { provider: vsphere, action: vm.get, input: { id: "{{ $input.vmId }}" } }
  outputs:
    powerState: "{{ $('Get VM').json.powerState }}"
