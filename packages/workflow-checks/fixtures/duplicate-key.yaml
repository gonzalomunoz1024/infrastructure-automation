apiVersion: iaf.platform/v1
kind: Workflow
metadata: { name: vm-note, title: VM note, noun: vm, verb: note, owner: team-compute, version: 1.0.0 }
api:
  input:
    type: object
    properties:
      vmId:
        type: string
        examples: [vm-1]
        pattern: "^vm-"
        examples: [vm-2]
policy:
  rbac: [ops]
workflow:
  do:
    - getVm:
        call: provider
        with: { provider: vsphere, action: vm.get, input: { id: "{{ $input.vmId }}" } }
