apiVersion: iaf.platform/v1
kind: Workflow
metadata:
  name: web-environment
  title: Web environment
  noun: environment
  verb: create
  persona: developer
  owner: team-platform
  folder: Platform
  tags: [composite, terraform]
  version: 0.9.0
  description: "A complete web environment, built from other workflows: a database, two VMs and a load balancer."
api:
  method: POST
  path: /api/v1/environments
  input:
    type: object
    required: [name, environment]
    properties:
      name:
        type: string
        title: Environment name
        examples: [shop, blog, portal, docs]
        pattern: "^[a-z][a-z0-9-]{2,20}$"
      environment:
        type: string
        title: Stage
        enum: [dev, test, prod]
      image:
        type: string
        title: Image
        x-resource: { type: image, orCreateWith: build-vm-image }
      vmCount:
        type: integer
        title: Web servers
        default: 2
        minimum: 1
        maximum: 6
  response: { status: 202 }
  preview: true
mcp:
  expose: true
  description: Create a web environment (database, web servers, load balancer) in one job.
policy:
  approval: { required: true, group: platform-approvers, timeout: 12h }
  rbac: [developer, platform]
rollout:
  strategy: canary
  stages: [10, 50, 100]
workflow:
  do:
    - approval:
        name: Approve environment
        approval:
          group: platform-approvers
          message: "Create {{ $input.environment }} environment {{ $input.name }} with {{ $input.vmCount }} web servers?"
          timeout: 12h
    - build:
        name: Build in parallel
        fork:
          branches:
            - - database:
                  name: Create database
                  run:
                    workflow: create-database
                    version: "^1"
                    input: { name: "{{ $input.name }}-db", environment: "{{ $input.environment }}", tier: M10 }
                  output: { as: db }
            - - webServers:
                  name: Create web servers
                  for:
                    each: index
                    in: "{{ $range(1, $input.vmCount) }}"
                    do:
                      - vm:
                          name: Create VM
                          run:
                            workflow: create-vm
                            version: "^2"
                            input: { name: "{{ $input.name }}-web-{{ $index }}", image: "{{ $input.image }}", size: small, environment: "{{ $input.environment }}" }
                  output: { as: vms }
    - loadBalancer:
        name: Load balancer
        call: terraform
        with:
          module: { source: git::https://github.com/acme/tf-modules//lb, version: 2.3.0 }
          action: apply
          vars: { name: "{{ $input.name }}", targets: "{{ $vms.items.map(v => v.outputs.vmId) }}" }
          credential: vault:terraform/platform
        output: { as: lb }
        timeout: 20m
    - registerEnv:
        name: Register environment
        register:
          type: environment
          attributes:
            name: "{{ $input.name }}"
            stage: "{{ $input.environment }}"
            url: "{{ $lb.outputs.url }}"
            database: "{{ $db.outputs.databaseId }}"
            webServers: "{{ $vms.items.map(v => v.outputs.vmId) }}"
          builtFrom: "{{ $vms.items.map(v => v.outputs.vmId).concat([$db.outputs.databaseId]) }}"
  outputs:
    url: "{{ $lb.outputs.url }}"
    databaseId: "{{ $db.outputs.databaseId }}"
