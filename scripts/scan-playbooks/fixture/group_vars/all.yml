# placeholders, not secrets.
ntp_servers: [0.pool.ntp.org, 1.pool.ntp.org]
admin_user: ops
admin_password: not-real   # scan: flagged
monitoring: { url: "https://metrics.example.test", api_key: example }   # scan: flagged
