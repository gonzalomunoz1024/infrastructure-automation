openapi: 3.1.0
x-status: draft
info:
  title: console-drift-service
  version: 1.0.0
  summary: Reads every managed resource's truth from its provider on the type's interval, opens findings when it differs from the desired state, and lets the account revert, accept or ignore them.
  description: |
    Phase 0 draft: the names, the paths and the rules below are agreed; field lists will grow.

    **Account scope.** Every call runs as a console account, the `acct` claim of the caller's
    internal JWT; findings and unmanaged objects of another account answer 404, never 403. The
    console-internal principal may name an account with `accountId`.

    **How it reads.** The type's `observe` block (P-06) says which provider action to call and how
    to map the answer; the platform executes it (`POST /api/v1/resource-types/{name}:observe-list`
    for the paged scan, `POST /api/v1/resources/{id}:observe` for one resource, P-09). A scan
    compares every item with the desired attributes the state service holds, ignoring the fields
    in `observe.ignore` and the ones a finding was accepted or ignored for.

    **Findings.** One open finding per resource at a time; a later scan updates its fields or
    closes it as `vanished`. `revert` starts the type's update workflow with the desired values
    (through the BFF's delegation when a user asks, else as the internal account), `accept` makes
    the observed values the desired ones, `ignore` silences the fields until the desired state
    changes.

    **Paging.** Lists answer `{ items, next }`; `next` is an opaque cursor, null on the last page,
    sent back as `after`. `limit` is 1 to 200, 50 by default (the plan's cap for every console API).

    **Errors.** `{ error, problems?, correlationId? }`: 400 bad input, 401 no valid JWT, 404
    unknown or out of scope, 409 a finding already closed, 429 the provider's observe budget is
    used up (with `Retry-After`), 502 the platform answered an error.

    **wfrns in URLs.** Findings are filtered by wfrn as a query parameter, as the platform does;
    no wfrn appears in a path here.
  contact:
    name: Customer console hub (console-root)
servers:
  - url: /
tags:
  - name: Findings
  - name: Discovery
  - name: Webhooks
  - name: Health
security:
  - consoleJwt: []
paths:
  /actuator/health:
    get:
      operationId: health
      summary: Liveness and readiness
      tags: [Health]
      security: []
      responses:
        '200':
          description: Up
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '503':
          description: Down
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
  /v1/findings:
    get:
      operationId: listFindings
      summary: List findings
      description: Per resource with `wfrn`, per account otherwise; open ones by default.
      tags: [Findings]
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - name: wfrn
          in: query
          description: An exact wfrn, or a pattern
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [open, closed, all], default: open }
        - name: severity
          in: query
          schema: { $ref: '#/components/schemas/Severity' }
        - name: type
          in: query
          schema: { type: string }
        - name: region
          in: query
          schema: { $ref: '#/components/schemas/RegionName' }
        - name: openedAfter
          in: query
          schema: { type: string, format: date-time }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/After'
      responses:
        '200':
          description: One page
          content:
            application/json:
              schema:
                type: object
                required: [items, next]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Finding' }
                  next: { $ref: '#/components/schemas/Cursor' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/findings/summary:
    get:
      operationId: getFindingsSummary
      summary: Open findings counted by type and severity
      tags: [Findings]
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - name: region
          in: query
          schema: { $ref: '#/components/schemas/RegionName' }
      responses:
        '200':
          description: The counts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FindingsSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/findings/{findingId}:
    parameters:
      - $ref: '#/components/parameters/FindingId'
    get:
      operationId: getFinding
      summary: Get a finding
      tags: [Findings]
      responses:
        '200':
          description: The finding
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Finding' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/findings/{findingId}:revert:
    parameters:
      - $ref: '#/components/parameters/FindingId'
    post:
      operationId: revertFinding
      summary: Put the resource back to its desired state
      description: Starts the type's update workflow with the desired values of the drifted fields; the finding closes as `reverted` when the job succeeds.
      tags: [Findings]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ConsoleRequestId'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Decision' }
      responses:
        '202':
          description: The revert job was started
          content:
            application/json:
              schema:
                type: object
                required: [findingId, jobId]
                properties:
                  findingId: { type: string }
                  jobId: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '502': { $ref: '#/components/responses/BadGateway' }
  /v1/findings/{findingId}:accept:
    parameters:
      - $ref: '#/components/parameters/FindingId'
    post:
      operationId: acceptFinding
      summary: Make the observed values the desired ones
      tags: [Findings]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ConsoleRequestId'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Decision' }
      responses:
        '200':
          description: The finding, closed as accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Finding' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/findings/{findingId}:ignore:
    parameters:
      - $ref: '#/components/parameters/FindingId'
    post:
      operationId: ignoreFinding
      summary: Silence the drifted fields
      description: Until the desired state changes, or until `until` when given.
      tags: [Findings]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ConsoleRequestId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/Decision'
                - type: object
                  properties:
                    until: { type: string, format: date-time }
      responses:
        '200':
          description: The finding, closed as ignored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Finding' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/discover:
    post:
      operationId: startDiscovery
      summary: Scan a type's provider for everything it has
      description: Pages through the type's `observe.discover` action (P-09) and records what is not under management; one run per type and region at a time.
      tags: [Discovery]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, region]
              properties:
                type: { type: string }
                region: { $ref: '#/components/schemas/RegionName' }
      responses:
        '202':
          description: The run
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiscoveryRun' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /v1/discover/{runId}:
    parameters:
      - name: runId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getDiscovery
      summary: A discovery run's progress
      tags: [Discovery]
      responses:
        '200':
          description: The run
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiscoveryRun' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/unmanaged:
    get:
      operationId: listUnmanaged
      summary: Objects the provider has that the console does not manage
      tags: [Discovery]
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - name: type
          in: query
          required: true
          schema: { type: string }
        - name: region
          in: query
          schema: { $ref: '#/components/schemas/RegionName' }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/After'
      responses:
        '200':
          description: One page
          content:
            application/json:
              schema:
                type: object
                required: [items, next]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/UnmanagedObject' }
                  next: { $ref: '#/components/schemas/Cursor' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/unmanaged:import:
    post:
      operationId: importUnmanaged
      summary: Take a discovered object under management
      description: Mints a wfrn through the state service (`POST /v1/resources:import`, source `discover`) and removes the object from the unmanaged list.
      tags: [Discovery]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ConsoleRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, region, providerId]
              properties:
                type: { type: string }
                region: { $ref: '#/components/schemas/RegionName' }
                providerId: { type: string }
                name: { type: string }
      responses:
        '201':
          description: The resource is managed
          content:
            application/json:
              schema:
                type: object
                required: [wfrn]
                properties:
                  wfrn: { $ref: '#/components/schemas/Wfrn' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/webhooks/{provider}:
    parameters:
      - name: provider
        in: path
        required: true
        description: The provider name
        schema: { type: string, pattern: '^[a-z0-9-]{2,64}$' }
    post:
      operationId: receiveProviderWebhook
      summary: A provider's change notification
      description: Schedules an observe of the resources the notification names instead of waiting for the interval. Verified with the `X-Webhook-Signature` header, an HMAC of the body with the signing material configured per provider; a bad signature is 401.
      tags: [Webhooks]
      security: []
      parameters:
        - name: X-Webhook-Signature
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [objects]
              properties:
                event: { type: string }
                at: { type: string, format: date-time }
                objects:
                  type: array
                  minItems: 1
                  maxItems: 1000
                  items:
                    type: object
                    required: [providerId]
                    properties:
                      providerId: { type: string }
                      type: { type: string }
                      region: { $ref: '#/components/schemas/RegionName' }
      responses:
        '202':
          description: Scheduled
          content:
            application/json:
              schema:
                type: object
                required: [scheduled]
                properties:
                  scheduled: { type: integer, description: How many managed resources will be observed }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
components:
  securitySchemes:
    consoleJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "The console's internal JWT, signed by the BFF (ES256, `kid` in the header, verified against its `/.well-known/jwks.json`): `iss`, `aud` (exactly this service's id, decision 35: a token naming another audience, or more than one, is a 401), `iat`, `exp`, `sub` (the console user id, or the service id on a service token), `acct` (the account the person acts in; absent on a service token, which this service accepts only from the service principals it lists as allowed to call it as themselves, decision 35), `region`, `groups` (the person's group names in the account), `roles` (the managed role names the person holds there, from the membership the identity service serves: `viewer`, `operator`, `account-admin`, `auditor`; the BFF re-reads it at least every 5 minutes and never past a time-boxed role's end), `svc` (the calling service) and optionally `name` and `email`. Admin-only decisions test `roles` for `account-admin`, never a group name."
  parameters:
    FindingId:
      name: findingId
      in: path
      required: true
      schema: { type: string }
    AccountId:
      name: accountId
      in: query
      required: false
      description: The account to read; a console account may only name its own, the internal principal any
      schema: { $ref: '#/components/schemas/AccountId' }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    After:
      name: after
      in: query
      required: false
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, maxLength: 255 }
    ConsoleRequestId:
      name: X-Console-Request-Id
      in: header
      required: false
      schema: { type: string, maxLength: 128 }
  responses:
    BadRequest:
      description: Bad input
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: No valid JWT, or a bad webhook signature
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Unknown, or another account's
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: The finding is closed, or a run is already going
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: 'The provider''s observe budget is used up'
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BadGateway:
      description: The platform answered an error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Wfrn:
      type: string
      maxLength: 1024
      pattern: '^wfrn:[a-z0-9-]{1,32}:[a-z0-9-]{2,32}:(|[a-z0-9-]{2,32}):(|[0-9]{12}):[a-z0-9-]{1,64}/[a-z0-9-]{1,128}(/[a-z0-9-]{1,128})*$'
    AccountId:
      type: string
      pattern: '^[0-9]{12}$'
    RegionName:
      type: string
      pattern: '^[a-z0-9-]{2,32}$'
    Cursor:
      type: [string, 'null']
    Severity:
      type: string
      enum: [info, warning, critical]
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        problems:
          type: array
          items:
            type: object
            required: [code, message]
            properties:
              code: { type: string }
              field: { type: string }
              message: { type: string }
        correlationId: { type: string }
    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [UP, DOWN, OUT_OF_SERVICE, UNKNOWN] }
        components: { type: object, additionalProperties: true }
    Decision:
      type: object
      properties:
        reason: { type: string, maxLength: 1000 }
        actor: { type: string, description: The console user, when the BFF sends it for one }
    DriftField:
      type: object
      required: [path]
      properties:
        path: { type: string, description: 'A JSON pointer into the resource''s attributes' }
        expected: {}
        observed: {}
        ignored: { type: boolean }
    Finding:
      type: object
      required: [findingId, wfrn, accountId, region, type, status, severity, version, fields, openedAt, observedAt]
      properties:
        findingId: { type: string }
        wfrn: { $ref: '#/components/schemas/Wfrn' }
        accountId: { $ref: '#/components/schemas/AccountId' }
        region: { $ref: '#/components/schemas/RegionName' }
        type: { type: string }
        status: { type: string, enum: [open, closed] }
        severity: { $ref: '#/components/schemas/Severity' }
        version: { type: integer }
        fields:
          type: array
          items: { $ref: '#/components/schemas/DriftField' }
        openedAt: { type: string, format: date-time }
        observedAt: { type: string, format: date-time }
        closedAt: { type: string, format: date-time }
        resolution: { type: string, enum: [reverted, accepted, ignored, vanished] }
        decidedBy: { type: string }
        reason: { type: string }
        revertJobId: { type: string }
        ignoredUntil: { type: string, format: date-time }
    FindingsSummary:
      type: object
      required: [open, byType, bySeverity]
      properties:
        open: { type: integer }
        byType:
          type: object
          additionalProperties: { type: integer }
        bySeverity:
          type: object
          additionalProperties: { type: integer }
        lastScanAt: { type: string, format: date-time }
    DiscoveryRun:
      type: object
      required: [runId, type, region, status, startedAt]
      properties:
        runId: { type: string }
        type: { type: string }
        region: { $ref: '#/components/schemas/RegionName' }
        status: { type: string, enum: [running, succeeded, failed] }
        startedAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time }
        seen: { type: integer }
        unmanaged: { type: integer }
        error: { type: string }
    UnmanagedObject:
      type: object
      required: [providerId, type, region, observed, seenAt]
      properties:
        providerId: { type: string }
        type: { type: string }
        region: { $ref: '#/components/schemas/RegionName' }
        name: { type: string }
        observed: { type: object, additionalProperties: true }
        seenAt: { type: string, format: date-time }
        firstSeenAt: { type: string, format: date-time }
