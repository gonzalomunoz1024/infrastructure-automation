openapi: 3.1.0
x-status: draft
info:
  title: console-search-indexer
  version: 1.0.0
  summary: Keeps a search index of every console resource from the state and drift events, and answers search and type-ahead for the BFF.
  description: |
    Phase 0 draft: the names, the paths and the rules below are agreed; field lists will grow.

    **Account scope.** Every query runs as a console account, the `acct` claim of the caller's
    internal JWT, and only that account's documents are searched; there is no cross-account hit,
    so nothing of another account can be found, named or counted. The console-internal principal
    may name an account with `accountId`.

    **What is indexed.** One document per resource: wfrn, type, service, region, name, state, tags,
    the fields the type marks `searchable` (P-06's `x-console`), the drift flag and the last job.
    The indexer follows `state.resources` and `drift.findings`
    (`contracts/asyncapi/console-events.yaml`) and is idempotent on each event's `key`; a rebuild
    reads the state service's lists.

    **Paging.** `GET /v1/search` answers `{ items, next }` with an opaque cursor; `limit` is 1 to
    200, 50 by default. Type-ahead answers at most 20 items and no cursor.

    **Errors.** `{ error, problems?, correlationId? }`: 400 a query the parser refuses, 401 no
    valid JWT, 404 unknown run, 429 over the account's query budget.

    **Query syntax.** Free text over name, wfrn and searchable fields, plus `tag:<name>=<value>`,
    `type:<type>`, `state:<state>`, `region:<region>` and `drift:true` terms; a wfrn pattern is a
    term of its own.
  contact:
    name: Customer console hub (console-root)
servers:
  - url: /
tags:
  - name: Search
  - name: Index
  - name: Health
security:
  - consoleJwt: []
paths:
  /actuator/health:
    get:
      operationId: health
      summary: Liveness and readiness
      tags: [Health]
      security: []
      responses:
        '200':
          description: Up
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '503':
          description: Down
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
  /v1/search:
    get:
      operationId: search
      summary: Search the account's resources
      tags: [Search]
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - name: q
          in: query
          required: true
          schema: { type: string, maxLength: 256 }
        - name: type
          in: query
          schema: { type: string }
        - name: region
          in: query
          schema: { $ref: '#/components/schemas/RegionName' }
        - name: state
          in: query
          schema: { $ref: '#/components/schemas/ResourceState' }
        - name: tag.<name>
          in: query
          schema: { type: string }
          x-name-pattern: '^tag\.[a-z0-9-]{1,32}$'
        - name: sort
          in: query
          schema: { type: string, enum: [score, name, -updated], default: score }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/After'
      responses:
        '200':
          description: One page of hits
          content:
            application/json:
              schema:
                type: object
                required: [items, next]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/SearchHit' }
                  next: { $ref: '#/components/schemas/Cursor' }
                  total: { type: integer, description: The number of hits when it is cheap to count, absent otherwise }
                  tookMs: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /v1/suggest:
    get:
      operationId: suggest
      summary: Type-ahead over names, wfrns, tags and types
      tags: [Search]
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
        - name: type
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 20, default: 8 }
      responses:
        '200':
          description: Suggestions, best first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Suggestion' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /v1/index/status:
    get:
      operationId: getIndexStatus
      summary: How far the index is behind the events
      tags: [Index]
      responses:
        '200':
          description: The status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IndexStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/index:rebuild:
    post:
      operationId: rebuildIndex
      summary: Rebuild the index from the state service
      description: Internal principal only; one account, or every account when none is given. The index keeps serving while it rebuilds.
      tags: [Index]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                accountId: { $ref: '#/components/schemas/AccountId' }
      responses:
        '202':
          description: The run
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RebuildRun' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/index/rebuilds/{runId}:
    parameters:
      - name: runId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getRebuild
      summary: A rebuild run's progress
      tags: [Index]
      responses:
        '200':
          description: The run
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RebuildRun' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    consoleJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "The console's internal JWT, signed by the BFF (ES256, `kid` in the header, verified against its `/.well-known/jwks.json`): `iss`, `aud`, `iat`, `exp`, `sub` (the console user id, or the service id on a service token), `acct` (the account the person acts in; absent on a service token), `region`, `groups` (the person's group names in the account), `roles` (the managed role names the person holds there, from the membership the identity service serves: `viewer`, `operator`, `account-admin`, `auditor`), `svc` (the calling service) and optionally `name` and `email`. Admin-only decisions test `roles` for `account-admin`, never a group name."
  parameters:
    AccountId:
      name: accountId
      in: query
      required: false
      description: The account to search; a console account may only name its own, the internal principal any
      schema: { $ref: '#/components/schemas/AccountId' }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    After:
      name: after
      in: query
      required: false
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, maxLength: 255 }
  responses:
    BadRequest:
      description: A query the parser refuses
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: No valid JWT
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Unknown
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: A rebuild is already running
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: 'Over the account''s query budget'
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Wfrn:
      type: string
      maxLength: 1024
      pattern: '^wfrn:[a-z0-9-]{1,32}:[a-z0-9-]{2,32}:(|[a-z0-9-]{2,32}):(|[0-9]{12}):[a-z0-9-]{1,64}/[a-z0-9-]{1,128}(/[a-z0-9-]{1,128})*$'
    AccountId:
      type: string
      pattern: '^[0-9]{12}$'
    RegionName:
      type: string
      pattern: '^[a-z0-9-]{2,32}$'
    Cursor:
      type: [string, 'null']
    ResourceState:
      type: string
      enum: [pending, active, updating, deleting, deleted, failed]
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        problems:
          type: array
          items:
            type: object
            required: [code, message]
            properties:
              code: { type: string }
              field: { type: string }
              message: { type: string }
        correlationId: { type: string }
    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [UP, DOWN, OUT_OF_SERVICE, UNKNOWN] }
        components: { type: object, additionalProperties: true }
    SearchHit:
      type: object
      required: [wfrn, type, service, region, state, score]
      properties:
        wfrn: { $ref: '#/components/schemas/Wfrn' }
        type: { type: string }
        service: { type: string }
        region: { $ref: '#/components/schemas/RegionName' }
        name: { type: string }
        state: { $ref: '#/components/schemas/ResourceState' }
        drift: { type: boolean }
        tags:
          type: object
          additionalProperties: { type: string }
        score: { type: number }
        highlights:
          type: object
          description: Per field, the matching text with the match wrapped in `<em>`
          additionalProperties: { type: string }
        updatedAt: { type: string, format: date-time }
    Suggestion:
      type: object
      required: [kind, value, label]
      properties:
        kind: { type: string, enum: [resource, type, tag, wfrn] }
        value: { type: string, description: What to put in the query or the path }
        label: { type: string }
        type: { type: string }
        wfrn: { $ref: '#/components/schemas/Wfrn' }
    IndexStatus:
      type: object
      required: [documents, lagSeconds, lastEventAt]
      properties:
        documents: { type: integer }
        lagSeconds: { type: number, description: How far the newest applied event is behind now }
        lastEventAt: { type: string, format: date-time }
        rebuilding: { type: boolean }
    RebuildRun:
      type: object
      required: [runId, status, startedAt]
      properties:
        runId: { type: string }
        accountId: { $ref: '#/components/schemas/AccountId' }
        status: { type: string, enum: [running, succeeded, failed] }
        startedAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time }
        indexed: { type: integer }
        error: { type: string }
