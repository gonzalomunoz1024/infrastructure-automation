      tags: [Search]
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, maxLength: 256 }
        - name: type
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/After'
      responses:
        '200':
          description: One page of hits
          content:
            application/json:
              schema:
                type: object
