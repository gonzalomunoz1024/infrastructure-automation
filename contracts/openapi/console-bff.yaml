                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Notification' }
                  next: { $ref: '#/components/schemas/Cursor' }
                  unread: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /console/v1/notifications:read:
    post:
      operationId: markNotificationsRead
      summary: Mark notifications read
      tags: [Notifications]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: '`ids` (at most 200), or `all: true`'
              properties:
                ids:
                  type: array
                  maxItems: 200
                  items: { type: string }
                all: { type: boolean }
      responses:
        '200':
          description: What is left unread
          content:
            application/json:
              schema:
                type: object
                required: [unread]
                properties:
                  unread: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /console/v1/notification-settings:
    get:
      operationId: getNotificationSettings
      summary: Where the person is notified of what
      tags: [Notifications]
      responses:
        '200':
          description: The settings
