  /console/v1/favourites:
    get:
      operationId: listFavourites
      summary: The session account's favourite resources
      description: Newest first, at most 100, leaving out the ones whose type the person may no longer list. Favourite services stay `Preferences.pinnedTypes`.
      tags: [Recent and favourites]
      responses:
        '200':
