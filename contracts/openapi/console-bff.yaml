  /console/v1/suggest:
    get:
      operationId: suggest
      summary: Type-ahead over names, wfrns, tags and types
      tags: [Search]
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 20, default: 8 }
      responses:
        '200':
          description: Suggestions
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Suggestion' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /console/v1/iam/{collection}:
    parameters:
      - $ref: '#/components/parameters/IamCollection'
    get:
      operationId: listIam
      summary: List an IAM collection of the session's account
      description: 'Passes through to `GET /v1/accounts/{accountId}/{collection}` of the identity service; the page shape and the items are its'
      tags: [IAM]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/After'
      responses:
        '200': { $ref: '#/components/responses/IamAnswer' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createIam
      summary: Create in an IAM collection of the session's account
      description: 'Passes through to the identity service''s POST with the body unchanged; the status (201, or 200 for an access key, whose secret is answered this once) and the body are its'
      tags: [IAM]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IamBody' }
      responses:
        '200': { $ref: '#/components/responses/IamAnswer' }
        '201': { $ref: '#/components/responses/IamAnswer' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /console/v1/iam/{collection}/{id}:
    parameters:
      - $ref: '#/components/parameters/IamCollection'
      - $ref: '#/components/parameters/IamId'
    get:
      operationId: getIam
      summary: One IAM record of the session's account
      tags: [IAM]
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200': { $ref: '#/components/responses/IamAnswer' }
        '304': { description: Unchanged }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateIam
      summary: Change an IAM record
      description: 'For users, groups, roles and quotas, as the identity service''s PATCH; `If-Match` carries the version and 409 says it moved on'
      tags: [IAM]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IamBody' }
      responses:
        '200': { $ref: '#/components/responses/IamAnswer' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    put:
      operationId: replaceIam
      summary: Replace an IAM record
      description: 'For policies, as the identity service''s PUT'
      tags: [IAM]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IamBody' }
      responses:
        '200': { $ref: '#/components/responses/IamAnswer' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      operationId: deleteIam
      summary: Remove an IAM record
      tags: [IAM]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204': { description: Removed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /console/v1/iam/{collection}/{id}:{action}:
    parameters:
      - $ref: '#/components/parameters/IamCollection'
      - $ref: '#/components/parameters/IamId'
      - $ref: '#/components/parameters/IamAction'
    post:
      operationId: iamAction
      summary: An IAM record's action
      description: '`rotate` on an access key (the new secret is answered this once) and `request-increase` on a quota, as the identity service''s `:{action}` operations'
      tags: [IAM]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IamBody' }
      responses:
        '200': { $ref: '#/components/responses/IamAnswer' }
        '202': { $ref: '#/components/responses/IamAnswer' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /console/v1/access-requests:
    get:
      operationId: listAccessRequests
      summary: Access requests
      description: '`scope=mine` (the default) lists the person''s own requests; `scope=account` lists every request of the account, for its admins'
      tags: [Access requests]
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/AccessRequestStatus' }
        - name: scope
          in: query
          schema: { type: string, enum: [mine, account], default: mine }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/After'
      responses:
        '200':
          description: One page
          content:
            application/json:
              schema:
                type: object
                required: [items, next]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AccessRequest' }
                  next: { $ref: '#/components/schemas/Cursor' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createAccessRequest
      summary: Ask for an action a denial marked requestable
      description: 'Opens a request to the account''s admins; the same open request (same action, resource and role) answers 409 with the existing one'
      tags: [Access requests]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccessRequestInput' }
      responses:
        '202':
          description: The request, pending
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessRequest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: The same request is already open
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessRequest' }
  /console/v1/access-requests/{requestId}:decide:
    parameters:
      - name: requestId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: decideAccessRequest
      summary: Approve or reject an access request
      description: 'For the account''s admins; approving grants the suggested role (or the role asked for) and the requester''s next session carries it'
      tags: [Access requests]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccessDecision' }
      responses:
        '202':
          description: The request, decided
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessRequest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /.well-known/jwks.json:
    get:
      operationId: getJwks
      summary: The BFF's public keys
      description: The keys the other console services verify this service's internal tokens and X-On-Behalf-Of assertions with (RFC 7517); the current key and the previous one during a rotation, each with a `kid`
      tags: [Keys]
      security: []
      responses:
        '200':
          description: The key set
          headers:
            Cache-Control:
              schema: { type: string }
              description: 'public, max-age=300'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JsonWebKeySet' }
  /internal/v1/token:
    post:
      operationId: issueServiceToken
      summary: A service token for a console service
      description: |
        OAuth 2.0 client credentials (RFC 6749 §4.4) with a JWT client assertion (RFC 7523 §2.2).
        The assertion is either the caller's projected Kubernetes service-account token, audience
        `console-bff`, issued by the cluster the BFF trusts to a service account registered for a
        client; or a JWT the client signs with a key registered for it: `iss` and `sub` the client
        id, `aud` containing `console-bff`, `iat`, `exp` at most 5 minutes after `iat`, and a `jti`
        never used before. Asymmetric algorithms only (ES256, ES384, RS256, PS256).

        The answer is an internal JWT of the BFF (ES256, its JWKS): `iss` `console-bff`, `aud` the
        services asked for (each registered for the client; all of them when none is asked),
        `sub` and `svc` the client id, `iat`, `exp`, `jti`, and no `acct`, which every console service
        treats as the console-internal principal. Errors are RFC 6749 §5.2 bodies. Not routed by
        the ingress: in-cluster callers only.
      tags: [Service tokens]
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: { $ref: '#/components/schemas/ServiceTokenRequest' }
            encoding:
              audience: { style: form, explode: true }
      responses:
        '200':
          description: The token
          headers:
            Cache-Control:
              schema: { type: string }
              description: no-store
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceToken' }
        '400':
          description: '`invalid_request` (a field is missing or malformed), `unsupported_grant_type`, `invalid_target` (an audience the client is not registered for)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }
        '401':
          description: '`invalid_client`: the assertion does not verify, has expired or was used before, or names no registered client'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }
  /console/v1/preferences:
    get:
      operationId: getPreferences
      summary: The user's preferences
      tags: [Preferences]
      responses:
        '200':
          description: The preferences
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Preferences' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      operationId: putPreferences
      summary: Replace the user's preferences
      tags: [Preferences]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Preferences' }
      responses:
        '200':
          description: The preferences
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Preferences' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /console/v1/insights:
    get:
      operationId: getInsights
      summary: The executive home's numbers for the person's estate
      description: |
        What the console has done for the accounts the person may read insights in (`insights:get`
        on each; `scope=account` narrows it to the session's account): resources managed now and at
        the start of the period, requests and how many were self-served, the lead time from request
        to running against the baseline of today's tickets and the hours that saved, drift found and
        fixed, and adoption week by week. The BFF computes them from the state service's records and
        the platform's jobs. The ticket baseline is configuration (`console.insights.baseline`), a
        one-off export of the current ticket queue; without one, `leadTime` has no baseline and
        `hoursSaved` is absent. Spend is not here: the executive home reads it from
        `GET /console/v1/cost?scope=organization&groupBy=costCentre` (the cost service's contract).
      tags: [Insights]
      parameters:
        - name: period
          in: query
          schema: { type: string, enum: [7d, 30d, 90d], default: 30d }
        - name: scope
          in: query
          schema: { type: string, enum: [account, organization], default: organization }
      responses:
        '200':
          description: The numbers
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Insights' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '502': { $ref: '#/components/responses/BadGateway' }
  /console/v1/search:interpret:
    get:
      operationId: interpretSearch
      summary: Plain English read as the list's own filter
      description: |
        Passes through to the search indexer's `GET /v1/search:interpret` for the session's account
        (`contracts/openapi/console-search-indexer.yaml` 1.2.0) with its answer unchanged. The
        filter uses the list's own names, so the console turns it into a list link (its `f` and
        `sort` query); nothing runs. Given `type`, the reading stays within that type, and another
        type named in the text goes to `unparsed`.
      tags: [Search]
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 500 }
        - name: type
          in: query
          schema: { type: string }
      responses:
        '200':
          description: The reading
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchInterpretation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '502': { $ref: '#/components/responses/BadGateway' }
  /console/v1/search:counts:
    get:
      operationId: countResourcesBy
      summary: Resources counted by one grouping, in the account or across the person's accounts
      description: |
        Passes through to the search indexer's `GET /v1/counts` with `groupBy` and the same filters
        as search (`contracts/openapi/console-search-indexer.yaml` 1.2.0). With
        `scope=organization` the BFF resolves the accounts the person may list in and calls as the
        console-internal principal with `accountId` repeated (at most 200), so a person's own token
        never names another account. The BFF adds `asOf`, the indexer's `lastEventAt` from
        `/v1/index/status`. At most 100 groups, largest first.
      tags: [Search]
      parameters:
        - name: groupBy
          in: query
          required: true
          schema: { type: string, pattern: '^(type|service|state|region|account|tag:[A-Za-z0-9._:/-]{1,128})$' }
        - name: scope
          in: query
          schema: { type: string, enum: [account, organization], default: account }
        - name: q
          in: query
          schema: { type: string, maxLength: 500 }
        - name: type
          in: query
          schema: { type: string }
        - name: state
          in: query
          schema: { $ref: '#/components/schemas/ResourceState' }
        - name: drift
          in: query
          schema: { type: boolean }
      responses:
        '200':
          description: The groups
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupedCounts' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '502': { $ref: '#/components/responses/BadGateway' }
  /console/v1/assistant/turns:
    post:
      operationId: askAssistant
      summary: Ask the copilot, or ask it to explain a resource
      description: |
        Starts a turn of a conversation with the console copilot, which sits behind the BFF's
        `AssistantPort` (the firm's Devin API first; a faster model later is another adapter on the
        same port, not a redesign). A turn takes seconds to minutes, so the answer is read from the
        conversation, `GET /console/v1/assistant/conversations/{conversationId}`, which the console
        polls while the turn is `thinking`.

        The copilot reads only what the person may read, with the person's own session, and never
        acts. It answers in words and in proposals: a filtered list, a pre-filled create wizard, a
        pre-filled action, or a page. The console opens a proposal for the person to review, and
        every change still goes through its preview and IAM. `intent: explain` explains
        `context.wfrn`: what it is, its configuration, cost, history and dependents. A person's
        turns are limited to 10 a minute (429 with `Retry-After`); conversations are the person's
        own and kept for 24 hours.
      tags: [Assistant]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssistantAsk' }
      responses:
        '202':
          description: The turn is under way
          content:
            application/json:
              schema:
                type: object
                required: [conversationId, turnId]
                properties:
                  conversationId: { type: string }
                  turnId: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '502': { $ref: '#/components/responses/BadGateway' }
  /console/v1/assistant/conversations/{conversationId}:
    parameters:
      - name: conversationId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getAssistantConversation
      summary: A conversation with the copilot, its answers and proposals
      description: Another person's conversation, or one older than 24 hours, answers 404.
      tags: [Assistant]
      responses:
        '200':
          description: The conversation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssistantConversation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /console/v1/jobs/{jobId}/explanation:
    parameters:
      - $ref: '#/components/parameters/JobIdPath'
    get:
      operationId: explainJobFailure
      summary: Why a job failed, and the fix to try
      description: |
        For a job that failed, or that waits on a failed step (`needs-attention`): the cause in plain
        words, the failing step, a suggested fix, whether the person may retry, and how often the
        same failure happened in the account in the last 30 days. Rules over the platform's error
        classes answer first (`source: rules`); the copilot answers what they cannot
        (`source: assistant`). A fix may carry `input`, a merge over the job's input; the console
        shows it to the person and sends it, with `fromStep`, as the body of
        `POST /console/v1/jobs/{jobId}:retry`, the phase 4 retry, which reruns the job with the input
        merged over the original (the platform's `:rerun`), so secrets never travel back. Asking for
        an explanation retries nothing. Any other job answers 409 `job.not-failed`.
      tags: [Jobs]
      responses:
        '200':
          description: The explanation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobExplanation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '502': { $ref: '#/components/responses/BadGateway' }
  /auth/device:
    post:
      operationId: startDeviceAuthorization
      summary: Start signing the CLI or an SDK in (RFC 8628)
      description: |
        The device authorization request of OAuth 2.0's device grant (RFC 8628 §3.1). The CLI shows
        `user_code` and `verification_uri` (the web app's `#/device` page) and polls
        `POST /auth/token` every `interval` seconds until the person approves or denies it in a
        signed-in browser. `user_code` is eight letters from `BCDFGHJKLMNPQRSTVWXZ` written
        `XXXX-XXXX`; only a SHA-256 of `device_code` is kept. At most ten grants a minute from one
        address (429 `slow_down`).
      tags: [Device sign-in]
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [client_id]
              properties:
                client_id: { type: string, enum: [console-cli, console-sdk] }
      responses:
        '200':
          description: The codes
          headers:
            Cache-Control:
              schema: { type: string }
              description: no-store
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceAuthorization' }
        '400':
          description: '`invalid_client`: an unknown client_id'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }
        '429':
          description: '`slow_down`: too many grants from one address'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }
  /auth/token:
    post:
      operationId: issueApiToken
      summary: Redeem an approved device grant, or refresh
      description: |
        The token request of the device grant (RFC 8628 §3.4) and the refresh grant (RFC 6749 §6).
        While the person has not decided, the answer is 400 `authorization_pending`; polling sooner
        than the grant's `interval` is `slow_down` and adds 5 seconds to it; a denied grant is
        `access_denied`, an expired one `expired_token`, and a device code is redeemed once
        (`invalid_grant` after). An approved grant opens an API session and answers a 15-minute
        access token with a refresh token.

        **Refresh tokens rotate**: each refresh answers a new one and ends the old one; a rotated
        refresh token presented again revokes the whole API session (`invalid_grant`). A refresh
        reads the person's memberships from the identity service again, as a sign-in does. An API
        session lasts 12 hours from its approval and ends after 8 hours with no refresh.

        **The access token** is a JWT the BFF signs with its own key (its JWKS), header
        `typ: at+jwt` (RFC 9068): `iss` the BFF, `aud` `console-api`, `sub` the person, `sid` the
        API session, `client_id`, `auth_time` (the browser sign-in that approved the grant),
        `iat`, `exp`, `jti`. No other console service accepts it, and the BFF accepts no internal
        token in its place.
      tags: [Device sign-in]
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: { $ref: '#/components/schemas/ApiTokenRequest' }
      responses:
        '200':
          description: The tokens
          headers:
            Cache-Control:
              schema: { type: string }
              description: no-store
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiToken' }
        '400':
          description: '`invalid_request`, `unsupported_grant_type`, `authorization_pending`, `slow_down`, `access_denied`, `expired_token` or `invalid_grant`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }
        '401':
          description: '`invalid_client`: an unknown client_id, or not the one the grant was started for'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }
  /auth/revoke:
    post:
      operationId: revokeApiToken
      summary: Sign the CLI or an SDK out (RFC 7009)
      description: Revokes the API session a refresh token belongs to. The answer is 200 whatever the token was, as RFC 7009 has it.
      tags: [Device sign-in]
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
                token_type_hint: { type: string, enum: [refresh_token] }
      responses:
        '200':
          description: Revoked, or nothing to revoke
  /console/v1/device-grants/{userCode}:
    parameters:
      - $ref: '#/components/parameters/UserCodePath'
    get:
      operationId: getDeviceGrant
      summary: A device grant waiting for the person's decision
      description: What the `#/device` page shows before the person approves. The code is matched case-insensitively with or without its hyphen.
      tags: [Device sign-in]
      security:
        - session: []
      responses:
        '200':
          description: The grant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceGrant' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /console/v1/device-grants/{userCode}:approve:
    parameters:
      - $ref: '#/components/parameters/UserCodePath'
    post:
      operationId: approveDeviceGrant
      summary: Sign the CLI or SDK in as this person
      description: 'Browser sessions only (403 `browser.only` with a bearer token). Approving needs a fresh sign-in, as a delete does: past `console.auth.step-up.max-age` it is the step-up 403. A grant is decided once (409 `device-grant.decided`) and never after it expired (410 `device-grant.expired`).'
      tags: [Device sign-in]
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: Approved; the CLI's next poll gets its tokens
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceGrant' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { $ref: '#/components/responses/Gone' }
  /console/v1/device-grants/{userCode}:deny:
    parameters:
      - $ref: '#/components/parameters/UserCodePath'
    post:
      operationId: denyDeviceGrant
      summary: Refuse a device grant
      tags: [Device sign-in]
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: Denied; the CLI's next poll gets `access_denied`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceGrant' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { $ref: '#/components/responses/Gone' }
  /console/v1/api-sessions:
    get:
      operationId: listApiSessions
      summary: The person's CLI and SDK sign-ins
      description: Newest first, the open ones only.
      tags: [API sessions]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/After'
      responses:
        '200':
          description: One page
          content:
            application/json:
              schema:
                type: object
                required: [items, next]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ApiSession' }
                  next: { $ref: '#/components/schemas/Cursor' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /console/v1/api-sessions/{apiSessionId}:
    delete:
      operationId: revokeApiSession
      summary: Sign one CLI or SDK out
      description: Its refresh token stops working at once and its access token within 15 minutes. Another person's session is a 404.
      tags: [API sessions]
      parameters:
        - name: apiSessionId
          in: path
          required: true
          schema: { type: string, pattern: '^aps_[0-9a-z]{26}$' }
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Revoked
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /console/v1/chat-links:
    get:
      operationId: listChatLinks
      summary: The person's linked Slack and Teams identities
      tags: [ChatOps]
      responses:
        '200':
          description: The links
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ChatLink' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: createChatLink
      summary: Link a chat identity to this person
      description: 'The `token` comes from the chat app''s answer to `/console link` (the `#/chat-link?token=` page): a BFF-signed token, audience `console-chat-link`, ten minutes, naming the platform, the workspace and the chat user. Browser sessions only. One person per chat user (409 `chat-link.taken`).'
      tags: [ChatOps]
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '201':
          description: Linked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatLink' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /console/v1/chat-links/{linkId}:
    delete:
      operationId: deleteChatLink
      summary: Unlink a chat identity
      tags: [ChatOps]
      parameters:
        - name: linkId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Unlinked
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /chatops/slack/commands:
    post:
      operationId: slackCommand
      summary: A Slack slash command (`/console …`)
      description: |
        Verified with Slack's signature: `X-Slack-Signature` is `v0=` and the HMAC-SHA256 of
        `v0:<X-Slack-Request-Timestamp>:<raw body>` under the signing secret, the timestamp within
        five minutes; anything else is a 401. Acknowledged at once (Slack waits 3 seconds); the
        answer follows through the command's `response_url`. Commands: `find <text>`, `show <wfrn>`,
        `jobs`, `run <verb> <wfrn>` (the preview with Confirm and Cancel), `approve`,
        `account <id> [region]`, `subscribe <kind…>`, `unsubscribe`, `subscriptions`, `link`,
        `unlink`, `help`. Each runs as the linked person through the console's own IAM; a chat call
        never satisfies a step-up, so a destructive verb answers with a link to the console. 404
        while Slack is not configured.
      tags: [ChatOps]
      security: []
      parameters:
        - { name: X-Slack-Signature, in: header, required: true, schema: { type: string } }
        - { name: X-Slack-Request-Timestamp, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: { type: object, additionalProperties: { type: string } }
      responses:
        '200':
          description: The acknowledgement, an ephemeral Slack message
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /chatops/slack/interactions:
    post:
      operationId: slackInteraction
      summary: A button pressed in a Slack message
      description: Verified like the commands. Confirm re-decides the action as the linked person before it runs; an approval button decides as the person, once.
      tags: [ChatOps]
      security: []
      parameters:
        - { name: X-Slack-Signature, in: header, required: true, schema: { type: string } }
        - { name: X-Slack-Request-Timestamp, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [payload]
              properties:
                payload: { type: string, description: 'Slack''s interaction payload, JSON' }
      responses:
        '200':
          description: Taken; the message is updated through its `response_url`
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /chatops/teams/messages:
    post:
      operationId: teamsMessage
      summary: A message or card action sent to the Teams bot
      description: 'Verified with the Bot Framework''s JWT: keys from its OpenID configuration (`https://login.botframework.com/v1/.well-known/openidconfiguration`), `aud` the bot''s app id, `iss` `https://api.botframework.com`; anything else is a 401. The same commands and buttons as Slack. 404 while Teams is not configured.'
      tags: [ChatOps]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, description: A Bot Framework activity, additionalProperties: true }
      responses:
        '200':
          description: Taken
        '202':
          description: Taken; the answer follows as a proactive message
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /console/v1/notifications:
    get:
      operationId: listNotifications
      summary: The person's notifications, newest first
      description: Across the person's accounts, each naming its account; kept 90 days. The live stream carries the new ones as `notification` events.
      tags: [Notifications]
      parameters:
        - { name: unread, in: query, schema: { type: boolean } }
        - { name: kind, in: query, schema: { $ref: '#/components/schemas/NotificationKind' } }
        - { name: accountId, in: query, schema: { $ref: '#/components/schemas/AccountId' } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/After'
      responses:
