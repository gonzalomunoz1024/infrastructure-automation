openapi: 3.1.0
x-status: draft
info:
  title: console-identity-service
  version: 1.0.0
  summary: Console accounts, their users, groups, roles, policies, access keys and quotas, and the authorization decisions every other service asks for.
  description: |
    Phase 0 draft: the names, the paths and the rules below are agreed; field lists will grow.

    **Account scope.** Every path under `/v1/accounts/{accountId}` is scoped by the caller's
    account, the `acct` claim of its internal JWT: a call whose `{accountId}` is another account
    answers 404, never 403. The console-internal principal (`svc` claim) may act on any account;
    the BFF carries the user's account. Within an account, what a user may do is decided by the
    account's roles and policies (`POST /v1/authorize`).

    **Paging.** Lists answer `{ items, next }`; `next` is an opaque cursor, null on the last page,
    sent back as `after`. `limit` is 1 to 200, 50 by default (the plan's cap for every console API).

    **Errors.** `{ error, problems?, denied?, correlationId? }`: 400 bad input, 401 no valid JWT,
    403 the account's roles and policies deny it, with `denied` (a `Denial`: `layer: console-iam`,
    the action and resource checked, the reason, the role, policy and statement that decided,
    whether access may be requested and which managed role would allow it; the same fields an
    `authorize` decision carries), 404 unknown or out of scope, 409 a conflict (a name in use, a
    version mismatch), 429 over a quota.

    **Managed IAM.** Every account is born with four managed roles, `viewer`, `operator`,
    `account-admin` and `auditor` (shown as Viewer, Operator, Admin and Auditor), their policies,
    and four groups that hold them: `viewers`, `members` (operator; the account's owning identity
    provider team joins it at sign-in), `owners` (account-admin) and `auditors`. Managed roles keep
    their names and policies; `owners` keeps the account-admin role and at least one member. Every
    managed role reads cost and budgets (`cost:get`, `cost:list`, `budgets:get`, `budgets:list`,
    decision 25); exporting the chargeback (`cost:export`) is `account-admin`'s and `auditor`'s,
    and `budgets:create`, `budgets:update` and `budgets:delete` are `account-admin`'s alone. A
    release that changes a managed policy reaches the accounts made before it: at start the service
    replaces each managed policy of an account that is not closed which differs from the release's,
    in place, with a `PolicyChanged` of action `updated` by `svc:console-identity-service`. The
    internal JWT the BFF signs carries the person's `groups` and `roles` (the membership this
    service serves), so every service decides admin-only things on `roles` containing
    `account-admin`, never on a group name.

    **Names and ids.** The console's own IAM records are wfrns too, in the `iam` service with an
    empty region (they live in no region) and kebab-case kinds: `user`, `group`, `role`, `policy`,
    `access-key`, `quota`, `access-request`, as in
    `wfrn:wf:iam::123456789012:access-request/areq_01jbx9r2m4k9d3c8f5r6t1w0yd`; policies name them
    with patterns such as `wfrn:wf:iam::123456789012:access-request/*`. Ids are a prefix and a
    ULID: `user_`, `grp_`, `role_`, `pol_`, `ck_` (access keys), `qreq_` (quota requests), `areq_`
    (access requests). A group's `roles` are served as role ids (input takes ids or names) and its
    `members` as user ids; a user's `groups` are group names.

    **Versions.** Accounts, policies, roles, groups and users carry a `version` that grows by one
    per change; the `identity.changes` events (`contracts/asyncapi/console-events.yaml`) carry the
    same versions, so a cache can tell what it has applied. A write may send `If-Match: <version>`
    and gets 409 when the record moved on.

    **Secrets.** An access key's secret is answered once, by the call that creates or rotates it,
    and never stored in clear or returned again. Events and reads carry the key id only.

    **Resources in policies** are wfrn patterns (`contracts/wfrn/SPEC.md`), and `POST /v1/authorize`
    takes wfrns or patterns as the resource of each check.

    **Internal operations** (`/internal/...` and `GET /v1/accounts/{accountId}/platform-credentials`)
    serve the console's own services and OPA, never a user: a user's JWT answers 404 there.
  contact:
    name: Customer console hub (console-root)
servers:
  - url: /
tags:
  - name: Principals
  - name: Accounts
  - name: Users
  - name: Groups
  - name: Roles
  - name: Policies
  - name: Access keys
  - name: Quotas
  - name: Access requests
    description: A person asks for an action a denial marked requestable; an account admin decides
  - name: Guardrails
    description: 'The organization''s guardrails over every account''s roles, like AWS service control policies; written by the internal principal for an organization admin'
  - name: Access reviews
    description: Campaigns in which an account's admins keep or revoke who holds which group; what is left undecided expires at the due date
  - name: Authorization
  - name: Internal
    description: For the console's own services (the `svc` claim) and OPA; a user's JWT answers 404
  - name: Health
security:
  - consoleJwt: []
paths:
  /actuator/health:
    get:
      operationId: health
      summary: Liveness and readiness
      tags: [Health]
      security: []
      responses:
        '200':
          description: Up
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '503':
          description: Down
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
  /v1/principals:resolve:
    post:
      operationId: resolvePrincipal
      summary: Resolve an identity provider's user to a console user and accounts
      description: The BFF's call after the OIDC callback; creates the user on first sign-in when the issuer is trusted and the user's groups map to an account.
      tags: [Principals]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [issuer, subject]
              properties:
                issuer: { type: string }
                subject: { type: string }
                email: { type: string }
                name: { type: string }
                groups:
                  type: array
                  items: { type: string }
      responses:
        '200':
          description: The user and the accounts they may use
          content:
            application/json:
              schema:
                type: object
                required: [user, accounts]
                properties:
                  user: { $ref: '#/components/schemas/User' }
                  accounts:
                    type: array
                    items: { $ref: '#/components/schemas/AccountMembership' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/authorize:
    post:
      operationId: authorize
      summary: Decide a batch of checks
      description: 'Up to 100 checks for one principal, answered in order; a deny or an absent allow is `allowed: false` with the reason. Services cache decisions until the next `identity.changes` event of the account.'
      tags: [Authorization]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthorizeRequest' }
      responses:
        '200':
          description: One decision per check
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthorizeResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/accounts:
    get:
      operationId: listAccounts
      summary: List accounts
      description: The internal principal lists every account; a user's call answers the accounts they belong to.
      tags: [Accounts]
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/AccountStatus' }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/After'
      responses:
        '200':
          description: One page
          content:
            application/json:
              schema:
                type: object
                required: [items, next]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Account' }
                  next: { $ref: '#/components/schemas/Cursor' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: createAccount
      summary: Create an account
      description: Internal principal only. Mints the twelve-digit account id, creates the four managed roles and their groups (`owners` holds `account-admin`), and asks the platform for the account's console service account (P-03).
      tags: [Accounts]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, owningTeam, ownerEmail]
              properties:
                name: { type: string, maxLength: 64 }
                owningTeam: { type: string, description: The platform team that owns the account's resources }
                costCentre: { type: string, maxLength: 64, description: 'The finance cost centre the account is charged to; trimmed, and a blank one is none' }
                ownerEmail: { type: string, format: email }
                defaultRegion: { $ref: '#/components/schemas/RegionName' }
      responses:
        '201':
          description: The account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/accounts/{accountId}:
    parameters:
      - $ref: '#/components/parameters/AccountIdPath'
    get:
      operationId: getAccount
      summary: Get an account
      tags: [Accounts]
      responses:
        '200':
          description: The account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateAccount
      summary: Change an account's name, status, default region or cost centre
      description: 'A user needs `account:update` on the account (the account-admin role has it), so a suspended or closed account changes only by the internal principal. Only the internal principal changes `status`, and never to `closed` (that is `POST /v1/accounts/{accountId}:close`, a 400 here); a closed account''s status no longer changes (409). `suspended` is reversible.'
      tags: [Accounts]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 64 }
                status: { $ref: '#/components/schemas/AccountStatus' }
                defaultRegion: { $ref: '#/components/schemas/RegionName' }
                costCentre: { type: string, maxLength: 64, description: 'Absent keeps it; an empty string clears it' }
      responses:
        '200':
          description: The account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/accounts/{accountId}/users:
    parameters:
      - $ref: '#/components/parameters/AccountIdPath'
    get:
      operationId: listUsers
      summary: List an account's users
      tags: [Users]
      parameters:
        - name: q
          in: query
          description: A name or email prefix
          schema: { type: string }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/After'
      responses:
        '200':
          description: One page
          content:
            application/json:
              schema:
                type: object
                required: [items, next]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/User' }
                  next: { $ref: '#/components/schemas/Cursor' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: addUser
      summary: Add a user to the account
      tags: [Users]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
                name: { type: string }
                groups:
                  type: array
                  items: { type: string }
      responses:
        '201':
          description: The user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/accounts/{accountId}/users/{userId}:
    parameters:
      - $ref: '#/components/parameters/AccountIdPath'
      - name: userId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getUser
      summary: Get a user
      tags: [Users]
      responses:
        '200':
          description: The user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateUser
      summary: Change a user's name, status or groups
      tags: [Users]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                status: { type: string, enum: [active, suspended] }
                groups:
                  type: array
                  items: { type: string }
      responses:
        '200':
          description: The user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      operationId: removeUser
      summary: Remove a user from the account
      tags: [Users]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Removed
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/accounts/{accountId}/groups:
    parameters:
      - $ref: '#/components/parameters/AccountIdPath'
    get:
      operationId: listGroups
      summary: List an account's groups
      tags: [Groups]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/After'
      responses:
        '200':
          description: One page
          content:
            application/json:
              schema:
                type: object
                required: [items, next]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Group' }
                  next: { $ref: '#/components/schemas/Cursor' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createGroup
      summary: Create a group
      tags: [Groups]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GroupInput' }
      responses:
        '201':
          description: The group
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Group' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/accounts/{accountId}/groups/{groupId}:
    parameters:
      - $ref: '#/components/parameters/AccountIdPath'
      - name: groupId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getGroup
      summary: Get a group
      tags: [Groups]
      responses:
        '200':
          description: The group
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Group' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateGroup
      summary: Change a group's name, roles or members
      tags: [Groups]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GroupInput' }
      responses:
        '200':
          description: The group
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Group' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      operationId: deleteGroup
      summary: Delete a group
      description: The owners group cannot be deleted (409).
      tags: [Groups]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Deleted
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/accounts/{accountId}/roles:
    parameters:
      - $ref: '#/components/parameters/AccountIdPath'
    get:
      operationId: listRoles
      summary: List an account's roles
      tags: [Roles]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/After'
      responses:
        '200':
          description: One page
          content:
            application/json:
              schema:
                type: object
                required: [items, next]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Role' }
                  next: { $ref: '#/components/schemas/Cursor' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createRole
      summary: Create a role
      tags: [Roles]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleInput' }
      responses:
        '201':
          description: The role
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Role' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/accounts/{accountId}/roles/{roleId}:
    parameters:
      - $ref: '#/components/parameters/AccountIdPath'
      - name: roleId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getRole
      summary: Get a role
      tags: [Roles]
      responses:
        '200':
          description: The role
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Role' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateRole
      summary: Change a role's name or policies
      tags: [Roles]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleInput' }
      responses:
        '200':
          description: The role
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Role' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      operationId: deleteRole
      summary: Delete a role
      description: A role a group still holds, and the `account-admin` role, cannot be deleted (409).
      tags: [Roles]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Deleted
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/accounts/{accountId}/policies:
    parameters:
      - $ref: '#/components/parameters/AccountIdPath'
    get:
      operationId: listPolicies
      summary: List an account's policies
      tags: [Policies]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/After'
      responses:
        '200':
          description: One page
          content:
            application/json:
              schema:
                type: object
                required: [items, next]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Policy' }
                  next: { $ref: '#/components/schemas/Cursor' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createPolicy
      summary: Create a policy
      tags: [Policies]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PolicyInput' }
      responses:
        '201':
          description: The policy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Policy' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/accounts/{accountId}/policies/{policyId}:
    parameters:
      - $ref: '#/components/parameters/AccountIdPath'
      - name: policyId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getPolicy
      summary: Get a policy
      tags: [Policies]
      responses:
        '200':
          description: The policy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Policy' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: replacePolicy
      summary: Replace a policy's document
      description: Every statement is checked (actions known, resources valid wfrn patterns) before anything is written.
      tags: [Policies]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PolicyInput' }
      responses:
        '200':
          description: The policy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Policy' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      operationId: deletePolicy
      summary: Delete a policy
      description: A policy a role still holds cannot be deleted (409).
      tags: [Policies]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Deleted
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/accounts/{accountId}/access-keys:
    parameters:
      - $ref: '#/components/parameters/AccountIdPath'
    get:
      operationId: listAccessKeys
      summary: List an account's access keys
      description: Key ids and their state only.
      tags: [Access keys]
      parameters:
        - name: userId
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/After'
      responses:
        '200':
          description: One page
          content:
            application/json:
              schema:
                type: object
                required: [items, next]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AccessKey' }
                  next: { $ref: '#/components/schemas/Cursor' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createAccessKey
      summary: Create an access key
      description: For API access to the console as a user; at most two active keys per user. The secret part is in this answer only.
      tags: [Access keys]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId: { type: string }
                description: { type: string, maxLength: 128 }
                expiresAt: { type: string, format: date-time }
      responses:
        '201':
          description: The key, with its secret part shown once
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessKeyCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/accounts/{accountId}/access-keys/{keyId}:
    parameters:
      - $ref: '#/components/parameters/AccountIdPath'
      - name: keyId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getAccessKey
      summary: Get an access key's id and state
      tags: [Access keys]
      responses:
        '200':
          description: The key
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessKey' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: revokeAccessKey
      summary: Revoke an access key
      tags: [Access keys]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Revoked
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/accounts/{accountId}/access-keys/{keyId}:rotate:
    parameters:
      - $ref: '#/components/parameters/AccountIdPath'
      - name: keyId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: rotateAccessKey
      summary: Rotate an access key
      description: A new secret part; the old one keeps working for ten minutes.
      tags: [Access keys]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: The key, with its new secret part shown once
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessKeyCreated' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/quota-rules:
    get:
      operationId: getQuotaRules
      summary: The rules that approve a quota increase at once, and who decides the rest
      description: 'The organization''s auto-approval rules, in the order they are read, for anyone signed in, so the console can say what is approved on the spot. A rule covers the keys its patterns name (`*` is any run of characters) and approves an ask of at most `maxFactor` times the current limit and never above `maxLimit`, once per `cooldown` for an account''s key (any rule''s approval of the key starts it). An ask no rule covers goes to `approver`.'
      tags: [Quotas]
      responses:
        '200':
          description: The rules
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuotaRules' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/accounts/{accountId}/quotas:
    parameters:
      - $ref: '#/components/parameters/AccountIdPath'
    get:
      operationId: listQuotas
      summary: An account's quotas and their use
      description: The console's quotas (resources per type, jobs per minute, access keys) with the platform's job-start bucket (P-10) read through.
      tags: [Quotas]
      responses:
        '200':
          description: The quotas
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Quota' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/accounts/{accountId}/quotas/{quotaKey}:
    parameters:
      - $ref: '#/components/parameters/AccountIdPath'
      - $ref: '#/components/parameters/QuotaKey'
    get:
      operationId: getQuota
      summary: Get a quota
      tags: [Quotas]
      responses:
        '200':
          description: The quota
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Quota' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: setQuota
      summary: Set a quota's limit
      description: 'Internal principal only; a `jobs-per-minute` change is also written to the platform (`PUT /api/v1/quotas/account:<accountId>`, P-10). A limit at or above an open quota request''s ask approves that request (it is moot); a lower limit leaves it open, since rejecting is `:decide`.'
      tags: [Quotas]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [limit]
              properties:
                limit: { type: integer, minimum: 0 }
                burst: { type: integer, minimum: 0 }
      responses:
        '200':
          description: The quota
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Quota' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/accounts/{accountId}/quotas/{quotaKey}:request-increase:
    parameters:
      - $ref: '#/components/parameters/AccountIdPath'
      - $ref: '#/components/parameters/QuotaKey'
    post:
      operationId: requestQuotaIncrease
      summary: Ask for a higher limit
      description: 'An ask above the current limit (one at or below it is a 400, code `not-an-increase`). The first of the organization''s auto-approval rules (`GET /v1/quota-rules`) that covers it approves it at once: the limit is set as an internal `PUT` sets it and the request comes back `approved`, `decidedBy` `rule:<name>`. Any other is routed to the approver (`routedTo`, the platform team) and stays open until they decide it (`POST /v1/accounts/{accountId}/quota-requests/{requestId}:decide`, or an internal `PUT` of the limit at or above the ask). One open request per quota key; a second answers 409. Every outcome arrives as a `QuotaChanged` event; the request itself is followed with `GET /v1/accounts/{accountId}/quota-requests/{requestId}`.'
      tags: [Quotas]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [limit, reason]
              properties:
                limit: { type: integer, minimum: 1 }
                reason: { type: string, minLength: 10, maxLength: 1000 }
      responses:
        '202':
          description: 'The request, `approved` by a rule or `open` and routed to the approver; `GET /v1/accounts/{accountId}/quota-requests/{requestId}` follows it'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuotaRequest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/accounts/{accountId}/access-requests:
    parameters:
      - $ref: '#/components/parameters/AccountIdPath'
    get:
      operationId: listAccessRequests
      summary: An account's access requests
      description: 'A person always sees their own. Seeing the account''s queue needs `access-request:get` and `access-request:list`, which the managed `account-admin` and `auditor` policies grant and the managed `viewer` and `operator` policies leave out (`notActions`), so admins, auditors, the internal principal and any group given those actions see the queue, and viewers do not.'
      tags: [Access requests]
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/AccessRequestStatus' }
        - name: requester
          in: query
          description: A user id; admins only
          schema: { type: string }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/After'
      responses:
        '200':
          description: One page
          content:
            application/json:
              schema:
                type: object
                required: [items, next]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AccessRequest' }
                  next: { $ref: '#/components/schemas/Cursor' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createAccessRequest
      summary: Ask for an action a denial marked requestable
      description: 'Opens a request to the account''s admins (an `AccessRequestChanged` event, subject `access-request`). `role` defaults to the denial''s `suggestedRole`; 400 when no managed role would allow the action, or when the requester is allowed it already. The same open request (same requester, action, resource and role) answers 409 with the existing one. A request still `pending` after 30 days expires (a sweep every 15 minutes), with an `AccessRequestChanged` of action `expired`.'
      tags: [Access requests]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccessRequestInput' }
      responses:
        '202':
          description: The request, pending
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessRequest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The same request is already open
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessRequest' }
  /v1/accounts/{accountId}/access-requests/{requestId}:
    parameters:
      - $ref: '#/components/parameters/AccountIdPath'
      - $ref: '#/components/parameters/RequestId'
    get:
      operationId: getAccessRequest
      summary: One access request
      tags: [Access requests]
      responses:
        '200':
          description: The request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/accounts/{accountId}/access-requests/{requestId}:decide:
    parameters:
      - $ref: '#/components/parameters/AccountIdPath'
      - $ref: '#/components/parameters/RequestId'
    post:
      operationId: decideAccessRequest
      summary: Approve or reject an access request
      description: 'Account admins only (`roles` holds `account-admin`). Approving adds the requester to the group that carries the role asked for (the denial''s suggested role by default), so their next session carries it; the request is then `approved`, an `AccessRequestChanged` event follows, and the joined group''s version moves with its own `GroupChanged`. A request already decided, expired or withdrawn answers 409.'
      tags: [Access requests]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccessDecision' }
      responses:
        '202':
          description: The request, decided
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessRequest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/accounts/{accountId}/quota-requests/{requestId}:
    parameters:
      - $ref: '#/components/parameters/AccountIdPath'
      - $ref: '#/components/parameters/RequestId'
    get:
      operationId: getQuotaRequest
      summary: One quota increase request
      tags: [Quotas]
      responses:
        '200':
          description: The request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuotaRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: withdrawQuotaRequest
      summary: Withdraw an open quota increase request
      description: By its requester, an account admin (`quota:set`) or the internal principal; a decided request answers 409.
      tags: [Quotas]
      responses:
        '204': { description: Withdrawn }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/accounts/{accountId}/quota-requests/{requestId}:decide:
    parameters:
      - $ref: '#/components/parameters/AccountIdPath'
      - $ref: '#/components/parameters/RequestId'
    post:
      operationId: decideQuotaRequest
      summary: Approve or reject a quota increase request
      description: 'Internal principal only (the platform team). Approving sets the quota''s limit to `limit`, the ask by default and possibly less or more, exactly as `PUT /v1/accounts/{accountId}/quotas/{quotaKey}` would (the platform write included), and a `QuotaChanged` event follows; rejecting leaves the limit and records the comment. A request already decided or withdrawn answers 409.'
      tags: [Quotas]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuotaDecision' }
      responses:
        '202':
          description: The request, decided
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuotaRequest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/accounts/{accountId}/policy-simulations:
    parameters:
      - $ref: '#/components/parameters/AccountIdPath'
    post:
      operationId: simulatePolicies
      summary: 'Ask what a person, a role or a set of groups may do, and what decides it'
      description: >-
        The policy simulator. Answers each check exactly as `POST /v1/authorize` would for the
        principal, over the account's current data with the unsaved `policies` laid over it (and,
        for a role, the draft `boundary` in place of its own); nothing is written. Simulating a
        person or a role needs `iam:get`, a set of groups `iam:list`.
      tags: [Authorization]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PolicySimulationRequest' }
      responses:
        '200':
          description: One result per check, in order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PolicySimulation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/accounts/{accountId}/guardrails:
    parameters:
      - $ref: '#/components/parameters/AccountIdPath'
    get:
      operationId: listAccountGuardrails
      summary: The organization's guardrails that apply to the account
      description: Needs `iam:list`; in id order, the order the evaluator reads them in
      tags: [Guardrails]
      responses:
        '200':
          description: Every guardrail that applies
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Guardrail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/guardrails:
    get:
      operationId: listGuardrails
      summary: List the organization's guardrails
      description: The internal principal only (the BFF, for an organization admin); anyone else gets a 404
      tags: [Guardrails]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/After'
      responses:
        '200':
          description: One page, in id order
          content:
            application/json:
              schema:
                type: object
                required: [items, next]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Guardrail' }
                  next: { $ref: '#/components/schemas/Cursor' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createGuardrail
      summary: Create a guardrail
      description: >-
        The internal principal only. Every account it targets gets a GuardrailChanged and a new
        authorization version, so cached decisions there are dropped.
      tags: [Guardrails]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GuardrailInput' }
      responses:
        '201':
          description: The guardrail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Guardrail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/guardrails/{guardrailId}:
    parameters:
      - name: guardrailId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getGuardrail
      summary: Read a guardrail
      description: The internal principal only
      tags: [Guardrails]
      responses:
        '200':
          description: The guardrail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Guardrail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateGuardrail
      summary: Change a guardrail
      description: >-
        The internal principal only; a field left out stays as it is. The accounts it applied to and
        no longer does get a GuardrailChanged `deleted`.
      tags: [Guardrails]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GuardrailInput' }
      responses:
        '200':
          description: The guardrail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Guardrail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      operationId: deleteGuardrail
      summary: Delete a guardrail
      description: The internal principal only
      tags: [Guardrails]
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/accounts/{accountId}/platform-credentials:
    parameters:
      - $ref: '#/components/parameters/AccountIdPath'
    get:
      operationId: getPlatformCredentials
      summary: The platform service account bound to an account
      description: |
        For the console's own services (the `svc` claim; a user's JWT answers 404): the platform
        service account (P-03, preset `console`) the state service and the BFF act through for this
        account, and where its token is. `source: local` answers the token itself (the demo and dev
        profiles, where the identity service minted the account on platform-fake); `source: vault`
        answers the Vault path `console/accounts/{accountId}/platform-service-account`, which the
        caller reads with its own Vault identity (production), and no token. The token never
        appears in events, logs or the audit trail.
      tags: [Internal]
      responses:
        '200':
          description: The service account and where its token is
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlatformCredentials' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /internal/opa/bundles/console-authz.tar.gz:
    get:
      operationId: getOpaBundle
      summary: The OPA bundle of every account's policies
      description: |
        The authorization bundle the console's OPA instances poll (OPA's bundle service API): a
        gzipped tar with the compiled policies and data of every account, rebuilt on each
        `identity.changes` event. `ETag` is the bundle revision (the `.manifest` revision) and a
        matching `If-None-Match` answers 304, so polling costs nothing between changes. Callers are
        the console-internal principal, or OPA itself with the configured bundle token
        (`Authorization: Bearer <token>`, `identity.opa.bundle-token`); a user's JWT answers 404.
      tags: [Internal]
      security:
        - consoleJwt: []
        - bundleToken: []
      parameters:
        - name: If-None-Match
          in: header
          required: false
          schema: { type: string }
      responses:
        '200':
          description: The bundle
          headers:
            ETag:
              description: The bundle revision
              schema: { type: string }
          content:
            application/gzip:
              schema: { type: string, format: binary }
        '304':
          description: The caller's bundle is current
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/accounts/{accountId}/access-reviews:
    parameters:
      - $ref: '#/components/parameters/AccountIdPath'
    get:
      operationId: listAccessReviews
      summary: An account's access review campaigns
      description: 'The campaign started last first. Needs `access-review:list` on `wfrn:wf:iam::{accountId}:access-review/*` (access reviews are wfrns of kind `access-review`, ids `arev_` and a ULID, their items `arevi_`), which the managed `account-admin` and `auditor` policies grant and the managed `viewer` and `operator` policies leave out (`notActions: access-review:*`), so admins, auditors and the internal principal read the reviews.'
      tags: [Access reviews]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/After'
      responses:
        '200':
          description: One page
          content:
            application/json:
              schema:
                type: object
                required: [items, next]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AccessReview' }
                  next: { $ref: '#/components/schemas/Cursor' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: startAccessReview
      summary: Start an access review campaign
      description: 'Account admins (`access-review:create`). The campaign takes who holds which group now: one item per person and group of the account''s active memberships (suspended people are left out), with the role names the group carries. Admins keep or revoke each item until the campaign is due, `dueInDays` after it starts; when every item is decided it is `closed`, and at the due date it closes with each pending item `expired`: the group is taken off the person as a revoke would, decided by `system:access-review`, except the account''s last active owner, whose owners item is kept with a comment. A campaign with nothing to review is closed at once. One open campaign per account: a second answers 409 naming the open one (`detail.reviewId`); a suspended or closed account answers 409. An `AccessReviewChanged` event (subject `access-review`, action `created`) follows. Besides the campaigns people start, a sweep every 15 minutes starts a `scheduled` one, by `system:access-review`, on every active account with none open whose last campaign started 90 days ago or more (with none yet, that was created 90 days ago or more).'
      tags: [Access reviews]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccessReviewInput' }
      responses:
        '201':
          description: The campaign, open (closed when there was nothing to review)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessReview' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The account has an open campaign, named in `detail.reviewId`, or the account is not active
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessReviewConflict' }
  /v1/accounts/{accountId}/access-reviews/{reviewId}:
    parameters:
      - $ref: '#/components/parameters/AccountIdPath'
      - name: reviewId
        in: path
        required: true
        description: 'An access review (`arev_…`)'
        schema: { type: string }
    get:
      operationId: getAccessReview
      summary: One access review campaign
      description: 'Needs `access-review:get` on the campaign (`wfrn:wf:iam::{accountId}:access-review/{reviewId}`).'
      tags: [Access reviews]
      responses:
        '200':
          description: The campaign and its counts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessReview' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/accounts/{accountId}/access-reviews/{reviewId}/items:
    parameters:
      - $ref: '#/components/parameters/AccountIdPath'
      - name: reviewId
        in: path
        required: true
        description: 'An access review (`arev_…`)'
        schema: { type: string }
    get:
      operationId: listAccessReviewItems
      summary: A campaign's items
      description: 'In the order they were made, of one decision when `decision` is given. Reading the items is reading the campaign: `access-review:get` on it.'
      tags: [Access reviews]
      parameters:
        - name: decision
          in: query
          schema: { $ref: '#/components/schemas/AccessReviewDecision' }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/After'
      responses:
        '200':
          description: One page
          content:
            application/json:
              schema:
                type: object
                required: [items, next]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AccessReviewItem' }
                  next: { $ref: '#/components/schemas/Cursor' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/accounts/{accountId}/access-reviews/{reviewId}/items/{itemId}:decide:
    parameters:
      - $ref: '#/components/parameters/AccountIdPath'
      - name: reviewId
        in: path
        required: true
        description: 'An access review (`arev_…`)'
        schema: { type: string }
      - name: itemId
        in: path
        required: true
        description: 'One of its items (`arevi_…`)'
        schema: { type: string }
    post:
      operationId: decideAccessReviewItem
      summary: Keep or revoke one person's group
      description: 'Account admins (`access-review:decide` on the campaign). `keep` leaves the access as it is; `revoke` takes the group off the person''s membership, with the `UserChanged` event any change of their groups publishes, and is recorded without a change when they no longer hold the group. Revoking the account''s last active owner''s owners group answers 409. A decided item is final, and a campaign no longer open or past its due date takes no decision (409; the sweep expires what is still pending). Nobody decides an item about themselves: the person reviewed gets 403, `denied.reason` `nobody reviews their own access`. Each decision publishes an `AccessReviewChanged` (action `updated`) with the campaign''s counts and the item decided; the last one closes the campaign.'
      tags: [Access reviews]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccessReviewDecisionInput' }
      responses:
        '200':
          description: The item, decided
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessReviewItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: The caller is the person the item reviews, or may not decide
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/accounts/{accountId}/access-reviews/{reviewId}:cancel:
    parameters:
      - $ref: '#/components/parameters/AccountIdPath'
      - name: reviewId
        in: path
        required: true
        description: 'An access review (`arev_…`)'
        schema: { type: string }
    post:
      operationId: cancelAccessReview
      summary: Cancel an open campaign
      description: 'Account admins (`access-review:cancel` on the campaign). The campaign is `cancelled`; its pending items stay pending and never expire. A campaign already closed or cancelled, or past its due date, answers 409. An `AccessReviewChanged` (action `updated`) follows.'
      tags: [Access reviews]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The campaign, cancelled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessReview' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/accounts/{accountId}:close:
    parameters:
      - $ref: '#/components/parameters/AccountIdPath'
    post:
      operationId: closeAccount
      summary: Close an account
      description: |
        Internal principal only (a user's JWT answers 404). Closing is terminal: the account is
        stored with status `closed`, `closedAt` and `closeReason`, and from then on every call in it
        is refused (`account closed`) and sign-in leaves it out. Every usable access key of the
        account is revoked (`AccessKeyChanged revoked`), every pending access request expires
        (`AccessRequestChanged expired`) and every open quota request is withdrawn (`QuotaChanged`),
        then `AccountChanged closed` carries the closed account. Closing a closed account is a 409.
        The account's platform service account is left as it is, and its resources stay where they
        are.
      tags: [Accounts]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CloseAccount' }
      responses:
        '202':
          description: The closed account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /internal/v1/group-sync:run:
    post:
      operationId: runGroupSync
      summary: Run the identity provider group sync now
      description: |
        For the console's own services (a user's JWT answers 404). The sync also runs nightly
        (02:00 UTC by default). For every active account, the groups that map identity provider
        groups (`Group.idpGroups`) are compared with the directory's members, matched by email:
        a person gains the mapped groups their provider groups give them (unless an admin or a
        review excluded them) and loses the ones they held only through a provider group they
        left; groups an admin gave stay. People without a membership in the account get none here.
        The owners group of an account's last active owner is never removed: the removal is
        skipped and reported. An account whose owning team the directory lacks is marked
        `owningTeamMissing`. Every membership change publishes `UserChanged`, every mark
        `AccountChanged`.
      tags: [Internal]
      responses:
        '200':
          description: What the run did, account by account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupSyncReport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    consoleJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "The console's internal JWT, signed by the BFF (ES256, `kid` in the header, verified against its `/.well-known/jwks.json`): `iss`, `aud`, `iat`, `exp`, `sub` (the console user id, or the service id on a service token), `acct` (the account the person acts in; absent on a service token), `region`, `groups` (the person's group names in the account), `roles` (the managed role names the person holds there, from the membership the identity service serves: `viewer`, `operator`, `account-admin`, `auditor`), `svc` (the calling service) and optionally `name` and `email`. Admin-only decisions test `roles` for `account-admin`, never a group name."
    bundleToken:
      type: http
      scheme: bearer
      description: The static token OPA presents for its bundle (`identity.opa.bundle-token`); accepted on the bundle path only
  parameters:
    AccountIdPath:
      name: accountId
      in: path
      required: true
      description: The account; another account than the caller's answers 404
      schema: { $ref: '#/components/schemas/AccountId' }
    RequestId:
      name: requestId
      in: path
      required: true
      description: 'An access request (`areq_…`) or a quota request (`qreq_…`)'
      schema: { type: string }
    QuotaKey:
      name: quotaKey
      in: path
      required: true
      description: '`resources.<type>`, `jobs-per-minute` or `access-keys`'
      schema: { type: string, pattern: '^[a-z0-9.-]{1,64}$' }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    After:
      name: after
      in: query
      required: false
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: The same key with the same body answers the first result for 24 hours; with another body it is 409
      schema: { type: string, maxLength: 255 }
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: The version the caller holds; 409 when the record moved on
      schema: { type: string }
  responses:
    BadRequest:
      description: Bad input
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: No valid JWT
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Unknown, or another account's
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: A name in use, a version mismatch, a record still in use, or an Idempotency-Key reused with another body
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    AccountId:
      type: string
      pattern: '^[0-9]{12}$'
    RegionName:
      type: string
      pattern: '^[a-z0-9-]{2,32}$'
    Cursor:
      type: [string, 'null']
    AccountStatus:
      type: string
      enum: [active, suspended, closed]
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        problems:
          type: array
          items: { $ref: '#/components/schemas/Problem' }
        denied: { $ref: '#/components/schemas/Denial' }
        correlationId: { type: string }
    Denial:
      type: object
      description: Why the account's roles and policies refuse an action; the BFF forwards it to the person as is
      required: [layer, action, reason, requestable]
      properties:
        layer: { type: string, const: console-iam }
        action: { type: string, description: '`<service>:<verb>`' }
        resource: { type: string, description: The wfrn or pattern checked }
        reason: { type: string }
        role: { type: string, description: The role the decision came from }
        policyId: { type: string }
        statement: { type: string, description: 'The statement''s sid' }
        requestable: { type: boolean, description: Whether the person may open an access request for it }
        suggestedRole: { type: string, description: The managed role that would allow it }
        scope:
          type: string
          enum: [policy, boundary, guardrail]
          description: 'Which part of console IAM refused it: a statement of a role''s policy, the permission boundary of the role that would have allowed it (`policyId` is the boundary), or one of the organization''s guardrails. Requesting a role does not help past a boundary or a guardrail, so those are never requestable'
        guardrailId: { type: string, description: The guardrail whose deny statement refused it }
    PlatformCredentials:
      type: object
      required: [accountId, platformServiceAccountId, source]
      properties:
        accountId: { $ref: '#/components/schemas/AccountId' }
        platformServiceAccountId: { type: string, description: "The platform service account (P-03, preset console)" }
        source: { type: string, enum: [local, vault], description: Where the token is }
        token: { type: string, description: 'The bearer token; with source local only' }
        vaultPath: { type: string, description: 'The Vault secret; with source vault only: console/accounts/{accountId}/platform-service-account' }
        issuedAt: { type: string, format: date-time }
    Problem:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        field: { type: string }
        message: { type: string }
    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [UP, DOWN, OUT_OF_SERVICE, UNKNOWN] }
        components: { type: object, additionalProperties: true }
    Account:
      type: object
      required: [accountId, name, status, owningTeam, version, createdAt]
      properties:
        accountId: { $ref: '#/components/schemas/AccountId' }
        name: { type: string }
        status: { $ref: '#/components/schemas/AccountStatus' }
        owningTeam: { type: string }
        costCentre: { type: string, maxLength: 64, description: 'The finance cost centre the account is charged to (decision 2): chargeback rows and the executive home''s spend by team group by it; absent until an admin sets it, when the cost service falls back to owningTeam' }
        defaultRegion: { $ref: '#/components/schemas/RegionName' }
        platformServiceAccountId: { type: string, description: 'The platform service account bound to this account (P-03); its token is never in this record: GET /v1/accounts/{accountId}/platform-credentials tells the console''s own services where it is' }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        closedAt: { type: string, format: date-time, description: When the account was closed; with status closed only }
        closeReason: { type: string, maxLength: 2000, description: Why it was closed; with status closed only }
        owningTeamMissing: { type: boolean, readOnly: true, description: 'True while the nightly group sync finds no identity provider group named owningTeam; absent otherwise' }
    AccountMembership:
      type: object
      required: [accountId, name, groups, roles]
      properties:
        accountId: { $ref: '#/components/schemas/AccountId' }
        name: { type: string }
        groups:
          type: array
          description: The person's group names in the account
          items: { type: string }
        roles:
          type: array
          description: 'The managed role names the person holds there: viewer, operator, account-admin, auditor'
          items: { type: string }
        defaultRegion: { $ref: '#/components/schemas/RegionName' }
    User:
      type: object
      required: [userId, email, status, version]
      properties:
        userId: { type: string }
        email: { type: string, format: email }
        name: { type: string }
        status: { type: string, enum: [active, suspended] }
        issuer: { type: string, description: The identity provider }
        subject: { type: string, description: 'The user''s id at the identity provider' }
        groups:
          type: array
          description: Group names
          items: { type: string }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
        lastSignInAt: { type: string, format: date-time }
        idpGroups:
          type: array
          readOnly: true
          description: 'The groups among `groups` the person holds through their identity provider groups (`Group.idpGroups`): sign-in and the nightly group sync add and remove them as the provider''s groups change. Every other group is an admin''s, and no sync removes it.'
          items: { type: string }
        excludedGroups:
          type: array
          readOnly: true
          description: 'Groups that map identity provider groups and that an admin or an access review took from the person: sign-in and the group sync leave them out until an admin adds them back'
          items: { type: string }
    GroupInput:
      type: object
      properties:
        name: { type: string, pattern: '^[a-z0-9-]{2,64}$' }
        description: { type: string }
        roles:
          type: array
          description: Role ids when served; ids or names accepted as input
          items: { type: string }
        members:
          type: array
          description: User ids
          items: { type: string }
        idpGroups:
          type: array
          description: Identity provider groups whose members join this group at sign-in
          items: { type: string }
    Group:
      allOf:
        - $ref: '#/components/schemas/GroupInput'
        - type: object
          required: [groupId, name, version]
          properties:
            groupId: { type: string }
            version: { type: integer }
            builtIn: { type: boolean, description: 'owners is built in and cannot be deleted' }
    RoleInput:
      type: object
      properties:
        name: { type: string, pattern: '^[a-z0-9-]{2,64}$' }
        description: { type: string }
        policies:
          type: array
          items: { type: string }
        boundary:
          type: string
          description: 'The role''s permission boundary: a policy of the account (id or name; served as the id). An allow of the role counts only where the boundary allows too and none of its denies match. On a change, absent keeps it and an empty string removes it. The account-admin role takes none (409). A policy that bounds a role cannot be deleted (409)'
    Role:
      allOf:
        - $ref: '#/components/schemas/RoleInput'
        - type: object
          required: [roleId, name, version]
          properties:
            roleId: { type: string }
            version: { type: integer }
            builtIn: { type: boolean }
    Statement:
      type: object
      required: [effect, actions, resources]
      properties:
        sid: { type: string }
        effect: { type: string, enum: [allow, deny] }
        actions:
          type: array
          description: '`<service>:<verb>` with `*` allowed, for example `compute:create`, `compute:*`, `*:read`'
          items: { type: string }
        notActions:
          type: array
          description: 'On an allow statement only: every action but these (`compute:*` minus `compute:delete`); refused with 400 on a deny statement'
          items: { type: string }
        resources:
          type: array
          description: wfrn patterns
          items: { type: string }
        conditions:
          type: object
          description: 'Keys such as `region`, `tag.<name>`, `requester.group`; every key must match'
          additionalProperties: true
    PolicyInput:
      type: object
      required: [name, statements]
      properties:
        name: { type: string, pattern: '^[a-z0-9-]{2,64}$' }
        description: { type: string }
        statements:
          type: array
          minItems: 1
          maxItems: 200
          items: { $ref: '#/components/schemas/Statement' }
    Policy:
      allOf:
        - $ref: '#/components/schemas/PolicyInput'
        - type: object
          required: [policyId, version]
          properties:
            policyId: { type: string }
            version: { type: integer }
            builtIn: { type: boolean }
            updatedAt: { type: string, format: date-time }
    GuardrailInput:
      type: object
      description: 'An organization guardrail, like an AWS service control policy. On a change, a field left out stays as it is'
      properties:
        name: { type: string, pattern: '^[a-z0-9-]{2,64}$', description: Unique in the organization }
        description: { type: string }
        statements:
          type: array
          minItems: 1
          maxItems: 200
          description: 'Policy statements over any account''s wfrns. A matching deny refuses whatever a role allows; when any guardrail of an account has allow statements, an action none of them allows is refused'
          items: { $ref: '#/components/schemas/Statement' }
        accounts:
          type: array
          minItems: 1
          description: '`["*"]` for every account, now and later, or account ids that exist'
          items: { type: string, pattern: '^(\*|[0-9]{12})$' }
    Guardrail:
      allOf:
        - $ref: '#/components/schemas/GuardrailInput'
        - type: object
          required: [guardrailId, name, statements, accounts, version]
          properties:
            guardrailId: { type: string, description: '`gr_` and a ULID' }
            version: { type: integer }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    PolicySimulationRequest:
      type: object
      required: [principal, checks]
      properties:
        principal:
          type: object
          description: Exactly one of the three
          properties:
            userId: { type: string, description: A person of the account }
            role: { type: string, description: 'A role, by id or name' }
            groups:
              type: array
              description: 'Groups, by id or name'
              items: { type: string }
        policies:
          type: array
          maxItems: 10
          description: Unsaved policy documents the principal would also hold
          items:
            type: object
            required: [statements]
            properties:
              name: { type: string }
              statements:
                type: array
                items: { $ref: '#/components/schemas/Statement' }
        boundary:
          type: object
          description: 'For a role only: a draft permission boundary used in place of its own'
          required: [statements]
          properties:
            name: { type: string }
            statements:
              type: array
              items: { $ref: '#/components/schemas/Statement' }
        checks:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            required: [action, resource]
            properties:
              action: { type: string, description: '`<service>:<verb>`' }
              resource: { type: string, description: "A wfrn, or a wfrn pattern" }
              context:
                type: object
                additionalProperties: true
    PolicySimulation:
      type: object
      required: [results, version]
      properties:
        results:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/Decision'
              - type: object
                required: [action, resource]
                properties:
                  action: { type: string }
                  resource: { type: string }
        version: { type: integer, description: 'The account''s authorization version the results were decided at' }
    AccessKey:
      type: object
      required: [keyId, userId, status, createdAt]
      properties:
        keyId: { type: string, description: 'The public part, `ck_` and a ULID' }
        userId: { type: string }
        description: { type: string }
        status: { type: string, enum: [active, rotating, revoked, expired] }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time }
    AccessKeyCreated:
      allOf:
        - $ref: '#/components/schemas/AccessKey'
        - type: object
          required: [secretPart]
          properties:
            secretPart: { type: string, description: Shown once and never stored in clear; computed at run time }
            graceUntil: { type: string, format: date-time, description: 'After a rotation: when the previous secret part stops working' }
    Quota:
      type: object
      required: [key, limit, used]
      properties:
        key: { type: string }
        limit: { type: integer }
        burst: { type: integer }
        used: { type: integer }
        source: { type: string, enum: [default, override, platform] }
        pendingRequestId: { type: string, description: An open increase request }
    AccessRequestStatus:
      type: string
      description: '`expired` is a request still pending after 30 days'
      enum: [pending, approved, rejected, expired]
    AccessRequestInput:
      type: object
      required: [action, reason]
      properties:
        action: { type: string, description: '`<service>:<verb>`, as the denial named it' }
        resource: { type: string, description: "The wfrn or pattern, as the denial named it" }
        role: { type: string, description: The managed role asked for; the denial's suggestedRole by default }
        reason: { type: string, maxLength: 2000 }
    AccessDecision:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [approve, reject] }
        comment: { type: string, maxLength: 2000 }
    AccessRequest:
      type: object
      required: [requestId, accountId, requester, action, reason, status, requestedAt]
      properties:
        requestId: { type: string, description: '`areq_` and a ULID' }
        accountId: { $ref: '#/components/schemas/AccountId' }
        requester:
          type: object
          required: [userId]
          properties:
            userId: { type: string }
            email: { type: string }
            name: { type: string }
        action: { type: string }
        resource: { type: string }
        role: { type: string }
        reason: { type: string }
        status: { $ref: '#/components/schemas/AccessRequestStatus' }
        requestedAt: { type: string, format: date-time }
        decidedAt: { type: string, format: date-time }
        decidedBy: { type: string }
        comment: { type: string }
        approvers:
          type: array
          description: The account admins who may decide it
          items: { type: string }
    QuotaDecision:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [approve, reject] }
        limit: { type: integer, minimum: 1, description: 'On approve, the limit granted; the ask by default' }
        comment: { type: string, maxLength: 2000 }
    QuotaRequest:
      type: object
      required: [requestId, accountId, quotaKey, requestedLimit, reason, status, requestedBy, requestedAt]
      properties:
        requestId: { type: string, description: '`qreq_` and a ULID' }
        accountId: { $ref: '#/components/schemas/AccountId' }
        quotaKey: { type: string }
        currentLimit: { type: integer }
        requestedLimit: { type: integer }
        reason: { type: string }
        status: { type: string, enum: [open, approved, rejected, withdrawn] }
        grantedLimit: { type: integer, description: 'On approval, the limit granted, which may differ from the ask' }
        requestedBy: { type: string }
        requestedAt: { type: string, format: date-time }
        decidedAt: { type: string, format: date-time }
        decidedBy: { type: string, description: 'Who decided: a user, a service (`svc:<name>`), or the auto-approval rule (`rule:<name>`) that approved it at once' }
        comment: { type: string }
        routedTo: { type: string, description: 'Who decides a request no rule approved: `platform-team`, through `:decide`' }
    QuotaRules:
      type: object
      required: [items, approver]
      properties:
        items:
          type: array
          items:
            type: object
            required: [name, keys, maxFactor, maxLimit]
            properties:
              name: { type: string }
              keys:
                type: array
                description: 'Quota key patterns: `resources.*`, `jobs-per-minute`, `access-keys`'
                items: { type: string }
              maxFactor: { type: number, minimum: 1, description: 'The highest ask it approves, as a multiple of the current limit' }
              maxLimit: { type: integer, minimum: 1, description: The highest limit it approves at all }
              cooldown: { type: string, description: 'An ISO 8601 duration (`PT720H`): after a rule approves an account''s key, no rule approves that key again until it passes; absent for none' }
        approver: { type: string, description: 'Who decides an ask no rule approves: `platform-team`' }
    AuthorizeRequest:
      type: object
      required: [principal, checks]
      properties:
        principal:
          type: object
          required: [accountId]
          properties:
            userId: { type: string }
            accountId: { $ref: '#/components/schemas/AccountId' }
            groups:
              type: array
              items: { type: string }
            service: { type: string, description: A console service acting on its own }
        checks:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            required: [action, resource]
            properties:
              action: { type: string, description: '`<service>:<verb>`' }
              resource: { type: string, description: "A wfrn, or a wfrn pattern for list checks" }
              context:
                type: object
                additionalProperties: true
    AuthorizeResponse:
      type: object
      required: [decisions, version]
      properties:
        decisions:
          type: array
          items: { $ref: '#/components/schemas/Decision' }
        version: { type: integer, description: 'The account''s authorization version the decisions were made with' }
    Decision:
      type: object
      description: >-
        One check's answer. The order of evaluation: the account and the person's state; the
        organization's guardrails that apply to the account (a matching deny refuses, and when any
        of them allows something, an action none of them allows is refused); then the statements of
        the person's roles (through their groups, and the roles they hold for a while): a matching
        deny refuses, else the first matching allow whose role's permission boundary allows it too,
        else the boundary that refused one, else a default deny naming the managed role that would
        allow it.
      required: [allowed]
      properties:
        allowed: { type: boolean }
        reason: { type: string }
        role: { type: string, description: The role the deciding statement came from }
        policyId: { type: string, description: 'The policy whose statement decided; on a boundary refusal, the boundary' }
        statement: { type: string, description: 'The statement''s sid' }
        requestable: { type: boolean, description: 'When denied: whether the person may open an access request' }
        suggestedRole: { type: string, description: 'When denied: the managed role that would allow it' }
        scope: { type: string, enum: [policy, boundary, guardrail], description: 'What decided: a role''s policy, a role''s permission boundary, or a guardrail' }
        guardrailId: { type: string, description: The guardrail whose deny statement decided }
        elevated: { type: boolean, description: 'The deciding role is held for a while (an elevation or break-glass access), not through a group' }
    AccessReviewInput:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 200, description: '`Access review <date>` by default' }
        dueInDays: { type: integer, minimum: 1, maximum: 90, default: 14, description: How many days the campaign stays open }
    AccessReviewCounts:
      type: object
      required: [total, kept, revoked, expired, pending]
      properties:
        total: { type: integer, minimum: 0 }
        kept: { type: integer, minimum: 0 }
        revoked: { type: integer, minimum: 0 }
        expired: { type: integer, minimum: 0 }
        pending: { type: integer, minimum: 0 }
    AccessReview:
      type: object
      required: [reviewId, name, status, trigger, startedBy, startedAt, dueAt, counts, version]
      properties:
        reviewId: { type: string, description: '`arev_` and a ULID' }
        name: { type: string }
        status: { type: string, enum: [open, closed, cancelled], description: '`closed` once every item is decided or the due date passed' }
        trigger: { type: string, enum: [manual, scheduled], description: '`scheduled` for the quarterly campaigns the sweep starts' }
        startedBy: { type: string, description: 'Who started it; `system:access-review` for a scheduled campaign' }
        startedAt: { type: string, format: date-time }
        dueAt: { type: string, format: date-time }
        closedAt: { type: string, format: date-time, description: When it closed or was cancelled }
        counts: { $ref: '#/components/schemas/AccessReviewCounts' }
        version: { type: integer, minimum: 1, description: 'Grows by one per change; the `AccessReviewChanged` events carry it' }
    AccessReviewDecision:
      type: string
      description: '`expired` is an item still pending at the due date'
      enum: [pending, keep, revoke, expired]
    AccessReviewItem:
      type: object
      required: [itemId, reviewId, userId, groupId, groupName, roles, decision]
      properties:
        itemId: { type: string, description: '`arevi_` and a ULID' }
        reviewId: { type: string }
        userId: { type: string }
        email: { type: string }
        name: { type: string }
        groupId: { type: string }
        groupName: { type: string }
        roles:
          type: array
          description: The names of the roles the group carried when the campaign started
          items: { type: string }
        decision: { $ref: '#/components/schemas/AccessReviewDecision' }
        decidedBy: { type: string, description: 'Who decided; `system:access-review` for what the due date decided' }
        decidedAt: { type: string, format: date-time }
        comment: { type: string }
    AccessReviewDecisionInput:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [keep, revoke] }
        comment: { type: string, maxLength: 2000 }
    AccessReviewConflict:
      type: object
      required: [error]
      properties:
        error: { type: string }
        detail:
          type: object
          description: With an open campaign only
          required: [reviewId]
          properties:
            reviewId: { type: string, description: The open campaign }
        correlationId: { type: string }
    CloseAccount:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 2000, description: 'Why the account closes; kept as the account''s closeReason' }
    GroupSyncReport:
      type: object
      required: [startedAt, finishedAt, accounts]
      properties:
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        accounts:
          type: array
          description: Every active account the run visited
          items: { $ref: '#/components/schemas/GroupSyncAccount' }
    GroupSyncAccount:
      type: object
      required: [accountId, owningTeam, added, removed, skipped, missingIdpGroups]
      properties:
        accountId: { $ref: '#/components/schemas/AccountId' }
        owningTeam: { type: string }
        owningTeamMissing: { type: boolean, description: 'Whether the directory lacks the owning team; absent when the run could not finish the account' }
        added:
          type: array
          description: Groups the run gave people through their identity provider groups
          items: { $ref: '#/components/schemas/GroupSyncChange' }
        removed:
          type: array
          description: Groups the run took from people whose identity provider groups no longer give them
          items: { $ref: '#/components/schemas/GroupSyncChange' }
        skipped:
          type: array
          description: Removals the run left undone, with the reason (the account's last active owner keeps the owners group)
          items: { $ref: '#/components/schemas/GroupSyncChange' }
        missingIdpGroups:
          type: array
          description: Identity provider groups the account's groups map that the directory does not have
          items: { type: string }
        error: { type: string, description: 'Why the run could not finish the account, which it left as it was' }
    GroupSyncChange:
      type: object
      required: [userId, email, group]
      properties:
        userId: { type: string }
        email: { type: string, format: email }
        group: { type: string, description: The group's name }
        reason: { type: string, description: 'Why a removal was skipped' }
