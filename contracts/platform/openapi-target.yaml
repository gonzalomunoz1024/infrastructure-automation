              unit: { type: string }
              points:
                type: array
                items:
                  type: object
                  required: [ at, value ]
                  properties:
                    at: { type: string, format: date-time }
                    value: { type: number }
        provider: { type: string }
        action: { type: string }
        at: { type: string, format: date-time }
    BackfillRequest:
