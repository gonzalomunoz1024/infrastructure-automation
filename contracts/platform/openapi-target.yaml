      required: [ seq, at, jobId, type, data ]
      properties:
        seq: { type: integer }
        at: { type: string, format: date-time }
        jobId: { type: string }
        type: { type: string, enum: [ job, step, approval, attention, batch, log ] }
        data: { type: object, additionalProperties: true }
    StartJobRequest:
      type: object
      required: [ workflow, input ]
