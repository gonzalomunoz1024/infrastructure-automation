          type: object
          additionalProperties: { type: string }
    StartBatchRequest:
      type: object
      required: [ workflow, items ]
      properties:
        workflow: { type: string }
        version: { type: string }
        items:
          type: array
          minItems: 1
          items: { type: object, additionalProperties: true }
        defaults: { type: object, additionalProperties: true }
        rollout: { $ref: '#/components/schemas/RolloutPolicy' }
        channel: { type: string, description: batch by default }
        traceId: { type: string }
        contexts:
          type: array
          description: 'P-04: one entry per row, aligned with items (same length, else 400)'
          items: { $ref: '#/components/schemas/BatchContext' }
          x-platform-change: [ P-04 ]
    RetryRequest:
      type: object
      properties:
        step: { type: string }
        input: { type: object, description: The edited input, additionalProperties: true }
    SkipRequest:
      type: object
      required: [ step ]
      properties:
        step: { type: string }
    RerunRequest:
      type: object
      required: [ fromStep ]
      properties:
        fromStep: { type: string }
        input: { type: object, additionalProperties: true }
    DecisionRequest:
      type: object
      properties:
        comment: { type: string }
    PolicyRule:
      type: object
      required: [ id, result ]
      properties:
        id: { type: string }
        result: { type: string }
        message: { type: string }
    PolicyDecision:
      type: object
      required: [ decision, rules, engine ]
      properties:
        decision: { type: string, enum: [ allow, deny, needs-approval ] }
        rules:
          type: array
          items: { $ref: '#/components/schemas/PolicyRule' }
        engine: { type: string, enum: [ mock, opa ] }
    PreviewStep:
      type: object
      required: [ id, name, effect ]
      properties:
        id: { type: string }
        name: { type: string }
        effect: { type: string, enum: [ create, change, delete, read, none, unknown ] }
        detail: { type: string }
        skipped: { type: boolean, description: The dry run on this input does not take the step }
    AffectedResource:
      type: object
      required: [ id, type ]
      properties:
        id: { type: string }
        type: { type: string }
        name: { type: string }
        via: { type: string, description: The step that touches it }
        wfrn:
          $ref: '#/components/schemas/Wfrn'
          description: 'P-05: the resource''s name when it has one'
          x-platform-change: [ P-05 ]
    Cost:
      type: object
      required: [ monthly, currency ]
      properties:
        monthly: { type: number }
        currency: { type: string }
        detail: { type: string }
    Preview:
      type: object
      required: [ workflow, version, steps, affectedResources, policy ]
      properties:
        workflow: { type: string }
        version: { type: string }
        steps:
          type: array
          items: { $ref: '#/components/schemas/PreviewStep' }
        affectedResources:
          type: array
          items: { $ref: '#/components/schemas/AffectedResource' }
        cost: { $ref: '#/components/schemas/Cost' }
        policy: { $ref: '#/components/schemas/PolicyDecision' }
    FeedEvent:
      type: object
      description: 'P-01: the envelope every consumer sees, on Kafka and over HTTP. `key`, never `id`, is the event''s identity: a re-emitted event gets a new id and the same key.'
      required: [ specVersion, dataVersion, id, key, seq, type, at, aggregate, aggregateId, actor, data ]
      properties:
        specVersion: { type: string, const: '1.0' }
        dataVersion: { type: integer, description: The version of this event type's `data` schema in the catalog }
        id: { type: string, description: 'Random (`evt_...`); for tracing only' }
        key: { type: string, description: 'Deterministic: `<type>:<jobId>:<seq>` for job events, `<type>:<resourceId>:<updatedAt nanos>` for resource events, `<type>:<name>:<version>` for content events' }
        seq: { type: integer, format: int64, description: The outbox sequence, one total order per installation }
        type: { type: string, description: 'An event type of the catalog (contracts/platform/asyncapi-target.yaml)' }
        at: { type: string, format: date-time }
        aggregate: { type: string, enum: [ job, resource, workflow, provider, resource-type, region, release, audit, content ] }
        aggregateId: { type: string }
        actor: { type: string }
        onBehalfOf: { $ref: '#/components/schemas/Person' }
        context: { $ref: '#/components/schemas/JobContext' }
        traceparent: { type: string }
        data: { type: object, description: 'What the event carries in process today, run through the redaction', additionalProperties: true }
    EventPage:
      type: object
      required: [ items, next ]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/FeedEvent' }
