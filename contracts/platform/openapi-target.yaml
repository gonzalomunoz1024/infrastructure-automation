            output: { type: object, additionalProperties: true }
            steps:
              type: array
              items: { $ref: '#/components/schemas/JobStep' }
            approvals:
              type: array
              items: { $ref: '#/components/schemas/Approval' }
            preview: { $ref: '#/components/schemas/Preview' }
