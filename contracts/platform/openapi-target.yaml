        workflow: { type: string }
        step: { type: string }
        group: { type: string }
        message: { type: string }
        requestedAt: { type: string, format: date-time }
        timeout: { type: string }
        status: { type: string, enum: [ pending, approved, rejected, expired ] }
        decidedBy: { type: string }
        decidedAt: { type: string, format: date-time }
        comment: { type: string }
