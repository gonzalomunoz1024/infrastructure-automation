        errorClass:
          type: string
          description: In the API today, in its OpenAPI document with P-13
          x-platform-change: [ P-13 ]
        failedStep:
          type: string
          description: In the API today, in its OpenAPI document with P-13
          x-platform-change: [ P-13 ]
        actor:
          type: string
          description: 'P-02: the service account that started the job for `requester`'
          x-platform-change: [ P-02 ]
        onBehalfOf:
          $ref: '#/components/schemas/Person'
          x-platform-change: [ P-02 ]
        context:
          $ref: '#/components/schemas/JobContext'
          x-platform-change: [ P-04 ]
    StepError:
