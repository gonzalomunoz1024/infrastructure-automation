        items:
          type: array
          items:
            anyOf:
              - $ref: '#/components/schemas/Resource'
              - $ref: '#/components/schemas/JobSummary'
        next: { type: string, description: The cursor of the next page; absent on the last one }
        highWaterSeq: { type: integer, format: int64, description: The outbox sequence at the start of the snapshot }
    Quota:
