              $ref: '#/components/schemas/ChangeTicket'
              description: The change record the job runs under; in the API today, in its OpenAPI document with P-13
              x-platform-change: [ P-13 ]
            children:
              type: array
              items: { $ref: '#/components/schemas/JobSummary' }
            batch: { $ref: '#/components/schemas/Batch' }
