        startedAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time }
        durationMs: { type: integer }
        parentId: { type: string }
        kind: { type: string, enum: [ single, batch ] }
        progress:
          type: object
          properties:
            done: { type: integer }
            total: { type: integer }
            failed: { type: integer }
        row:
          type: integer
          description: The row of the batch the job runs; in the API today, in its OpenAPI document with P-13
