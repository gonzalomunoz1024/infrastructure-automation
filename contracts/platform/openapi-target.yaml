openapi: 3.1.0
info:
  title: Infrastructure automation platform, target API
  version: 1.0.0-target
  summary: The platform's HTTP API as it will be once the changes P-01 to P-21 of platform-changes/README.md have shipped.
  description: |
    The contract the customer console is built against. It covers every operation the console uses
    (listed in `contracts/platform/used-operations.txt`), written from `platform-changes/README.md`
    on top of the platform's own OpenAPI document captured at `c9529d5`
    (`contracts/platform/openapi-c9529d5.json`). Everything here is additive to today's API: new
    optional fields, new optional headers and parameters, new endpoints. Nothing a caller sends today
    changes shape.

    **How to read an operation.** `x-scopes` lists the scope a service account needs (a person is
    judged by roles and teams alone; `[]` means no scope is needed, `[admin]` means admins only).
    `x-platform-change` lists the platform changes the operation depends on, and is empty for an
    endpoint that exists today unchanged. A new parameter, header or schema field carries its own
    `x-platform-change`, so the nightly contract check (`scripts/platform-contract-check.mjs`) can
    tell what is still pending from what has moved away from this contract. `P-13` on a parameter or
    header means the platform already honours it today but its OpenAPI document does not list it yet.

    **Identity.** `Authorization: Bearer iaf_<token>` for a service account (the console's BFF holds
    one per console account, P-03), an OIDC JWT for a person under the `oidc` profile, or the dev
    header `X-User: <id>` for local runs. A bearer token that does not verify is 401 and never falls
    back to the dev identity.

    **Acting for a console user (P-02).** `X-On-Behalf-Of` carries a short-lived signed assertion
    (ES256 JWS) naming the person; only a service account with the `console:act` scope bound to the
    assertion's console account may send it (400 otherwise, 401 when it does not verify). The job's
    `requester` becomes the person and `actor` the service account. The effective permissions stay
    the service account's.

    **Job context (P-04).** `X-Resource-Wfrn`, `X-Console-Request-Id` and up to sixteen
    `X-Job-Label-<name>` headers are accepted only together with a verified delegation; the account
    and region of the context always come from the assertion. The context shows on the job
    (`context`), on every one of its events, and is a filter on `GET /jobs`.

    **Idempotency (P-21).** `Idempotency-Key` is honoured on `POST`, `PUT`, `PATCH` and `DELETE`: the
    same key with the same request answers the first result with `Idempotent-Replay: true`; the same
    key with another request (body, pinned version or any of the context headers above) is 409
    `idempotency.mismatch`. Keys live 24 hours and are scoped to the caller.

    **Paging (P-04, P-05).** `limit` (1 to 500) and `after` (an opaque cursor) are opt-in: with
    `limit`, the body stays an array and the response carries `Link: <...&after=...>; rel="next"`
    while there is more. Without `limit` the answer is exactly today's whole array. The event feed
    and the snapshot use `{ items, next }` instead, since they are new.

    **Caller-scoped reads (P-18).** Registry and job reads answer only what the caller may see: its
    teams' and its account's records, plus `public` resources; a record outside the caller's scope
    is 404, never 403, and job inputs of jobs the caller may see but does not own are masked.

    **Errors.** `{ error, problems?, correlationId? }`: 400 bad input (with `problems` when a schema
    or registry check failed), 401 a token that does not verify, 403 RBAC or scope, 404 unknown or
    out of scope, 409 state conflict or an idempotency mismatch, 429 over a quota (with `Retry-After`
    and `retryAfter`), 500 `unexpected error` with the `correlationId` that finds the cause in the
    platform's log.

    **wfrns in URLs.** A wfrn contains `:` and `/`, which the platform's path rules refuse in a path
    segment, so it always travels as a query parameter (`?wfrn=`), percent-encoded.

    **Generated routes.** Every published workflow is an operation at its `api.path` under
    `/api/v<n>/` (never under a reserved noun: `workflows`, `jobs`, `approvals`, `providers`,
    `releases`, `audit`, `resources`, `resource-types`, `credentials`, `registry`, `catalog`,
    `assistant`, `triggers`, `change-requests`, `templates`, `service-accounts`, `me`, `mcp`,
    `openapi`, `batches`, `evidence`, `ws`, `actuator`, `playbooks`, `notifications`, `schemas`, and
    with P-13 `events`, `regions`, `quotas`, `demo`). It answers 202 `JobAccepted`, takes the job
    headers above, and its input schema is `<noun>_<verb>_input`. With `api.preview` it also has
    `POST {path}:preview` answering a `Preview`; it always has a batch route: `POST {path}:batch` for
    a collection path (`/api/v1/vms` to `/api/v1/vms:batch`) and `POST /<plural>:<verb>:batch` for a
    path that ends in a resource parameter (`DELETE /api/v1/vms/{vmId}` to `/api/v1/vms:delete:batch`),
    where every row brings its own id. Every resource type has `GET /api/v1/<plural>` and
    `GET /api/v1/<plural>/{id}`. The sample workflows' routes at `c9529d5` are listed below as
    concrete paths, with their operation ids written in camelCase (the platform's own ids, the MCP
    tool names such as `vm_create`, are kept in `x-platform-operation-id`). P-15 adds `update-vm`
    (`PATCH /api/v1/vms/{vmId}`); its preview is listed at `/api/v1/vms/{vmId}:update:preview`
    because the derived `/api/v1/vms/{vmId}:preview` is already `delete-vm`'s, so P-08 must let a
    workflow name its preview route (or derive it with the verb when the plain one is taken).
  contact:
    name: Customer console hub (console-root)
  license:
    name: Proprietary
servers:
  - url: /
    description: This platform
tags:
  - name: Identity
    description: Who is calling, service accounts (P-03)
  - name: Resource types
    description: kind ResourceType with P-06's service, console and observe blocks, published by change request (P-19)
  - name: Catalog
    description: Every published workflow as the console draws its buttons from it (P-08)
  - name: Regions
    description: kind Region (P-07)
  - name: Resources
    description: The registry, with wfrns, accounts and paging (P-05) and caller-scoped reads (P-18)
  - name: Observe
    description: Read a resource's truth from its provider, in pages or one at a time (P-09)
  - name: Jobs
    description: Runs of workflows, with the console context (P-04), delegation (P-02) and the global stream (P-20)
  - name: Approvals
    description: Human sign-offs jobs wait for
  - name: Events
    description: The durable platform event feed and the snapshot for rebuilds (P-01)
  - name: Quotas
    description: Job-start quotas per account (P-10)
  - name: Audit
    description: Evidence records with the console context (P-12)
  - name: Compute
    description: Generated routes of the compute workflows (sample content)
  - name: Data
    description: Generated routes of the data workflows (sample content)
  - name: Platform
    description: Generated routes of the platform team's workflows (sample content)
  - name: Generated reads
    description: The generated resource reads, GET /api/v1/<plural> and /<plural>/{id}
security:
  - bearer: []
  - devUser: []
paths:
  /api/v1/me:
    get:
      operationId: getMe
      summary: Who is calling
      description: The caller's identity. With a delegation (P-02) it also names the console user the call acts for.
      tags: [ Identity ]
      x-scopes: []
      x-platform-change: []
      responses:
        '200':
          description: The identity
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Identity' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/service-accounts:
    get:
      operationId: listServiceAccounts
      summary: List service accounts
      description: Every service account, without token hashes. Admins only.
      tags: [ Identity ]
      x-scopes: [ admin ]
      x-platform-change: [ P-03 ]
      responses:
        '200':
          description: The accounts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ServiceAccount' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createServiceAccount
      summary: Create a service account
      description: |
        The token is shown once. `preset` names a scope set: `invoker`, `assistant`, `ci`, and with P-03
        `console` (`registry:read`, `jobs:start`, `jobs:read`, `resources:observe`, `console:act`) and
        `console-internal` (`registry:read`, `jobs:read`, `resources:observe`, `events:read`).
        `consoleAccount` binds the account to one console account (admin only, `console` preset,
        `teams` exactly the account's owning team); a console account can never hold `admin`,
        `workflows:write` or `providers:write` (400).
      tags: [ Identity ]
      x-scopes: [ admin ]
      x-platform-change: [ P-03 ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateServiceAccount' }
      responses:
        '201':
          description: The account and its token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceAccountCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/service-accounts/{id}:
    parameters:
      - $ref: '#/components/parameters/ServiceAccountId'
    delete:
      operationId: deleteServiceAccount
      summary: Delete a service account
      description: The token stops working at once. Jobs it started keep running and their evidence keeps naming it. Admins only.
      tags: [ Identity ]
      x-scopes: [ admin ]
      x-platform-change: [ P-03 ]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Deleted
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/service-accounts/{id}:rotate:
    parameters:
      - $ref: '#/components/parameters/ServiceAccountId'
    post:
      operationId: rotateServiceAccount
      summary: Rotate a service account's token
      description: A new token; the old one keeps working for `platform.identity.rotation-grace` (10 minutes by default) so the caller can roll over without a failed request. Admins only.
      tags: [ Identity ]
      x-scopes: [ admin ]
      x-platform-change: [ P-03 ]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: The new token, shown once
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceAccountRotated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/resource-types:
    get:
      operationId: listResourceTypes
      summary: List resource types
      description: Every resource type, as published (P-19), with P-06's `service`, `console` and `observe`. The answer carries an `ETag` and honours `If-None-Match` with 304.
      tags: [ Resource types ]
      x-scopes: [ registry:read ]
      x-platform-change: [ P-06, P-19 ]
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: The types
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ResourceType' }
        '304': { $ref: '#/components/responses/NotModified' }
  /api/v1/resource-types/{name}:
    parameters:
      - $ref: '#/components/parameters/ResourceTypeName'
    get:
      operationId: getResourceType
      summary: Get a resource type
      description: The latest published version of the type, with an `ETag` (its hash); `If-None-Match` answers 304 when nothing changed.
      tags: [ Resource types ]
      x-scopes: [ registry:read ]
      x-platform-change: [ P-06, P-19 ]
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: The type
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResourceType' }
        '304': { $ref: '#/components/responses/NotModified' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/resource-types/{name}:observe-list:
    parameters:
      - $ref: '#/components/parameters/ResourceTypeName'
    post:
      operationId: observeListResourceType
      summary: Observe one page of a type's resources
      description: |
        The paged list read drift detection runs on: one call of the type's `observe.list` action
        (up to 500 objects), every item mapped through `observe.map`, with `managed` and `wfrn` from
        the registry's `(provider, region, providerId)` index. With `account`, only items registered
        to that account. 404 `observe.notSupported` when the type has no `observe.list`. Draws from the
        provider's observe rate bucket (429 with `Retry-After` when it is empty).
      tags: [ Observe ]
      x-scopes: [ resources:observe ]
      x-platform-change: [ P-09 ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ObserveListRequest' }
      responses:
        '200':
          description: One page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ObserveListResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/resource-types/{name}:discover:
    parameters:
      - $ref: '#/components/parameters/ResourceTypeName'
    post:
      operationId: discoverResourceType
      summary: Discover what the provider has
      description: One page of the type's `observe.discover` action (or `observe.list` when no discover action is set), every item managed or not. It never registers anything; importing is the state service's command.
      tags: [ Observe ]
      x-scopes: [ resources:observe ]
      x-platform-change: [ P-09 ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DiscoverRequest' }
      responses:
        '200':
          description: One page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ObserveListResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/catalog:
    get:
      operationId: listCatalog
      summary: The catalog
      description: Every published workflow as an operation, with P-08's `subjectInput`, `destructive`, `approval`, `mutableFields`, `bulk` and `effect`. `noun` keeps the entries of one resource type, which is how the BFF composes a type's Actions menu.
      tags: [ Catalog ]
      x-scopes: [ registry:read ]
      x-platform-change: [ P-08 ]
      parameters:
        - name: noun
          in: query
          required: false
          description: Only the workflows of this noun (a resource type's name)
          schema: { type: string }
          x-platform-change: [ P-08 ]
      responses:
        '200':
          description: The entries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CatalogEntry' }
  /api/v1/regions:
    get:
      operationId: listRegions
      summary: List regions
      description: Every kind Region file, `global` for now. The region switcher always reads this.
      tags: [ Regions ]
      x-scopes: [ registry:read ]
      x-platform-change: [ P-07 ]
      responses:
        '200':
          description: The regions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Region' }
  /api/v1/regions/{name}:
    parameters:
      - $ref: '#/components/parameters/RegionName'
    get:
      operationId: getRegion
      summary: Get a region
      tags: [ Regions ]
      x-scopes: [ registry:read ]
      x-platform-change: [ P-07 ]
      responses:
        '200':
          description: The region
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Region' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/regions/{name}/availability:
    parameters:
      - $ref: '#/components/parameters/RegionName'
    get:
      operationId: getRegionAvailability
      summary: What a region offers
      description: 'The types and workflows available in the region: a type is available where the provider of its `producedBy` workflow''s create call has an endpoint.'
      tags: [ Regions ]
      x-scopes: [ registry:read ]
      x-platform-change: [ P-07 ]
      responses:
        '200':
          description: The types and workflows
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegionAvailability' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/resources:
    get:
      operationId: listResources
      summary: List resources
      description: The registry, filtered in the database (P-05) and scoped to the caller (P-18). Without `limit` the whole filtered array, as today; with `limit` a page ordered by `_id` and a `Link` header while there is more.
      tags: [ Resources ]
      x-scopes: [ registry:read ]
      x-platform-change: [ P-05, P-18 ]
      parameters:
        - name: type
          in: query
          required: false
          schema: { type: string }
        - name: owner
          in: query
          required: false
          schema: { type: string }
        - name: status
          in: query
          required: false
          schema: { type: string }
        - $ref: '#/components/parameters/AccountFilter'
        - $ref: '#/components/parameters/WfrnFilter'
        - name: visibility
          in: query
          required: false
          schema: { type: string, enum: [ team, public ] }
          x-platform-change: [ P-05 ]
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/After'
      responses:
        '200':
          description: The resources
          headers:
            Link: { $ref: '#/components/headers/Link' }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Resource' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/v1/resources/by-wfrn:
    get:
      operationId: getResourceByWfrn
      summary: Get a resource by wfrn
      description: The resource that holds the wfrn, retired or not (tombstones are the state service's job); 404 when none does or it is outside the caller's scope.
      tags: [ Resources ]
      x-scopes: [ registry:read ]
      x-platform-change: [ P-05, P-18 ]
      parameters:
        - $ref: '#/components/parameters/Wfrn'
      responses:
        '200':
          description: The resource
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Resource' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/resources/by-wfrn:observe:
    post:
      operationId: observeResourceByWfrn
      summary: Observe a resource by wfrn
      description: As `POST /resources/{id}:observe`, for a resource named by its wfrn.
      tags: [ Observe ]
      x-scopes: [ resources:observe ]
      x-platform-change: [ P-09 ]
      parameters:
        - $ref: '#/components/parameters/Wfrn'
      responses:
        '200':
          description: What the provider answered, mapped
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ObserveResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/resources/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      operationId: getResource
      summary: Get a resource
      description: One resource by its registry id; 404 when unknown or outside the caller's scope (P-18).
      tags: [ Resources ]
      x-scopes: [ registry:read ]
      x-platform-change: [ P-05, P-18 ]
      responses:
        '200':
          description: The resource
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Resource' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/resources/{id}/lineage:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      operationId: getResourceLineage
      summary: A resource's lineage
      description: The direct neighbours and the whole graph around the resource, at most 32 hops and 1000 resources, the resource itself first. Scoped to the caller (P-18).
      tags: [ Resources ]
      x-scopes: [ registry:read ]
      x-platform-change: [ P-18 ]
      responses:
        '200':
          description: The lineage
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Lineage' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/resources/{id}:observe:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      operationId: observeResource
      summary: Observe a resource
      description: |
        Reads the resource's truth from its provider: the type's `observe` action, with `observe.input`
        resolved from `$resource` and `$region`, called with `channel: observe` in the resource's region
        and environment, and the response mapped through `observe.map`. Only mapped fields come back,
        redacted and with `sensitive` fields masked. 404 `observe.notSupported` when the type has no
        `observe` block. Draws from the provider's observe rate bucket and the account's share of it.
      tags: [ Observe ]
      x-scopes: [ resources:observe ]
      x-platform-change: [ P-09 ]
      responses:
        '200':
          description: What the provider answered, mapped
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ObserveResult' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/resources/{id}:metrics:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      operationId: getResourceMetrics
      summary: A resource's metrics
      description: The type's `observe.metrics` action called under the observe rules, answering the mapped series between `from` and `to`. 404 `observe.notSupported` when the type has no metrics action.
      tags: [ Observe ]
      x-scopes: [ resources:observe ]
      x-platform-change: [ P-09 ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MetricsRequest' }
      responses:
        '200':
          description: The series
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MetricsResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/resources:observe:
    post:
      operationId: observeResources
      summary: Observe many resources
      description: Up to 100 ids or wfrns, one result per entry in the order given (ids first, then wfrns), called with bounded concurrency per provider (`platform.observe.concurrency`).
      tags: [ Observe ]
      x-scopes: [ resources:observe ]
      x-platform-change: [ P-09 ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ObserveBatchRequest' }
      responses:
        '200':
          description: One result per resource
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ObserveBatchResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/resources:backfill-wfrn:
    post:
      operationId: backfillWfrns
      summary: Mint wfrns for a team's existing resources
      description: 'The import path of the console: mints a wfrn for every resource of `owner` that has none, under the account and region given, and emits `resource.registered` for each. Idempotent, a resource with a wfrn is skipped. Admins only.'
      tags: [ Resources ]
      x-scopes: [ admin ]
      x-platform-change: [ P-05 ]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BackfillRequest' }
      responses:
        '200':
          description: What was minted and what was skipped
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BackfillResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/resources:find-collisions:
    post:
      operationId: findResourceCollisions
      summary: Find registry records that were overwritten
      description: 'A one-off check for the platform team: every record whose history shows two `resource.registered` events with different jobs and different providers for one id, which before P-05 merged silently. Admins only.'
      tags: [ Resources ]
      x-scopes: [ admin ]
      x-platform-change: [ P-05 ]
      responses:
        '200':
          description: The collisions found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CollisionReport' }
        '403': { $ref: '#/components/responses/Forbidden' }
