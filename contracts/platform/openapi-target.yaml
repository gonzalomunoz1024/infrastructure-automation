components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: A service account token (`iaf_<token>`) or, under the `oidc` profile, a JWT of the configured issuer and audience
    devUser:
      type: apiKey
      in: header
      name: X-User
      description: The dev identity for local runs (`gonzalo` by default, an admin in `team-compute` and `team-platform`); ignored under the `oidc` profile
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: 'Up to 255 characters, scoped to the caller. The same key with the same request answers the first result for 24 hours with `Idempotent-Replay: true`; the same key with another request, or while the first still runs, is 409. P-21 honours it on PUT, PATCH and DELETE too and adds the context headers to the fingerprint.'
      schema: { type: string, maxLength: 255 }
      x-platform-change: []
    WorkflowVersion:
      name: X-Workflow-Version
      in: header
      required: false
      description: Run this published (or retired) version, like 1.2.0, instead of the one the release router picks; no canary split. `?version=` pins too.
      schema: { type: string }
      x-platform-change: []
    OnBehalfOf:
      name: X-On-Behalf-Of
      in: header
      required: false
      description: A compact JWS (ES256) signed by the console's BFF naming the console user (`sub`, `name`, `email`, `groups`, `acct`, `region`, `jti`, `iat`, `exp` at most 60 seconds apart). Accepted only from a service account with the `console:act` scope bound to the assertion's console account (400 otherwise); a bad signature, audience, expiry or a replayed `jti` is 401.
      schema: { type: string }
      x-platform-change: [ P-02 ]
    ResourceWfrn:
      name: X-Resource-Wfrn
      in: header
      required: false
      description: The wfrn the job is about, minted by the state service before the start. Accepted only with a delegation, and only when its account and region equal the delegation's (else 400 `wfrn.contextMismatch`).
      schema: { $ref: '#/components/schemas/Wfrn' }
      x-platform-change: [ P-04 ]
    ConsoleRequestId:
      name: X-Console-Request-Id
      in: header
      required: false
      description: The console's request id, kept on the job as `context.consoleRequestId` and a filter on `GET /jobs`. Accepted only with a delegation.
      schema: { type: string, maxLength: 128 }
      x-platform-change: [ P-04 ]
    JobLabel:
      name: X-Job-Label-<name>
      in: header
      required: false
      description: 'Up to sixteen labels on the job, one header each, `<name>` being `[a-z0-9-]{1,32}` and the value up to 128 characters (for example `X-Job-Label-Tab: console-4f2a`). Accepted only with a delegation.'
      schema: { type: string, maxLength: 128 }
      x-name-pattern: '^X-Job-Label-[a-z0-9-]{1,32}$'
      x-platform-change: [ P-04 ]
    Traceparent:
      name: traceparent
      in: header
      required: false
      description: W3C trace context; the request's span continues it and the job's `traceId` is its trace id.
      schema: { type: string, pattern: '^[0-9a-f]{2}-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$' }
      x-platform-change: [ P-13 ]
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: The `ETag` of the copy the caller holds; 304 when it is still current
      schema: { type: string }
      x-platform-change: [ P-19 ]
    LastEventId:
      name: Last-Event-ID
      in: header
      required: false
      description: The browser-style resume point of a server-sent event stream, the sequence of the last event received
      schema: { type: integer, format: int64 }
      x-platform-change: [ P-01 ]
    AfterSeq:
      name: after
      in: query
      required: false
      description: Only events with a sequence above this one
      schema: { type: integer, format: int64 }
      x-platform-change: [ P-01 ]
    Limit:
      name: limit
      in: query
      required: false
      description: Opt-in paging (P-05), 1 to 500; the body stays an array and a `Link` header carries the next page
      schema: { type: integer, minimum: 1, maximum: 500 }
      x-platform-change: [ P-05 ]
    After:
      name: after
      in: query
      required: false
      description: The opaque cursor of the `Link` header of the previous page
      schema: { type: string }
      x-platform-change: [ P-05 ]
    AccountFilter:
      name: account
      in: query
      required: false
      description: Only resources of this console account; a console service account only ever sees its own
      schema: { $ref: '#/components/schemas/AccountId' }
      x-platform-change: [ P-05 ]
    WfrnFilter:
      name: wfrn
      in: query
      required: false
      description: The resource with exactly this wfrn
      schema: { $ref: '#/components/schemas/Wfrn' }
      x-platform-change: [ P-05 ]
    Wfrn:
      name: wfrn
      in: query
      required: true
      description: The resource's wfrn, percent-encoded
      schema: { $ref: '#/components/schemas/Wfrn' }
      x-platform-change: [ P-05 ]
    ResourceId:
      name: id
      in: path
      required: true
      description: The registry id (the provider's id, or the ULID of a wfrn-registered resource)
      schema: { type: string }
    ResourceTypeName:
      name: name
      in: path
      required: true
      schema: { type: string, pattern: '^[a-z0-9-]{1,64}$' }
    RegionName:
      name: name
      in: path
      required: true
      schema: { $ref: '#/components/schemas/RegionName' }
    JobId:
      name: id
      in: path
      required: true
      schema: { type: string }
    AuditJobId:
      name: jobId
      in: path
      required: true
      schema: { type: string }
    ApprovalId:
      name: id
      in: path
      required: true
      schema: { type: string }
    ServiceAccountId:
      name: id
      in: path
      required: true
      schema: { type: string }
  headers:
    Link:
      description: '`<url>; rel="next"`: the next page, present while there is more (P-05)'
      schema: { type: string }
      x-platform-change: [ P-05 ]
    ETag:
      description: The hash of the published content (P-19)
      schema: { type: string }
      x-platform-change: [ P-19 ]
    IdempotentReplay:
      description: '`true` when the answer is the kept result of an earlier request with the same `Idempotency-Key`'
      schema: { type: boolean }
      x-platform-change: [ P-13 ]
    RetryAfter:
      description: Seconds until the next token
      schema: { type: integer }
  responses:
    Accepted:
      description: The command was accepted
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CommandAccepted' }
    BadRequest:
      description: Bad input; `problems` when a schema or registry check failed
      content:
        application/json:
          schema:
            anyOf:
              - $ref: '#/components/schemas/ErrorResponse'
              - $ref: '#/components/schemas/ProblemResponse'
    BadRequestBatch:
      description: Bad input; `rows` names the invalid rows
      content:
        application/json:
          schema:
            anyOf:
              - $ref: '#/components/schemas/ErrorResponse'
              - $ref: '#/components/schemas/BatchProblemResponse'
    Unauthorized:
      description: A bearer token or assertion that does not verify
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: Not allowed, by RBAC, a scope or the policy engine
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Unknown, or outside the caller's scope (P-18)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotModified:
      description: The caller's copy is current (`If-None-Match` matched)
    Conflict:
      description: A state conflict, or an `Idempotency-Key` reused with another request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    TooManyRequests:
      description: Over a quota or rate bucket; `Retry-After` says when to try again
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    Wfrn:
      type: string
      description: 'A resource name: `wfrn:<partition>:<service>:<region>:<account>:<type>/<id>` (contracts/wfrn/SPEC.md)'
      maxLength: 1024
      pattern: '^wfrn:[a-z0-9-]{1,32}:[a-z0-9-]{2,32}:(|[a-z0-9-]{2,32}):(|[0-9]{12}):[a-z0-9-]{1,64}/[a-z0-9-]{1,128}(/[a-z0-9-]{1,128})*$'
      examples: [ 'wfrn:wf:compute:global:123456789012:vm/vm-01jbx7q2m4k9d3c8f5r6t1w0ya' ]
    AccountId:
      type: string
      description: A console account id, twelve digits
      pattern: '^[0-9]{12}$'
      examples: [ '123456789012' ]
    RegionName:
      type: string
      description: A region id (kind Region, P-07)
      pattern: '^[a-z0-9-]{2,32}$'
      examples: [ global ]
    ErrorResponse:
      type: object
      required: [ error ]
      properties:
        error: { type: string, description: What went wrong }
        correlationId: { type: string, description: 'On 500: the request''s trace id, which finds the cause in the API''s log' }
        detail: { description: 'On 409: what blocks the command (for example the dependents of a resource, or the change requests a merge waits for)' }
        retryAfter: { type: integer, description: 'On 429: seconds until the next token' }
    Problem:
      type: object
      required: [ level, code, message ]
      properties:
        code: { type: string, description: A stable problem code, for example schema.invalid }
        field: { type: string, description: The field at fault, as a JSON pointer }
        level: { type: string, enum: [ error, warning ] }
        message: { type: string }
        step: { type: string }
        fix:
          type: object
          description: A fix the editor can apply
          required: [ label, kind ]
          properties:
            label: { type: string }
            kind: { type: string, enum: [ replace, insert-approval, connect ] }
            value: { type: string }
    ProblemResponse:
      type: object
      required: [ error, problems ]
      properties:
        error: { type: string }
        problems:
          type: array
          items: { $ref: '#/components/schemas/Problem' }
    BatchProblemResponse:
      type: object
      required: [ error, rows ]
      properties:
        error: { type: string }
        rows:
          type: array
          items:
            type: object
            required: [ index, problems ]
            properties:
              index: { type: integer, description: The row's index in items }
              problems:
                type: array
                items: { $ref: '#/components/schemas/Problem' }
    CommandAccepted:
      type: object
      required: [ id, status ]
      properties:
        id: { type: string }
        status: { type: string }
        links: { type: object, additionalProperties: true }
    JobAccepted:
      type: object
      required: [ jobId, status, links ]
      properties:
        jobId: { type: string, description: 'The job to poll at /api/v1/jobs/{id}' }
        status: { type: string, description: queued }
        links:
          type: object
          required: [ job ]
          properties:
            job: { type: string, description: The job URL }
    BatchAccepted:
      type: object
      required: [ jobId, rows ]
      properties:
        jobId: { type: string, description: The parent job of the batch }
        rows: { type: integer, description: How many rows the batch holds }
        status: { type: string }
        links:
          type: object
          properties:
            job: { type: string, description: The job URL }
    RolloutPolicy:
      type: object
      description: 'How the rows roll out: waves of growing percentages, a parallelism cap and a stop threshold'
      properties:
        waves:
          type: array
          items: { type: integer }
        maxParallel: { type: integer, minimum: 1 }
        stopIfFailedPercent: { type: integer, minimum: 0, maximum: 100 }
    Identity:
      type: object
      description: Who is calling
      required: [ id, teams, roles, admin ]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        teams:
          type: array
          items: { type: string }
        roles:
          type: array
          items: { type: string }
        admin: { type: boolean }
        kind: { type: string, enum: [ user, service, system ] }
        delegation:
          $ref: '#/components/schemas/Delegation'
          x-platform-change: [ P-02 ]
    Delegation:
      type: object
      description: 'P-02: the console user a service account acts for, from the verified X-On-Behalf-Of assertion. Left out when there is none.'
      required: [ userId, accountId ]
      properties:
        userId: { type: string, description: The user's id at the identity provider }
        name: { type: string }
        email: { type: string }
        accountId: { $ref: '#/components/schemas/AccountId' }
        region: { $ref: '#/components/schemas/RegionName' }
        assertionId: { type: string, description: The assertion's jti }
    Person:
      type: object
      description: A console user, as `onBehalfOf` names one
      required: [ id ]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
    ServiceAccount:
      type: object
      required: [ id, name ]
      properties:
        id: { type: string }
        name: { type: string }
        roles:
          type: array
          items: { type: string }
        teams:
          type: array
          items: { type: string }
        scopes:
          type: array
          items: { $ref: '#/components/schemas/Scope' }
        createdAt: { type: string, format: date-time }
        consoleAccount:
          $ref: '#/components/schemas/AccountId'
          description: 'P-03: the console account the service account is bound to; absent for every other account'
          x-platform-change: [ P-03 ]
    Scope:
      type: string
      description: What a service account may call; `console:act`, `resources:observe` and `events:read` are P-03's
      enum: [ registry:read, workflows:validate, workflows:dry-run, workflows:write, jobs:start, jobs:read, providers:write, admin, console:act, resources:observe, events:read ]
    CreateServiceAccount:
      type: object
      required: [ name ]
      properties:
        name: { type: string }
        roles:
          type: array
          items: { type: string }
        teams:
          type: array
          description: 'The teams the account acts for; its creator''s when left out. With `consoleAccount`: exactly one, the account''s owning team'
          items: { type: string }
        scopes:
          type: array
          items: { $ref: '#/components/schemas/Scope' }
        preset:
          type: string
          description: A named scope set; `scopes` given with a preset must fit in it
          enum: [ invoker, assistant, ci, console, console-internal ]
        consoleAccount:
          $ref: '#/components/schemas/AccountId'
          description: 'P-03: bind the account to this console account (admin only, with the `console` preset)'
          x-platform-change: [ P-03 ]
    ServiceAccountCreated:
      type: object
      required: [ id, token, scopes ]
      properties:
        id: { type: string }
        token: { type: string, description: 'Shown once; `iaf_<token>`' }
        scopes:
          type: array
          items: { $ref: '#/components/schemas/Scope' }
        teams:
          type: array
          items: { type: string }
        note: { type: string, description: Says when the teams were taken from the creator, or that no team means the policy refuses every job }
    ServiceAccountRotated:
      type: object
      required: [ id, token ]
      properties:
        id: { type: string }
        token: { type: string, description: 'The new token, shown once; the old one works for the grace period' }
        graceUntil: { type: string, format: date-time, description: When the old token stops working }
    ResourceType:
      type: object
      description: A kind ResourceType as the API serves it (contracts/schemas/resource-type.schema.json is the file's schema)
      required: [ name, plural, schema, states ]
      properties:
        name: { type: string }
        plural: { type: string }
        owner: { type: string }
        description: { type: string }
        visibility: { type: string, enum: [ team, public, hidden ] }
        schema: { type: object, description: The JSON Schema of a resource's attributes, with the x-console hints (P-06), additionalProperties: true }
        states:
          type: array
          items: { type: string }
        producedBy: { type: string }
        service:
          type: string
          description: 'P-06: the console''s service grouping and the service segment of the wfrn; the owner team without its team- prefix by default'
          pattern: '^[a-z0-9-]{2,32}$'
          x-platform-change: [ P-06 ]
        console:
          $ref: '#/components/schemas/ConsoleBlock'
          x-platform-change: [ P-06 ]
        observe:
          $ref: '#/components/schemas/ObserveSpec'
          x-platform-change: [ P-06 ]
        version:
          type: integer
          description: 'P-19: the published version of the type'
          x-platform-change: [ P-19 ]
        hash:
          type: string
          description: 'P-19: the hash of the published file, also the ETag'
          x-platform-change: [ P-19 ]
    ConsoleBlock:
      type: object
      description: 'P-06: how the console shows the type; every key optional, defaults drawn from the schema and the workflows'
      properties:
        title: { type: string }
        icon: { type: string }
        list:
          type: object
          properties:
            columns:
              type: array
              items: { type: string }
            defaultSort: { type: string }
        detail:
          type: object
          properties:
            tabs:
              type: array
              items: { type: string, enum: [ configuration, drift, activity, relationships, tags, monitoring, permissions, json ] }
        lifecycle:
          type: object
          additionalProperties: { type: string, enum: [ pending, active, updating, deleting, deleted, failed ] }
    ObserveSpec:
      type: object
      description: 'P-06: how drift detection reads the truth (P-09 executes it)'
      required: [ provider, action ]
      properties:
        provider: { type: string }
        action: { type: string }
        input: { type: object, additionalProperties: true }
        map:
          type: object
          additionalProperties: { type: string }
        ignore:
          type: array
          items: { type: string }
        interval: { type: string }
        notFound: { type: string, enum: [ missing, deleted ] }
        discover: { $ref: '#/components/schemas/ObserveListSpec' }
        list: { $ref: '#/components/schemas/ObserveListSpec' }
        metrics:
          type: object
          properties:
            action: { type: string }
            input: { type: object, additionalProperties: true }
            map:
              type: object
              additionalProperties: { type: string }
    ObserveListSpec:
      type: object
      required: [ action ]
      properties:
        action: { type: string }
        input: { type: object, additionalProperties: true }
        items: { type: string }
        id: { type: string }
        cursor:
          type: object
          properties:
            request: { type: string }
            response: { type: string }
        pageSize: { type: integer }
    CatalogEntry:
      type: object
      description: One published workflow as the catalog shows it
      required: [ workflow, title, noun, verb, method, path, batchPath, input, owner, version ]
      properties:
        workflow: { type: string }
        title: { type: string }
        noun: { type: string }
        verb: { type: string }
        persona: { type: string }
        method: { type: string }
        path: { type: string }
        batchPath: { type: string }
        previewPath: { type: string }
        input: { type: object, description: 'The input schema as callers see it (an orCreateWith input shows both forms)', additionalProperties: true }
        mcpTool: { type: string }
        owner: { type: string }
        version: { type: string }
        description: { type: string }
        batch:
          type: object
          properties:
            max: { type: integer }
            rollout: { $ref: '#/components/schemas/RolloutPolicy' }
        deprecated:
          type: object
          properties:
            since: { type: string }
            sunset: { type: string }
            replacement: { type: string }
            message: { type: string }
        subjectInput:
          type: [ string, 'null' ]
          description: 'P-08: the input that takes the resource an action is about; null for create and for workflows with none'
          x-platform-change: [ P-08 ]
        destructive:
          type: boolean
          description: 'P-08: the verb is delete, or the workflow is tagged destructive'
          x-platform-change: [ P-08 ]
        approval:
          type: boolean
          description: 'P-08: policy.approval.required'
          x-platform-change: [ P-08 ]
        mutableFields:
          type: array
          description: 'P-08: for an update workflow, the inputs that change the resource'
          items: { type: string }
          x-platform-change: [ P-08 ]
        bulk:
          type: boolean
          description: 'P-08: the workflow has api.batch'
          x-platform-change: [ P-08 ]
        effect:
          type: string
          description: 'P-08: the strongest effect among its provider calls'
          enum: [ create, change, delete, read, none, unknown ]
          x-platform-change: [ P-08 ]
    Region:
      type: object
      description: A kind Region as the API serves it (P-07)
      required: [ name, partition, status, environments ]
      properties:
        name: { $ref: '#/components/schemas/RegionName' }
        title: { type: string }
        description: { type: string }
        partition: { type: string }
        status: { type: string, enum: [ available, opt-in, retired ] }
        environments:
          type: array
          items: { type: string }
        default: { type: boolean, description: Whether this is the installation's default region (`platform.regions.default`) }
    RegionAvailability:
      type: object
      required: [ types, workflows ]
      properties:
        types:
          type: array
          items: { type: string }
        workflows:
          type: array
          items: { type: string }
    ResourceOrigin:
      type: object
      properties:
        jobId: { type: string }
        workflow: { type: string }
        version: { type: string }
    Resource:
      type: object
      description: One entry of the registry
      required: [ id, type, status, attributes ]
      properties:
        id: { type: string, description: 'The registry id: the provider''s id, or the ULID of a wfrn-registered resource (P-05)' }
        type: { type: string }
        name: { type: string }
        status: { type: string }
        attributes: { type: object, additionalProperties: true }
        owner: { type: string }
        visibility: { type: string }
        createdBy: { $ref: '#/components/schemas/ResourceOrigin' }
        builtFrom:
          type: array
          items: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        wfrn:
          $ref: '#/components/schemas/Wfrn'
          description: 'P-05: the resource''s name, when it was registered by a job with an account context or backfilled'
