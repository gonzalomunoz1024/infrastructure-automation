        seq: { type: integer }
        at: { type: string, format: date-time }
        kind: { type: string, enum: [ requested, preview, policy, change, approval, step, changed, closed, decision ] }
        actor: { type: string }
        data: { type: object, description: 'Redacted before it is chained; with P-12 a requested entry carries onBehalfOf, actor, accountId, region and wfrn', additionalProperties: true }
        hash: { type: string }
        previous: { type: string }
    Seal:
      type: object
