        startedAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time }
    Batch:
      type: object
      properties:
        rows:
          type: array
          items: { $ref: '#/components/schemas/BatchRow' }
        waves:
          type: array
          items: { $ref: '#/components/schemas/Wave' }
        rollout: { $ref: '#/components/schemas/RolloutPolicy' }
        stoppedReason: { type: string }
    ChangeTicket:
      type: object
      required: [ id, state ]
      properties:
        id: { type: string }
        url: { type: string }
        state: { type: string }
