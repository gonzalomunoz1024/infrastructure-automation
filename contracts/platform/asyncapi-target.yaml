        wave: { type: integer }
        percent: { type: integer }
        size: { type: integer }
        status: { type: string }
        reason: { type: string, description: Why the rollout stopped, when it did }
        rows:
          type: array
          items: { type: integer }
    ResourceRegisteredData:
      type: object
      description: 'resource.registered, as ResourceCommandHandler.register builds it, with P-05''s names'
      required: [id, type, state, jobId, workflow, by, created]
      properties:
        id: { type: string, description: The registry id }
        type: { type: string }
        state: { type: string, description: The resource's status after the write }
        jobId: { type: string }
        workflow: { type: string }
        by: { type: string, description: The requester of the job }
        created: { type: boolean, description: 'true for a new record, false for a re-registration' }
