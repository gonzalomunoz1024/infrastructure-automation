          $ref: '#/components/schemas/Wfrn'
          x-platform-change: [P-05]
        accountId:
          type: string
          pattern: '^[0-9]{12}$'
          x-platform-change: [P-05]
        region:
          type: string
          pattern: '^[a-z0-9-]{2,32}$'
          x-platform-change: [P-05]
        providerId:
          type: string
          description: The id the register step gave, when the record's id is a wfrn ULID
          x-platform-change: [P-05]
    ResourceRetiredData:
      type: object
