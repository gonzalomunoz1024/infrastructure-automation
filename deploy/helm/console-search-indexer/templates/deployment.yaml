apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "console-search-indexer.fullname" . }}
  labels:
    {{- include "console-search-indexer.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "console-search-indexer.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "console-search-indexer.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/part-of: console
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: {{ .Values.service.targetPort | quote }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "console-search-indexer.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: 45
      containers:
        - name: service
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: {{ include "console-search-indexer.profiles" . | quote }}
            - name: SPRING_CONFIG_ADDITIONAL_LOCATION
              value: /config/
            - name: CONSOLE_MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mongodb.existingSecret }}
                  key: {{ .Values.mongodb.uriKey }}
            {{- if .Values.opensearchCredentials.existingSecret }}
            - name: CONSOLE_OPENSEARCH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.opensearchCredentials.existingSecret }}
                  key: {{ .Values.opensearchCredentials.usernameKey }}
            - name: CONSOLE_OPENSEARCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.opensearchCredentials.existingSecret }}
                  key: {{ .Values.opensearchCredentials.passwordKey }}
            {{- end }}
            - name: CONSOLE_STATE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.serviceAuth.existingSecret }}
                  key: {{ .Values.serviceAuth.tokenKey }}
                  optional: true
            - name: CONSOLE_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.serviceAuth.existingSecret }}
                  key: {{ .Values.serviceAuth.signingKeyKey }}
                  optional: true
            - name: CONSOLE_PLATFORM_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.platformToken.existingSecret }}
                  key: {{ .Values.platformToken.tokenKey }}
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=75 -XX:+UseG1GC -Djava.io.tmpdir=/tmp"
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "console-search-indexer.fullname" . }}
        - name: tmp
          emptyDir: {}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
