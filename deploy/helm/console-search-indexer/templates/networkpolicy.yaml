{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "console-search-indexer.fullname" . }}
  labels:
    {{- include "console-search-indexer.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "console-search-indexer.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- toYaml .Values.networkPolicy.ingressFrom | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.targetPort }}
    {{- with .Values.networkPolicy.managementFrom }}
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ $.Values.service.managementPort }}
    {{- end }}
{{- end }}
