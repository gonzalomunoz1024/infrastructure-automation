apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "console-state-service.fullname" . }}
  labels:
    {{- include "console-state-service.labels" . | nindent 4 }}
data:
  # the service's settings as an application-cluster.yaml, picked up through SPRING_CONFIG_ADDITIONAL_LOCATION
  application-cluster.yaml: |
    server:
      port: {{ .Values.service.targetPort }}
    spring:
      data:
        mongodb:
          database: {{ .Values.mongodb.database | quote }}
    console:
      region: {{ .Values.console.region | quote }}
      wfrn:
        partition: {{ .Values.console.wfrnPartition | quote }}
      state:
        tombstone-ttl: {{ .Values.console.state.tombstoneTtl }}
        idempotency-ttl: {{ .Values.console.state.idempotencyTtl }}
        types-ttl: {{ .Values.console.state.typesTtl }}
      reaper:
        enabled: {{ .Values.console.reaper.enabled }}
        interval: {{ .Values.console.reaper.interval }}
        pending-timeout: {{ .Values.console.reaper.pendingTimeout }}
        job-timeout: {{ .Values.console.reaper.jobTimeout }}
      platform:
        base-url: {{ .Values.console.platform.baseUrl | quote }}
        timeout: {{ .Values.console.platform.timeout }}
      auth:
        jwks-uri: {{ .Values.console.auth.jwksUri | quote }}
        issuer: {{ .Values.console.auth.issuer | quote }}
        audiences: {{ toJson .Values.console.auth.audiences }}
        dev-headers: false
      ingest:
        enabled: {{ .Values.ingest.enabled }}
        rebuild-on-empty: {{ .Values.ingest.rebuildOnEmpty }}
        kafka:
          bootstrap-servers: {{ .Values.ingest.kafka.bootstrapServers | quote }}
          group-id: {{ .Values.ingest.kafka.groupId | quote }}
          topics: {{ toJson .Values.ingest.kafka.topics }}
          {{- with .Values.ingest.kafka.properties }}
          properties:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      outbox:
        relay:
          enabled: {{ .Values.outbox.relay.enabled }}
          interval: {{ .Values.outbox.relay.interval }}
    management:
      endpoints:
        web:
          exposure:
            include: health, info, prometheus, metrics
      endpoint:
        health:
          probes:
            enabled: true
