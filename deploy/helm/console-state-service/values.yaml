# console-state-service
# Production runs the mongo and kafka profiles: MongoDB holds the log and the projection, Kafka
# carries the platform's events in and the console's events out. The demo profile is for laptops.

replicaCount: 3

image:
  repository: ghcr.io/example/console-state-service
  tag: ""          # defaults to the chart's appVersion
  pullPolicy: IfNotPresent
imagePullSecrets: []

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 100
  fsGroup: 101
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

service:
  type: ClusterIP
  port: 80
  targetPort: 18082

resources:
  requests:
    cpu: 500m
    memory: 768Mi
  limits:
    memory: 1536Mi

autoscaling:
  enabled: false
  minReplicas: 3
  maxReplicas: 12
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 2

topologySpreadConstraints: []
nodeSelector: {}
tolerations: []
affinity: {}

# Spring profiles beyond the defaults; mongo is always on in a cluster, kafka when ingest.kafka.enabled
extraProfiles: []

console:
  region: global
  wfrnPartition: wf
  state:
    tombstoneTtl: 90d
    idempotencyTtl: 24h
    typesTtl: 60s
  reaper:
    enabled: true
    interval: 60s
    pendingTimeout: 5m
    jobTimeout: 2h
  platform:
    baseUrl: http://platform.platform.svc.cluster.local:8080
    timeout: 30s
  auth:
    jwksUri: http://console-bff.console.svc.cluster.local/.well-known/jwks.json
    issuer: console-bff
    audiences: [console-state-service, console]

mongodb:
  # the service's own database; the URI comes from a secret (key CONSOLE_MONGO_URI)
  database: console_state
  existingSecret: console-state-service-mongodb
  uriKey: CONSOLE_MONGO_URI

ingest:
  enabled: true
  rebuildOnEmpty: true
  kafka:
    enabled: true
    bootstrapServers: kafka.kafka.svc.cluster.local:9092
    groupId: console-state-service
    topics: [platform.jobs, platform.resources, identity.changes]
    # extra consumer properties, for example security.protocol
    properties: {}

outbox:
  relay:
    enabled: true
    interval: 1s

crypto:
  # the master key that wraps every account's data key (32 bytes, base64), from a secret
  existingSecret: console-state-service-crypto
  masterKeyKey: CONSOLE_MASTER_KEY

platformToken:
  # the platform's internal service-account token for the HTTP feed, the registry and the snapshot
  existingSecret: console-state-service-platform
  tokenKey: CONSOLE_PLATFORM_TOKEN

metrics:
  serviceMonitor:
    enabled: false
    interval: 30s
    labels: {}

networkPolicy:
  enabled: false
  # who may call the API: the BFF, the drift service and the indexer
  ingressFrom:
    - podSelector:
        matchLabels:
          app.kubernetes.io/part-of: console

env: []
