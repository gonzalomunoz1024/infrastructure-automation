apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "console-cost-service.fullname" . }}
  labels:
    {{- include "console-cost-service.labels" . | nindent 4 }}
data:
  # the service's settings, read from SPRING_CONFIG_ADDITIONAL_LOCATION over the jar's own defaults;
  # named application.yaml so it applies whatever the profiles (a profile-named file would need its profile)
  application.yaml: |
    server:
      port: {{ .Values.service.targetPort }}
    spring:
      data:
        mongodb:
          database: {{ .Values.mongodb.database | quote }}
    console:
      region: {{ .Values.console.region | quote }}
      pricing:
        source: {{ .Values.console.pricing.source | quote }}
        refresh: {{ .Values.console.pricing.refresh }}
      ledger:
        close-grace: {{ .Values.console.ledger.closeGrace }}
        close-interval: {{ .Values.console.ledger.closeInterval }}
        repair-interval: {{ .Values.console.ledger.repairInterval }}
        backfill-days: {{ .Values.console.ledger.backfillDays }}
        demo-spread-days: 0
      budgets:
        evaluate-interval: {{ .Values.console.budgets.evaluateInterval }}
      chargeback:
        interval: {{ .Values.console.chargeback.interval }}
        export: {{ .Values.console.chargeback.export | quote }}
        {{- with .Values.console.chargeback.webhookUrl }}
        webhook-url: {{ . | quote }}
        {{- end }}
      state:
        url: {{ .Values.console.state.url | quote }}
        timeout: {{ .Values.console.state.timeout }}
        dev-headers: false
      identity:
        url: {{ .Values.console.identity.url | quote }}
        cache-ttl: {{ .Values.console.identity.cacheTtl }}
      platform:
        base-url: {{ .Values.console.platform.baseUrl | quote }}
        timeout: {{ .Values.console.platform.timeout }}
      auth:
        jwks-uri: {{ .Values.console.auth.jwksUri | quote }}
        issuer: {{ .Values.console.auth.issuer | quote }}
        audiences: {{ toJson .Values.console.auth.audiences }}
        dev-headers: false
        token-url: {{ .Values.console.auth.tokenUrl | quote }}
        client-assertion-file: /var/run/secrets/console/token
      ingest:
        enabled: {{ .Values.ingest.enabled }}
        kafka:
          bootstrap-servers: {{ .Values.ingest.kafka.bootstrapServers | quote }}
          group-id: {{ .Values.ingest.kafka.groupId | quote }}
          topics: {{ toJson .Values.ingest.kafka.topics }}
          {{- with .Values.ingest.kafka.properties }}
          properties:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      outbox:
        relay:
          enabled: true
          interval: {{ .Values.console.outbox.relayInterval }}
        kafka:
          bootstrap-servers: {{ .Values.ingest.kafka.bootstrapServers | quote }}
          client-id: console-cost-service
          {{- with .Values.ingest.kafka.properties }}
          properties:
            {{- toYaml . | nindent 12 }}
          {{- end }}
    management:
      endpoints:
        web:
          exposure:
            include: health, info, prometheus, metrics
      endpoint:
        health:
          probes:
            enabled: true
