{{- range $w := .Values.providerWorkers }}
{{- $drain := int (default 30 $w.drainSeconds) }}
---
# The worker of custom-code provider {{ $w.name }}: it polls the provider's task queue on Temporal,
# connecting the way the platform does (temporal.tls and temporal.apiKeySecret as the SDKs'
# IAF_TEMPORAL_* variables).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "platform.fullname" $ }}-provider-{{ $w.name }}
  labels:
    {{- include "platform.labels" $ | nindent 4 }}
    app.kubernetes.io/component: provider-worker
    platform.provider: {{ $w.name | quote }}
spec:
  replicas: {{ default 1 $w.replicas }}
  selector:
    matchLabels:
      {{- include "platform.selector" (dict "ctx" $ "component" "provider-worker") | nindent 6 }}
      platform.provider: {{ $w.name | quote }}
  template:
    metadata:
      labels:
        {{- include "platform.labels" $ | nindent 8 }}
        app.kubernetes.io/component: provider-worker
        platform.provider: {{ $w.name | quote }}
      {{- with $w.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ default (include "platform.serviceAccountName" $) $w.serviceAccountName }}
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      # the drain plus time to stop
      terminationGracePeriodSeconds: {{ add $drain 15 }}
      securityContext:
        {{- toYaml $.Values.podSecurityContext | nindent 8 }}
      containers:
        - name: worker
          image: {{ include "platform.image" (dict "ctx" $ "image" $w.image) }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          {{- with $w.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- toYaml $.Values.containerSecurityContext | nindent 12 }}
          env:
            - name: TEMPORAL_ADDRESS
              value: {{ $.Values.temporal.address | quote }}
            - name: TEMPORAL_NAMESPACE
              value: {{ $.Values.temporal.namespace | quote }}
            - name: WORKER_DRAIN_SECONDS
              value: {{ $drain | quote }}
            {{- with $.Values.temporal.tls }}
            {{- if .secretName }}
            {{- if .caKey }}
            - { name: IAF_TEMPORAL_TLS_CA, value: /etc/temporal-tls/ca.crt }
            {{- end }}
            {{- if and .certKey .keyKey }}
            - { name: IAF_TEMPORAL_TLS_CERT, value: /etc/temporal-tls/tls.crt }
            - { name: IAF_TEMPORAL_TLS_KEY, value: /etc/temporal-tls/tls.key }
            {{- end }}
            {{- end }}
            {{- end }}
            {{- with include "platform.secretEnv" (dict "env" "IAF_TEMPORAL_API_KEY" "secret" $.Values.temporal.apiKeySecret) }}
            {{- . | nindent 12 }}
            {{- end }}
            {{- with $w.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with $w.envFrom }}
          envFrom:
            {{- range . }}
            - secretRef: { name: {{ . | quote }} }
            {{- end }}
          {{- end }}
          {{- with $w.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml (default (dict "requests" (dict "cpu" "50m" "memory" "64Mi")) $w.resources) | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            {{- if $.Values.temporal.tls.secretName }}
            - { name: temporal-tls, mountPath: /etc/temporal-tls, readOnly: true }
            {{- end }}
      volumes:
        - { name: tmp, emptyDir: {} }
        {{- with include "platform.temporalTlsVolume" $ }}
        {{- . | nindent 8 }}
        {{- end }}
      {{- with $w.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $w.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
