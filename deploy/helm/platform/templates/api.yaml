apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "platform.fullname" . }}-api
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      {{- include "platform.selector" (dict "ctx" . "component" "api") | nindent 6 }}
  strategy:
    {{- if include "platform.gitStore" . }}
    type: Recreate  # the one pod that holds the clone the workflows live in: never two at once
    {{- else }}
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
    {{- end }}
  template:
    {{- include "platform.backendPod" (dict "ctx" . "component" "api" "roles" (ternary "api" "api,worker" .Values.worker.enabled) "settings" .Values.api) | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "platform.fullname" . }}-api
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
    platform.metrics: "true"
spec:
  type: {{ .Values.api.service.type }}
  selector:
    {{- include "platform.selector" (dict "ctx" . "component" "api") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
