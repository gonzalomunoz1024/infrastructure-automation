# Every option on, for `helm lint`/`helm template` in CI and as an example of a full install.
image:
  registry: registry.example.com/platform
imagePullSecrets: [registry-credentials]

backend:
  profiles: [temporal, vault, oidc, live]
  config:
    platform:
      identity:
        mode: oidc
        # all three are required under the oidc profile; the audience is the auth proxy's client id
        oidc-issuer: https://login.example.com/realms/platform
        oidc-audience: platform
        oidc-jwks-uri: https://login.example.com/realms/platform/protocol/openid-connect/certs
      credentials:
        mode: vault
        vault-url: https://vault.example.com
  env:
    - { name: LOGGING_LEVEL_COM_IAF, value: INFO }

worker:
  enabled: true
  replicas: 3

temporal:
  address: temporal-frontend.temporal.svc.cluster.local:7233
  namespace: platform
  uiUrl: https://temporal.example.com
  tls:
    secretName: temporal-client-tls
  apiKey: vault:temporal/cloud-api-key
  apiKeySecret: { name: temporal-cloud, key: api-key }
  payloadKey: vault:temporal/payload-key

mongo:
  enabled: true
  uriSecret: { name: platform-db, key: uri }

content:
  repository: https://git.example.com/platform/content.git
  ref: main
  credentialsSecret: { name: content-repo-credentials }
  # several API and worker pods, so the workflows live in the database, seeded from the repository
  # (git-store-values.yaml shows the Git workflow store)
  gitStore: { enabled: false }

audit:
  signingKeySecret: { name: platform-audit, key: signing-key }
  retentionYears: 10
  siem:
    enabled: true
    hec:
      url: https://splunk.example.com:8088/services/collector/event
      token: vault:splunk/hec-token
      index: platform-audit
    syslog: { host: syslog.example.internal, port: 6514, protocol: tcp }
  worm:
    mode: s3
    s3: { bucket: platform-evidence, prefix: prod, region: eu-west-1 }

secrets:
  envFrom: [platform-assistant]
  env:
    - { name: PLATFORM_CREDENTIALS_VAULTTOKEN, secretName: platform-vault, key: token }

vaultAgent:
  enabled: true
  role: platform
  configFile: platform.properties
  annotations:
    vault.hashicorp.com/agent-inject-secret-platform.properties: secret/data/platform/backend

ingress:
  enabled: true
  className: nginx
  host: platform.example.com
  tlsSecretName: platform-tls
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"

metrics:
  serviceMonitor:
    enabled: true
    labels: { release: prometheus }
  grafanaDashboard:
    enabled: true
    namespace: monitoring
    labels: { release: prometheus }
    annotations: { grafana_folder: Platform }

providerWorkers:
  - name: ip-pool
    image: { repository: registry.example.com/team-platform/ip-pool-provider, tag: 1.0.0 }
    replicas: 2
  - name: dns-records
    image: { repository: registry.example.com/team-platform/dns-records-provider, tag: 1.0.0 }
    replicas: 2
    drainSeconds: 60
    envFrom: [dns-records-api]
    podAnnotations:
      vault.hashicorp.com/agent-inject: "true"
      vault.hashicorp.com/role: dns-records
  - name: cmdb
    image: { repository: registry.example.com/team-data/cmdb-provider, tag: 2.3.1 }
    resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { memory: 512Mi } }
