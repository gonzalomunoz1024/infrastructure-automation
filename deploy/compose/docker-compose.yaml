# What the indexer runs against on a laptop with Docker: OpenSearch (security off), Kafka in KRaft
# mode, and MongoDB. Then, from the repository root:
#   ./gradlew bootRun --args='--spring.profiles.active=mongo,kafka'
# with CONSOLE_OPENSEARCH_URL=http://localhost:9200 CONSOLE_KAFKA_BOOTSTRAP=localhost:9092
# CONSOLE_MONGO_URI=mongodb://localhost:27017 and a state service on 18082 for rebuilds.
# The same images (and versions) as CI. Not for production: no security, one node each.
name: console-search-indexer

services:
  opensearch:
    image: opensearchproject/opensearch:2.19.6
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  kafka:
    image: apache/kafka:3.9.1
    ports:
      - "9092:9092"

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
