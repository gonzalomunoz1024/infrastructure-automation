# console-web in live mode: the built app, with the same routes the Vite dev server proxies
# (console/vite.config.ts): the BFF for the session, sign-in and the console API, and the platform
# for the reads the console still makes there (/api, /actuator).
server {
  listen 3000;
  server_name localhost;
  root /usr/share/nginx/html;

  # server-sent events and long requests pass through unbuffered
  proxy_http_version 1.1;
  proxy_buffering off;
  proxy_read_timeout 1h;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Connection "";

  location /auth/ { proxy_pass http://bff:18081; }
  location /console/ { proxy_pass http://bff:18081; }
  location /api/ { proxy_pass http://platform-fake:18090; }
  location /actuator/ { proxy_pass http://platform-fake:18090; }

  location = /index.html { add_header Cache-Control "no-store"; }
  location / { try_files $uri $uri/ /index.html; }
}
