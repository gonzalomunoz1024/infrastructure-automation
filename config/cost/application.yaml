# console-cost-service in the e2e stack: profiles mongo,kafka (production), no demo.
console:
  pricing:
    # the price lists and the types' bindings from platform-fake over P-22
    source: platform
  state:
    url: http://state:18082
  identity:
    url: http://identity:18083
  platform:
    base-url: http://platform-fake:18090
    token: ${E2E_PLATFORM_INTERNAL_TOKEN}
  ingest:
    kafka:
      bootstrap-servers: kafka:9092
  auth:
    jwks-uri: http://bff:18081/.well-known/jwks.json
    token-url: http://bff:18081/internal/v1/token
    client-key: ${E2E_COST_CLIENT_KEY}
  outbox:
    kafka:
      bootstrap-servers: kafka:9092
spring:
  data:
    mongodb:
      uri: mongodb://mongo:27017
      database: console_cost
logging:
  level:
    com.iaf.console: info
