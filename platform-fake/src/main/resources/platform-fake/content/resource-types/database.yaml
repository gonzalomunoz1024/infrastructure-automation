apiVersion: iaf.platform/v1
kind: ResourceType
metadata:
  name: database
  plural: databases
  owner: team-data
  description: A managed MongoDB cluster.
schema:
  type: object
  required: [name, engine]
  properties:
    name: { type: string, examples: [orders-db, billing-db] }
    engine: { type: string, examples: [mongodb] }
    version: { type: string, examples: ["7.0", "8.0"] }
    tier: { type: string, examples: [M30, M10] }
    environment: { type: string, examples: [prod, dev] }
    secret: { type: string, description: Vault reference to the connection string, examples: ["vault:data/orders-db", "vault:data/billing-db"] }
    owner: { type: string, examples: [team-data] }
states: [building, ready, deprecated, retired]
producedBy: create-database
