apiVersion: iaf.platform/v1
kind: Provider
metadata:
  name: vault
  title: HashiCorp Vault
  owner: team-platform
  version: 1.0.0
  description: Writes generated secrets (connection strings, generated passwords) to the KV store. Reading secrets is the platform's job, never a workflow's.
spec:
  type: http
  endpoints:
    dev: https://vault-dev.example.com/v1
    prod: https://vault.example.com/v1
  auth: { type: header, header: X-Vault-Token, credential: vault:platform/vault-token }
  actions:
    - id: secret.write
      title: Write secret
      operation: { method: POST, path: "/secret/data/{path}" }
      effect: create
      retry: safe
      input:
        type: object
        required: [path, data]
        properties:
          path: { type: string }
          data: { type: object }
      example: { path: databases/orders, version: 1 }
      sample: { path: "{{ $input.path }}", version: 1 }
    - id: secret.delete
      title: Delete secret
      operation: { method: DELETE, path: "/secret/data/{path}" }
      effect: delete
      retry: safe
      approval: required
      input:
        type: object
        required: [path]
        properties:
          path: { type: string }
      example: { path: databases/orders, deleted: true }
      sample: { path: "{{ $input.path }}", deleted: true }
  errors:
    - { match: { status: 403 }, class: permission_denied, retry: false }
    - { match: { status: 404 }, class: not_found, retry: false }
    - { match: { status: 429 }, class: rate_limited, retry: true }
    - { match: { status: 503 }, class: unavailable, retry: true }
  slo: { successRate: 99.9, p95Ms: 300 }
  alerts: { channel: "#platform-alerts" }
