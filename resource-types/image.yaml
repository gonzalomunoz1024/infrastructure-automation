apiVersion: iaf.platform/v1
kind: ResourceType
metadata:
  name: image
  plural: images
  owner: team-platform
  description: A hardened VM image other workflows build VMs from.
schema:
  type: object
  required: [templateId]
  properties:
    name: { type: string }
    os: { type: string }
    hardening: { type: string }
    templateId: { type: string }
    sizeGb: { type: integer }
    scanned: { type: boolean }
states: [building, ready, deprecated, retired, failed]
producedBy: build-vm-image
