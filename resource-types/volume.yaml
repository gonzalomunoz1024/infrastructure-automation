apiVersion: iaf.platform/v1
kind: ResourceType
metadata:
  name: volume
  plural: volumes
  owner: team-platform
  description: A block volume requested through the IDP tile.
schema:
  type: object
  required: [sizeGb]
  properties:
    sizeGb: { type: integer, examples: [200, 500] }
    tier: { type: string, examples: [ssd, standard] }
    attachedTo: { type: string }
states: [building, ready, deprecated, retired]
producedBy: request-storage
