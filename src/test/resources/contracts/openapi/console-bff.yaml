              description: 'With `scope=organization`, the comma-separated accounts left out for want of `cost:export`'
              schema: { type: string }
          content:
            text/csv:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /console/v1/r/{type}/{wfrn}/cost:
    parameters:
      - $ref: '#/components/parameters/TypePath'
      - $ref: '#/components/parameters/WfrnPath'
    get:
      operationId: getResourceCost
      summary: A resource's monthly rate, month to date, and the price behind it
      description: Needs `cost:list` on the resource's wfrn.
      tags: [Cost]
      responses:
        '200':
          description: The cost
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResourceCost' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /console/v1/budgets:
    get:
      operationId: listBudgets
      summary: The account's budgets with this month's status
      description: 'Needs `budgets:list`. Each budget carries `can: { update, delete }`.'
      tags: [Budgets]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/After'
      responses:
        '200':
          description: One page
          content:
            application/json:
              schema:
                type: object
                required: [items, next]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ConsoleBudget' }
                  next: { $ref: '#/components/schemas/Cursor' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createBudget
      summary: Create a budget for the session's account, or a tag within it
      description: Needs `budgets:create`. The scope's accountId is always the session's.
      tags: [Budgets]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BudgetInput' }
      responses:
        '201':
          description: The budget
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsoleBudget' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /console/v1/budgets/{budgetId}:
    parameters:
      - name: budgetId
        in: path
