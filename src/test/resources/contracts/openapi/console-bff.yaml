        - $ref: '#/components/parameters/After'
      responses:
        '200':
          description: One page
          content:
            application/json:
              schema:
                type: object
                required: [items, next]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Approval' }
                  next: { $ref: '#/components/schemas/Cursor' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '502': { $ref: '#/components/responses/BadGateway' }
  /console/v1/approvals/{approvalId}:decide:
    parameters:
      - name: approvalId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: decideApproval
      summary: Approve or reject
      tags: [Approvals]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [approve, reject] }
                comment: { type: string, maxLength: 1000 }
      responses:
        '202':
          description: Accepted
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '502': { $ref: '#/components/responses/BadGateway' }
  /console/v1/findings:
    get:
      operationId: listFindings
      summary: The account's drift findings
      description: 'For the session''s account and region, open ones by default, from the drift service. A finding of a type the person may not list is left out. `can` lists `revert`, `accept` and `ignore` when `<service>:update` is allowed on its wfrn.'
      tags: [Drift]
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [open, closed, all], default: open }
        - name: severity
          in: query
          schema: { type: string, enum: [info, warning, critical] }
        - name: type
          in: query
          schema: { type: string }
        - name: wfrn
          in: query
          description: An exact wfrn, or a pattern
          schema: { type: string }
        - name: openedAfter
          in: query
          schema: { type: string, format: date-time }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/After'
      responses:
        '200':
          description: One page
          content:
            application/json:
              schema:
                type: object
                required: [items, next]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Finding' }
                  next: { $ref: '#/components/schemas/Cursor' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /console/v1/findings/summary:
    get:
      operationId: getFindingsSummary
      summary: Open findings counted by type and severity
      description: The account's counts; any member of the account may read them.
      tags: [Drift]
      responses:
        '200':
          description: The counts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FindingsSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /console/v1/findings/stats:
    get:
      operationId: getFindingStats
      summary: Findings opened and closed in a window
      description: 'The drift numbers of the executive home: found is `opened`, fixed is `closed.total`. Without `since`, the last 30 days; without `until`, now.'
      tags: [Drift]
      parameters:
        - name: since
          in: query
          schema: { type: string, format: date-time }
        - name: until
          in: query
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: The counts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FindingStats' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /console/v1/findings/{findingId}:
    parameters:
      - $ref: '#/components/parameters/FindingIdPath'
    get:
      operationId: getFinding
      summary: One finding
      description: Needs `<service>:get` on its wfrn.
      tags: [Drift]
      responses:
        '200':
          description: The finding
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Finding' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /console/v1/findings/{findingId}:revert:
    parameters:
      - $ref: '#/components/parameters/FindingIdPath'
    post:
      operationId: revertFinding
      summary: Put the resource back to its desired state
      description: 'Needs `<service>:update` on the wfrn. The type''s update workflow runs with the desired values of the drifted fields, on behalf of the person. The finding stays open with `revertStatus: running`, and closes as `reverted` when the job succeeded and the next read agrees; a failed job leaves it open. 409: `finding.closed`, `finding.reverting`, `finding.notRevertable`, `finding.unwatched` or `revert.needsPerson`.'
      tags: [Drift]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DriftDecision' }
      responses:
        '202':
          description: The revert job was started
          content:
            application/json:
              schema:
                type: object
                required: [findingId, jobId]
                properties:
                  findingId: { type: string }
                  jobId: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '502': { $ref: '#/components/responses/BadGateway' }
  /console/v1/findings/{findingId}:accept:
    parameters:
      - $ref: '#/components/parameters/FindingIdPath'
    post:
      operationId: acceptFinding
      summary: Make the observed values the desired ones
      description: 'Needs `<service>:update` on the wfrn. 409: `finding.closed`, or `finding.reverting` while a revert job runs.'
      tags: [Drift]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DriftDecision' }
      responses:
        '200':
          description: The finding, closed as accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Finding' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /console/v1/findings/{findingId}:ignore:
    parameters:
      - $ref: '#/components/parameters/FindingIdPath'
    post:
      operationId: ignoreFinding
      summary: Silence the drifted fields
      description: 'Needs `<service>:update` on the wfrn. Until the desired state changes, or until `until`. 409: `finding.closed`.'
      tags: [Drift]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/DriftDecision'
                - type: object
                  properties:
                    until: { type: string, format: date-time }
      responses:
        '200':
          description: The finding, closed as ignored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Finding' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /console/v1/discover:
    post:
      operationId: startDiscovery
      summary: Scan a type's provider for what the console does not manage
      description: 'Needs `<service>:observe` on the type''s pattern. One run per type and region at a time: a second answers 409.'
      tags: [Drift]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type: { type: string }
      responses:
        '202':
          description: The run
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiscoveryRun' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /console/v1/discover/{runId}:
    parameters:
      - $ref: '#/components/parameters/RunIdPath'
    get:
      operationId: getDiscovery
      summary: A discovery run's progress
      tags: [Drift]
      responses:
        '200':
          description: The run
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiscoveryRun' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /console/v1/unmanaged:
    get:
      operationId: listUnmanaged
      summary: Objects the providers have that the console does not manage
      description: 'The objects this account''s discovery runs found, and the ones another account assigned to it; every type the person may list when `type` is left out. `can` lists `import` and `assign` when `<service>:create` is allowed on the type''s pattern.'
      tags: [Drift]
      parameters:
        - name: type
          in: query
          schema: { type: string }
        - name: owner
          in: query
          description: '`mine` for the objects guessed to be or assigned to this account, `unknown` for the ones with no guess'
          schema: { type: string, enum: [any, mine, unknown], default: any }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/After'
      responses:
        '200':
          description: One page
          content:
            application/json:
              schema:
                type: object
                required: [items, next]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/UnmanagedObject' }
                  next: { $ref: '#/components/schemas/Cursor' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /console/v1/unmanaged:import:
    post:
      operationId: importUnmanaged
      summary: Take a discovered object under management
      description: Needs `<service>:create` on the type's pattern. The object gets a wfrn and leaves the unmanaged lists, this account's and the one it was assigned to or by.
      tags: [Drift]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, providerId]
              properties:
                type: { type: string }
                providerId: { type: string }
                name: { type: string }
      responses:
        '201':
          description: The resource is managed
          content:
            application/json:
              schema:
                type: object
                required: [wfrn]
                properties:
                  wfrn: { $ref: '#/components/schemas/Wfrn' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /console/v1/unmanaged:assign:
    post:
      operationId: assignUnmanaged
      summary: Hand a discovered object to another team
      description: 'Needs `<service>:create` on the type''s pattern. The object stays in this account''s list with its `assignment` and shows in the named account''s list too, until either imports it; assigning it again moves the assignment. 400 `unmanaged.unknownAccount` when no active account has that id, or it is this one.'
      tags: [Drift]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, providerId, accountId]
              properties:
                type: { type: string }
                providerId: { type: string }
                accountId: { $ref: '#/components/schemas/AccountId' }
                note: { type: string, maxLength: 500 }
      responses:
        '200':
          description: The object, with its assignment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UnmanagedObject' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /console/v1/alarms:
    get:
      operationId: listAlarms
      summary: The account's alarms
      description: Firing alarms first; an alarm on a type the person may not list is left out.
      tags: [Monitoring]
      parameters:
        - name: state
          in: query
          schema: { type: string, enum: [ok, alarm, insufficient] }
        - name: wfrn
          in: query
          schema: { $ref: '#/components/schemas/Wfrn' }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/After'
      responses:
        '200':
          description: One page
          content:
            application/json:
              schema:
                type: object
                required: [items, next]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Alarm' }
                  next: { $ref: '#/components/schemas/Cursor' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /console/v1/alarms/{alarmId}:
    parameters:
      - $ref: '#/components/parameters/AlarmIdPath'
    put:
      operationId: putAlarm
      summary: Create or change an alarm
      description: 'Needs `<service>:update` on the alarm''s wfrn. The web app picks the alarm id, so a retried create is the same alarm. Evaluated every minute: the metric''s average over `windowMinutes` against `threshold`.'
      tags: [Monitoring]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AlarmInput' }
      responses:
        '200':
          description: Changed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Alarm' }
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Alarm' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteAlarm
      summary: Delete an alarm
      description: Needs `<service>:update` on the alarm's wfrn.
      tags: [Monitoring]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /console/v1/recommendations:
    get:
      operationId: listRecommendations
      summary: Idle and oversized resources
      description: 'Open ones by default, the largest saving first; a recommendation on a type the person may not list is left out. `can` lists `apply` and `dismiss` as the person''s policies allow: `<service>:update` (resize, dismiss) or `<service>:delete` (delete) on the wfrn.'
      tags: [Rightsizing]
      parameters:
        - name: type
          in: query
          schema: { type: string }
        - name: kind
          in: query
          schema: { type: string, enum: [idle, oversized] }
        - name: status
          in: query
          schema: { type: string, enum: [open, applied, dismissed, superseded], default: open }
        - name: wfrn
          in: query
          schema: { $ref: '#/components/schemas/Wfrn' }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/After'
      responses:
        '200':
          description: One page
          content:
            application/json:
              schema:
                type: object
                required: [items, next]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Recommendation' }
                  next: { $ref: '#/components/schemas/Cursor' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /console/v1/recommendations/summary:
    get:
      operationId: getRecommendationsSummary
      summary: Open recommendations and what they would save
      tags: [Rightsizing]
      responses:
        '200':
          description: The summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecommendationsSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /console/v1/recommendations/{recommendationId}:
    parameters:
      - $ref: '#/components/parameters/RecommendationIdPath'
    get:
      operationId: getRecommendation
      summary: One recommendation
      description: Needs `<service>:get` on its wfrn.
      tags: [Rightsizing]
      responses:
        '200':
          description: The recommendation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Recommendation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /console/v1/recommendations/{recommendationId}:apply:
    parameters:
      - $ref: '#/components/parameters/RecommendationIdPath'
    post:
      operationId: applyRecommendation
      summary: Resize or delete the resource as recommended
      description: 'A resize needs `<service>:update` on the wfrn and runs the type''s update workflow with the proposed size; a delete needs `<service>:delete`, `confirm: true` (400 `confirm.required`) and a fresh sign-in (403 with `detail.stepUp`), and runs the delete workflow. Both on behalf of the person, never on their own. The recommendation is `applied` once the job is started. 409: `recommendation.closed`, `recommendation.notApplicable`, `recommendation.changing` or `revert.needsPerson`.'
      tags: [Rightsizing]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/DriftDecision'
                - type: object
                  properties:
                    confirm: { type: boolean, description: 'Required, and true, for a delete' }
      responses:
        '202':
          description: The job is started
          content:
            application/json:
              schema:
                type: object
                required: [recommendationId, jobId]
                properties:
                  recommendationId: { type: string }
                  jobId: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '502': { $ref: '#/components/responses/BadGateway' }
  /console/v1/recommendations/{recommendationId}:dismiss:
    parameters:
      - $ref: '#/components/parameters/RecommendationIdPath'
    post:
      operationId: dismissRecommendation
      summary: Set a recommendation aside
      description: 'Needs `<service>:update` on the wfrn. Without `until`, for good; with it, a later pass may open it again after that date. 409: `recommendation.closed`.'
      tags: [Rightsizing]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/DriftDecision'
                - type: object
                  properties:
                    until: { type: string, format: date-time }
      responses:
        '200':
          description: Dismissed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Recommendation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /console/v1/events:
    get:
      operationId: streamEvents
      summary: Live updates for open pages
      description: Server-sent events of the account's resources, findings and jobs, and the person's own notifications (`notification`, on every stream the person has open); `id:` is a cursor the browser sends back as `Last-Event-ID`, `event:` is the event type and `data:` the event. `wfrn` narrows the stream to one resource.
      tags: [Events]
      parameters:
        - name: wfrn
          in: query
          schema: { $ref: '#/components/schemas/Wfrn' }
        - name: types
          in: query
          description: Comma-separated event types
          schema: { type: string }
        - name: Last-Event-ID
          in: header
          schema: { type: string }
      responses:
        '200':
          description: A stream of LiveEvent
          content:
            text/event-stream:
              schema: { $ref: '#/components/schemas/LiveEvent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /console/v1/search:
    get:
      operationId: search
      summary: Search the account's resources
      tags: [Search]
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, maxLength: 256 }
        - name: type
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/After'
      responses:
        '200':
          description: One page of hits
          content:
            application/json:
              schema:
                type: object
                required: [items, next]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/SearchHit' }
                  next: { $ref: '#/components/schemas/Cursor' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /console/v1/suggest:
    get:
      operationId: suggest
      summary: Type-ahead over names, wfrns, tags and types
      tags: [Search]
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 20, default: 8 }
      responses:
        '200':
          description: Suggestions
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Suggestion' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /console/v1/iam/{collection}:
    parameters:
      - $ref: '#/components/parameters/IamCollection'
    get:
      operationId: listIam
      summary: List an IAM collection of the session's account
      description: 'Passes through to `GET /v1/accounts/{accountId}/{collection}` of the identity service; the page shape and the items are its'
      tags: [IAM]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/After'
      responses:
        '200': { $ref: '#/components/responses/IamAnswer' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createIam
      summary: Create in an IAM collection of the session's account
      description: 'Passes through to the identity service''s POST with the body unchanged; the status (201, or 200 for an access key, whose secret is answered this once) and the body are its'
      tags: [IAM]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IamBody' }
      responses:
        '200': { $ref: '#/components/responses/IamAnswer' }
        '201': { $ref: '#/components/responses/IamAnswer' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /console/v1/iam/{collection}/{id}:
    parameters:
      - $ref: '#/components/parameters/IamCollection'
      - $ref: '#/components/parameters/IamId'
    get:
      operationId: getIam
      summary: One IAM record of the session's account
      tags: [IAM]
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200': { $ref: '#/components/responses/IamAnswer' }
        '304': { description: Unchanged }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateIam
      summary: Change an IAM record
      description: 'For users, groups, roles and quotas, as the identity service''s PATCH; `If-Match` carries the version and 409 says it moved on'
      tags: [IAM]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IamBody' }
      responses:
        '200': { $ref: '#/components/responses/IamAnswer' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    put:
      operationId: replaceIam
      summary: Replace an IAM record
      description: 'For policies, as the identity service''s PUT'
      tags: [IAM]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IamBody' }
      responses:
        '200': { $ref: '#/components/responses/IamAnswer' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      operationId: deleteIam
      summary: Remove an IAM record
      tags: [IAM]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204': { description: Removed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /console/v1/iam/{collection}/{id}:{action}:
    parameters:
      - $ref: '#/components/parameters/IamCollection'
      - $ref: '#/components/parameters/IamId'
      - $ref: '#/components/parameters/IamAction'
    post:
      operationId: iamAction
      summary: An IAM record's action
      description: '`rotate` on an access key (the new secret is answered this once) and `request-increase` on a quota, as the identity service''s `:{action}` operations'
      tags: [IAM]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IamBody' }
      responses:
        '200': { $ref: '#/components/responses/IamAnswer' }
        '202': { $ref: '#/components/responses/IamAnswer' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /console/v1/access-requests:
    get:
      operationId: listAccessRequests
      summary: Access requests
      description: '`scope=mine` (the default) lists the person''s own requests; `scope=account` lists every request of the account, for its admins'
      tags: [Access requests]
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/AccessRequestStatus' }
        - name: scope
          in: query
          schema: { type: string, enum: [mine, account], default: mine }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/After'
      responses:
        '200':
          description: One page
          content:
            application/json:
              schema:
                type: object
                required: [items, next]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AccessRequest' }
                  next: { $ref: '#/components/schemas/Cursor' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createAccessRequest
      summary: Ask for an action a denial marked requestable
      description: 'Opens a request to the account''s admins; the same open request (same action, resource and role) answers 409 with the existing one'
      tags: [Access requests]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccessRequestInput' }
      responses:
        '202':
          description: The request, pending
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessRequest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: The same request is already open
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessRequest' }
  /console/v1/access-requests/{requestId}:decide:
    parameters:
      - name: requestId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: decideAccessRequest
      summary: Approve or reject an access request
      description: 'For the account''s admins; approving grants the suggested role (or the role asked for) and the requester''s next session carries it'
      tags: [Access requests]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccessDecision' }
      responses:
        '202':
          description: The request, decided
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessRequest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /.well-known/jwks.json:
    get:
      operationId: getJwks
      summary: The BFF's public keys
      description: The keys the other console services verify this service's internal tokens and X-On-Behalf-Of assertions with (RFC 7517); the current key and the previous one during a rotation, each with a `kid`
      tags: [Keys]
      security: []
      responses:
        '200':
          description: The key set
          headers:
            Cache-Control:
              schema: { type: string }
              description: 'public, max-age=300'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JsonWebKeySet' }
  /internal/v1/token:
    post:
      operationId: issueServiceToken
      summary: A service token for a console service
      description: |
        OAuth 2.0 client credentials (RFC 6749 §4.4) with a JWT client assertion (RFC 7523 §2.2).
        The assertion is either the caller's projected Kubernetes service-account token, audience
        `console-bff`, issued by the cluster the BFF trusts to a service account registered for a
        client; or a JWT the client signs with a key registered for it: `iss` and `sub` the client
        id, `aud` containing `console-bff`, `iat`, `exp` at most 5 minutes after `iat`, and a `jti`
        never used before. Asymmetric algorithms only (ES256, ES384, RS256, PS256).

        The answer is an internal JWT of the BFF (ES256, its JWKS): `iss` `console-bff`, `aud` the
        one service asked for (registered for the client; decision 35), `sub` and `svc` the client
        id, `iat`, `exp`, `jti`, and no `acct`. A service accepts it only when it lists the client
        as a service principal allowed to call it. Errors are RFC 6749 §5.2 bodies. Not routed by
        the ingress: in-cluster callers only.
      tags: [Service tokens]
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: { $ref: '#/components/schemas/ServiceTokenRequest' }
      responses:
        '200':
          description: The token
          headers:
            Cache-Control:
              schema: { type: string }
              description: no-store
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceToken' }
        '400':
          description: '`invalid_request` (a field is missing or malformed), `unsupported_grant_type`, `invalid_target` (no audience, more than one, or one the client is not registered for)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }
        '401':
          description: '`invalid_client`: the assertion does not verify, has expired or was used before, or names no registered client'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }
  /console/v1/preferences:
    get:
      operationId: getPreferences
      summary: The user's preferences
      tags: [Preferences]
      responses:
        '200':
          description: The preferences
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Preferences' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      operationId: putPreferences
      summary: Replace the user's preferences
      tags: [Preferences]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Preferences' }
      responses:
        '200':
          description: The preferences
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Preferences' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /console/v1/insights:
    get:
      operationId: getInsights
      summary: The executive home's numbers for the person's estate
      description: |
        What the console has done for the accounts the person may read insights in (`insights:get`
        on each; `scope=account` narrows it to the session's account): resources managed now and at
        the start of the period, requests and how many were self-served, the lead time from request
        to running against the baseline of today's tickets and the hours that saved, drift found and
        fixed, and adoption week by week. The BFF computes them from the state service's records and
        the platform's jobs. The ticket baseline is configuration (`console.insights.baseline`), a
        one-off export of the current ticket queue; without one, `leadTime` has no baseline and
        `hoursSaved` is absent. Spend is not here: the executive home reads it from
        `GET /console/v1/cost?scope=organization&groupBy=costCentre` (the cost service's contract).
      tags: [Insights]
      parameters:
        - name: period
          in: query
          schema: { type: string, enum: [7d, 30d, 90d], default: 30d }
        - name: scope
          in: query
          schema: { type: string, enum: [account, organization], default: organization }
      responses:
        '200':
          description: The numbers
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Insights' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '502': { $ref: '#/components/responses/BadGateway' }
  /console/v1/search:interpret:
    get:
      operationId: interpretSearch
      summary: Plain English read as the list's own filter
      description: |
        Passes through to the search indexer's `GET /v1/search:interpret` for the session's account
        (`contracts/openapi/console-search-indexer.yaml` 1.2.0) with its answer unchanged. The
        filter uses the list's own names, so the console turns it into a list link (its `f` and
        `sort` query); nothing runs. Given `type`, the reading stays within that type, and another
        type named in the text goes to `unparsed`.
      tags: [Search]
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 500 }
        - name: type
          in: query
          schema: { type: string }
      responses:
        '200':
          description: The reading
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchInterpretation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '502': { $ref: '#/components/responses/BadGateway' }
  /console/v1/search:counts:
    get:
      operationId: countResourcesBy
      summary: Resources counted by one grouping, in the account or across the person's accounts
      description: |
        Passes through to the search indexer's `GET /v1/counts` with `groupBy` and the same filters
        as search (`contracts/openapi/console-search-indexer.yaml` 1.2.0). With
        `scope=organization` the BFF resolves the accounts the person may list in and calls as the
        console-internal principal with `accountId` repeated (at most 200), so a person's own token
        never names another account. The BFF adds `asOf`, the indexer's `lastEventAt` from
        `/v1/index/status`. At most 100 groups, largest first.
      tags: [Search]
      parameters:
        - name: groupBy
          in: query
          required: true
          schema: { type: string, pattern: '^(type|service|state|region|account|tag:[A-Za-z0-9._:/-]{1,128})$' }
        - name: scope
          in: query
          schema: { type: string, enum: [account, organization], default: account }
        - name: q
          in: query
          schema: { type: string, maxLength: 500 }
        - name: type
          in: query
          schema: { type: string }
        - name: state
          in: query
          schema: { $ref: '#/components/schemas/ResourceState' }
        - name: drift
          in: query
          schema: { type: boolean }
      responses:
        '200':
          description: The groups
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupedCounts' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '502': { $ref: '#/components/responses/BadGateway' }
  /console/v1/assistant/turns:
    post:
      operationId: askAssistant
      summary: Ask the copilot, or ask it to explain a resource
      description: |
        Starts a turn of a conversation with the console copilot, which sits behind the BFF's
        `AssistantPort` (the firm's Devin API first; a faster model later is another adapter on the
        same port, not a redesign). A turn takes seconds to minutes, so the answer is read from the
        conversation, `GET /console/v1/assistant/conversations/{conversationId}`, which the console
        polls while the turn is `thinking`.

        The copilot reads only what the person may read, with the person's own session, and never
        acts. It answers in words and in proposals: a filtered list, a pre-filled create wizard, a
        pre-filled action, or a page. The console opens a proposal for the person to review, and
        every change still goes through its preview and IAM. `intent: explain` explains
        `context.wfrn`: what it is, its configuration, cost, history and dependents. A person's
        turns are limited to 10 a minute (429 with `Retry-After`); conversations are the person's
        own and kept for 24 hours.
      tags: [Assistant]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssistantAsk' }
      responses:
        '202':
          description: The turn is under way
          content:
            application/json:
              schema:
                type: object
                required: [conversationId, turnId]
                properties:
                  conversationId: { type: string }
                  turnId: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '502': { $ref: '#/components/responses/BadGateway' }
  /console/v1/assistant/conversations/{conversationId}:
    parameters:
      - name: conversationId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getAssistantConversation
      summary: A conversation with the copilot, its answers and proposals
      description: Another person's conversation, or one older than 24 hours, answers 404.
      tags: [Assistant]
      responses:
        '200':
          description: The conversation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssistantConversation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /console/v1/jobs/{jobId}/explanation:
    parameters:
      - $ref: '#/components/parameters/JobIdPath'
    get:
      operationId: explainJobFailure
      summary: Why a job failed, and the fix to try
      description: |
        For a job that failed, or that waits on a failed step (`needs-attention`): the cause in plain
        words, the failing step, a suggested fix, whether the person may retry, and how often the
        same failure happened in the account in the last 30 days. Rules over the platform's error
        classes answer first (`source: rules`); the copilot answers what they cannot
        (`source: assistant`). A fix may carry `input`, a merge over the job's input; the console
        shows it to the person and sends it, with `fromStep`, as the body of
        `POST /console/v1/jobs/{jobId}:retry`, the phase 4 retry, which reruns the job with the input
        merged over the original (the platform's `:rerun`), so secrets never travel back. Asking for
        an explanation retries nothing. Any other job answers 409 `job.not-failed`.
      tags: [Jobs]
      responses:
        '200':
          description: The explanation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobExplanation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '502': { $ref: '#/components/responses/BadGateway' }
  /console/v1/cost:
    get:
      operationId: getCost
      summary: The Cost Explorer's query, for the session's account or the organization
      description: >-
        The cost service's `getCost` (contracts/openapi/console-cost-service.yaml) with the same
        parameters and answer. `scope=account` (the default) reads the session's account and needs
        `cost:list` there; `scope=organization` reads every account of the session's memberships on
        which `cost:list` is allowed and leaves out the others, naming them in `skippedAccounts`
        (the executive home's spend by team is `scope=organization&groupBy=costCentre`).
      tags: [Cost]
      parameters:
        - name: scope
          in: query
          schema: { type: string, enum: [account, organization], default: account }
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - { name: granularity, in: query, schema: { type: string, enum: [day, month], default: day } }
        - name: groupBy
          in: query
          schema: { type: string, pattern: '^(service|type|account|region|costCentre|tag:[a-z0-9-]{1,32})$' }
        - { name: top, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 10 } }
        - { name: service, in: query, schema: { type: string } }
        - { name: type, in: query, schema: { type: string } }
        - { name: region, in: query, schema: { $ref: '#/components/schemas/RegionName' } }
        - name: tag.<key>
          in: query
          schema: { type: string }
          x-name-pattern: '^tag\.[a-z0-9-]{1,32}$'
        - { name: wfrn, in: query, schema: { $ref: '#/components/schemas/Wfrn' } }
      responses:
        '200':
          description: The report
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CostReport'
                  - type: object
                    properties:
                      skippedAccounts:
                        type: array
                        description: 'scope=organization: memberships left out because cost:list is denied there'
                        items: { $ref: '#/components/schemas/AccountId' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '502': { $ref: '#/components/responses/BadGateway' }
  /console/v1/cost/price-lists:
    get:
      operationId: listPriceLists
      summary: The price lists in force and which types they price ("How is this priced?")
      tags: [Cost]
      responses:
        '200':
          description: The cost service's answer, unchanged
          content:
            application/json:
              schema:
                type: object
                required: [items, next, bindings]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/PriceList' }
                  next: { $ref: '#/components/schemas/Cursor' }
                  bindings:
                    type: array
                    items: { $ref: '#/components/schemas/PriceBinding' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /console/v1/cost/chargeback:
    get:
      operationId: getChargeback
      summary: A month's chargeback by cost centre, account, service and tag
      description: Needs `cost:list`; `scope` works as on `/console/v1/cost`.
      tags: [Cost]
      parameters:
        - { name: scope, in: query, schema: { type: string, enum: [account, organization], default: account } }
        - { name: month, in: query, required: true, schema: { type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$' } }
        - { name: tag, in: query, schema: { type: string, pattern: '^[a-z0-9-]{1,32}$' } }
      responses:
        '200':
          description: The report
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChargebackReport' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /console/v1/cost/chargeback.csv:
    get:
      operationId: exportChargeback
      summary: The chargeback as CSV, as finance receives it
      description: Needs `cost:export` on every account it covers.
      tags: [Cost]
      parameters:
        - { name: scope, in: query, schema: { type: string, enum: [account, organization], default: account } }
        - { name: month, in: query, required: true, schema: { type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$' } }
        - { name: tag, in: query, schema: { type: string, pattern: '^[a-z0-9-]{1,32}$' } }
      responses:
        '200':
          description: The CSV
          headers:
            Content-Disposition: { schema: { type: string } }
            X-Content-Sha256: { schema: { type: string } }
