    get:
      operationId: getBudget
      summary: A budget with this month's status
      tags: [Budgets]
      responses:
        '200':
          description: The budget
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsoleBudget' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: updateBudget
      summary: Change a budget's name, amount, thresholds or create block
      description: Needs `budgets:update` and `If-Match`.
      tags: [Budgets]
      parameters:
