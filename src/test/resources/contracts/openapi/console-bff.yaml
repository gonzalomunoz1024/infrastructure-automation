            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Alarm' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /console/v1/r/{type}/{wfrn}/tags:
    parameters:
      - $ref: '#/components/parameters/TypePath'
      - $ref: '#/components/parameters/WfrnPath'
    put:
      operationId: setResourceTags
      summary: Replace a resource's tags
      tags: [Commands]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: { type: string, maxLength: 256 }
      responses:
        '200':
          description: The tags as they now stand
          content:
            application/json:
              schema:
                type: object
                additionalProperties: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /console/v1/scorecards:
    get:
      operationId: getScorecard
      summary: The session account's compliance scorecard
      description: 'The score (0 to 100, null while nothing is scored), by pack, rule and severity, with the daily trend. A score is `100 × Σ weight × passed ÷ Σ weight × (passed + failed)` with critical 10, warning 3, info 1. Needs `scorecards:list`.'
      tags: [Scorecards]
      parameters:
        - name: days
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 400, default: 30 }
      responses:
        '200':
          description: The scorecard
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Scorecard' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /console/v1/scorecards/packs:
    get:
      operationId: listRulePacks
      summary: The rule packs, their rules and their one-click fixes
      tags: [Scorecards]
      responses:
        '200':
          description: The packs
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/RulePackSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /console/v1/scorecards/heatmap:
    get:
      operationId: getScorecardHeatmap
      summary: The organization's heat map
      description: One row per account of the person's memberships where `scorecards:list` is allowed, with the score by pack; the accounts the person may not see are left out, never shown empty.
      tags: [Scorecards]
      responses:
        '200':
          description: The heat map, with each account's name
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScorecardHeatmap' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /console/v1/scorecards/packs/{pack}/rules/{ruleId}/failing:
    parameters:
      - $ref: '#/components/parameters/PackName'
      - $ref: '#/components/parameters/RuleId'
    get:
      operationId: listFailingResources
      summary: The session account's resources that fail a rule, longest failing first
      tags: [Scorecards]
      parameters:
        - name: type
          in: query
          required: false
          schema: { type: string }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/After'
      responses:
        '200':
          description: One page
          content:
            application/json:
              schema:
                type: object
                required: [items, next]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Evaluation' }
                  next: { $ref: '#/components/schemas/Cursor' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /console/v1/scorecards/packs/{pack}/rules/{ruleId}:remediate:
    parameters:
      - $ref: '#/components/parameters/PackName'
      - $ref: '#/components/parameters/RuleId'
    post:
      operationId: remediateEvaluation
      summary: Start a rule's one-click fix for a failing resource
      description: |
        Needs `scorecards:remediate` on the resource's wfrn and the fix's own action: the
        workflow's `<service>:<verb>` (with its step-up rule), or `<service>:tag` for a tags fix.
        The BFF relays the person's `X-On-Behalf-Of` to the drift service; a workflow fix answers
        202 with the job (it shows on the Requests page like any other), a tags fix 200 with the
        tags. Never automatic.
      tags: [Scorecards, Commands]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RemediateRequest' }
      responses:
        '200':
          description: The tags were set
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Remediation' }
        '202':
          description: The workflow was started
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Remediation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`evaluation.passing`, `remediation.none`, `remediation.unavailable` or `resource.inFlight`, from the drift service'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /console/v1/jobs:
