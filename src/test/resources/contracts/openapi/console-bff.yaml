      tags: [Resources]
      responses:
        '200':
          description: The graph, within the account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Lineage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /console/v1/r/{type}/{wfrn}/metrics:
    parameters:
      - $ref: '#/components/parameters/TypePath'
      - $ref: '#/components/parameters/WfrnPath'
    get:
      operationId: getResourceMetrics
      summary: A resource's metric series, for its Monitoring tab
      description: 'Through the drift service, from the provider''s metrics read (P-09). Needs `<service>:observe` on the wfrn. Without `from`, the last 24 hours; without `step`, 5 minutes for a day or less, else an hour. 404 `metrics.notSupported` when the type has no metrics read (its descriptor''s `observe.metrics` is false); 429 over the provider''s observe budget.'
      tags: [Monitoring]
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - name: step
          in: query
          description: An ISO-8601 duration, at least PT1M
          schema: { type: string }
      responses:
        '200':
          description: The series
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResourceMetrics' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '502': { $ref: '#/components/responses/BadGateway' }
  /console/v1/r/{type}/{wfrn}/alarms:
    parameters:
      - $ref: '#/components/parameters/TypePath'
      - $ref: '#/components/parameters/WfrnPath'
    get:
