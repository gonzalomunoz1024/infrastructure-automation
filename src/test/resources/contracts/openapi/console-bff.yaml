openapi: 3.1.0
x-status: draft
info:
  title: console-bff
  version: 1.0.0
  summary: The API the console's web app talks to, one call per screen, signed in with a session cookie.
  description: |
    Phase 0 draft: the names, the paths and the rules below are agreed; field lists will grow.

    **Session and account scope.** The web app signs in through `/auth/login` and holds a session
    cookie (`console_session`, HttpOnly, SameSite=Lax); every `/console/v1/*` call carries it and
    the `X-Csrf-Token` header the session answers. The session names the current account and
    region; every call is scoped to them. A resource of another account answers 404, never 403.
    Switching accounts is `PUT /console/v1/session`.

    **How a call reaches the platform.** The BFF holds, per console account, the account's
    platform service account (P-03) and signs an `X-On-Behalf-Of` assertion for the session's user
    (P-02); a command mints a wfrn at the state service first, then starts the platform job with
    `X-Resource-Wfrn`, `X-Console-Request-Id` and `X-Job-Label-*` (P-04). The platform's job id and
    the console request id come back on every command.

    **Paging.** Lists answer `{ items, next }`; `next` is an opaque cursor, null on the last page,
    sent back as `after`. `limit` is 1 to 200, 50 by default.

    **Errors.** `{ error, problems?, denied?, detail?, correlationId? }`: 400 bad input (`problems`
    carry the platform's `Problem` rows, with the field as a JSON pointer, so the form can mark
    them), 401 no session, 403 the account's policies deny it (the only place the console answers
    403: within the user's own account), 404 unknown or another account's, 409 a conflict, 429 over
    a quota (with `Retry-After`), 502 the platform answered an error (with its `correlationId`).

    **Every 403 but a missing CSRF token carries `denied`**, a `Denial`: which layer decided
    (`console-iam`, the account's roles and policies, or `platform`, the platform's own scopes),
    the `<service>:<verb>` action and the wfrn or pattern checked, the reason, the role, policy and
    statement (console IAM) or scope (platform) behind it, whether the person may request access
    and which role would grant it. A step-up refusal (a fresh sign-in is needed for the action) is
    a 403 with `detail: { stepUp: true, action, login }`, `login` being the `/auth/login` URL to
    send the person to. The same `Denial` greys an action in the descriptors
    (`ConsoleAction.allowed` and `denied`), decided per session with `<service>:<verb>` on
    `wfrn:<partition>:<service>:<region>:<account>:<type>/*`.

    **IAM in the console.** `/console/v1/iam/{users,groups,roles,policies,access-keys,quotas}` and
    their sub-paths pass through to the identity service's `/v1/accounts/{accountId}/…` for the
    session's account, with the identity service's schemas unchanged
    (`contracts/openapi/console-identity-service.yaml`): `If-Match`, `If-None-Match`,
    `Idempotency-Key` and `Content-Type` are forwarded, the status, `ETag` and body come back as
    they were, and a 403 without a `denied` block gets one. Writes need `X-Csrf-Token` like every
    other write. Access requests (`/console/v1/access-requests`) let a person ask for an action a
    denial marked `requestable`; an account admin decides them.

    **Drift, monitoring and rightsizing.** `/console/v1/findings`, `/console/v1/discover`,
    `/console/v1/unmanaged`, `/console/v1/alarms`, `/console/v1/recommendations` and a resource's
    `/metrics` and `/alarms` go to the drift service (`contracts/openapi/console-drift-service.yaml`)
    for the session's account and region, with the person's internal JWT. A list leaves out the rows
    of types the person may not list (`<service>:list` on the type's pattern), so a page can hold
    fewer rows than `limit` while `next` goes on. Reading a finding, an alarm or a recommendation
    needs `<service>:get` on its wfrn; deciding a finding, dismissing a recommendation and changing
    an alarm need `<service>:update`; a resource's metrics and a discovery run need
    `<service>:observe`; importing or assigning an unmanaged object needs `<service>:create` on the
    type's pattern. `can` on each row lists what the person may do. A revert and an apply run the
    type's workflow on behalf of the person (the BFF sends its `X-On-Behalf-Of`), and never on
    their own; applying a delete needs `confirm: true` and a fresh sign-in, like a destructive verb.

    **Keys.** `GET /.well-known/jwks.json` publishes the public keys the other console services
    verify this service's internal tokens and `X-On-Behalf-Of` assertions with.

    **Service tokens.** The BFF is the only issuer of internal JWTs. A console service that calls
    another on its own (the search indexer reading the state service and the accounts) gets a
    token at `POST /internal/v1/token`: OAuth 2.0 client credentials authenticated by a JWT client
    assertion (RFC 7523), either the pod's projected Kubernetes service-account token (audience
    `console-bff`) or a JWT the service signs with its own registered EC key. The token lives 5
    minutes, names exactly one audience, the service asked for (a client calling two services
    holds two tokens), and carries `sub` and `svc` the service id and no `acct`. The path is
    in-cluster only; the ingress never routes `/internal`.

    **Audiences (decision 35).** Every internal JWT the BFF mints names exactly one audience, the
    service it is for; the shared `console` audience is retired. Every console service rejects a
    token whose `aud` is not exactly its own service id, and accepts a token without `acct` only
    from a service principal it lists as allowed to call it as itself.

    **wfrns in URLs.** `/console/v1/r/{type}/{wfrn}` takes the wfrn percent-encoded; the type is
    repeated in the path so the same template never serves two shapes, and the BFF answers 404 when
    the wfrn's type segment is not `{type}`.

    **Verbs.** A resource's actions are the catalog's verbs for its type (P-08): `create` is
    `POST /console/v1/r/{type}`, `update` is `PATCH /console/v1/r/{type}/{wfrn}`, every other verb,
    `delete` included, is `POST /console/v1/r/{type}/{wfrn}:{verb}`. Each has `:preview`, and a
    verb with `bulk` has `POST /console/v1/r/{type}:batch`.

    **Beyond the AWS console (phase 9).** The executive home reads `GET /console/v1/insights` (the
    BFF's own numbers) and spend from the cost service; the copilot asks
    `POST /console/v1/assistant/turns` and reads the answer from its conversation, and its plain
    English becomes the list's own filter through `GET /console/v1/search:interpret`; grouped
    counts across the person's accounts come from `GET /console/v1/search:counts`; a failed job
    explains itself at `GET /console/v1/jobs/{jobId}/explanation`, whose fix the console sends to
    the phase 4 retry. The copilot never acts: it fills lists, forms and drawers for the person to
    review, and every change still goes through its preview and IAM.

    **API clients (decision 31).** The CLI and the SDKs sign in with OAuth 2.0's device grant
    (RFC 8628) at `POST /auth/device` and `POST /auth/token`: the person approves the code in a
    signed-in browser (`/console/v1/device-grants/{userCode}:approve`, a fresh sign-in needed), and
    the client calls `/console/v1/*` with `Authorization: Bearer` and a 15-minute access token
    (`typ: at+jwt`, `aud: console-api`) it refreshes with a rotating refresh token, within a
    12-hour API session the person can see and revoke (`/console/v1/api-sessions`). A bearer call
    reads no cookie and sends no CSRF token; it names its account and region with
    `X-Console-Account` and `X-Console-Region` (one of the person's memberships, else 403
    `account.not-member`), else the API session's own; a call with both a bearer token and the
    session cookie is a 400 `auth.ambiguous`, and an expired, revoked or foreign token is a 401
    with `WWW-Authenticate: Bearer error="invalid_token"`. Signing in, switching the session and
    deciding device grants or chat links are browser-only (403 `browser.only`). A bearer call's
    step-up time is the approving sign-in. The console shell is a page of the web app that runs the
    CLI's command core with the page's own session. ChatOps (`/chatops/slack/*`,
    `/chatops/teams/messages`) acts as the person a chat identity is linked to
    (`/console/v1/chat-links`), through the same IAM, and never satisfies a step-up.

    **Notifications (decision 32).** Jobs that end or pause, approvals, access requests, drift
    findings, quotas near their limit, budget alerts and the weekly digest notify the people they
    concern, in the console (`/console/v1/notifications` and `notification` events on the live
    stream) and by email, Slack or Teams as each person's settings say
    (`/console/v1/notification-settings`); each is delivered once per event, person and channel.
    The console home reads the account's recent visits (`/console/v1/recent`) and favourite
    resources (`/console/v1/favourites`; favourite services stay `Preferences.pinnedTypes`), and
    every Monday the BFF writes each account's digest of the week before (`/console/v1/digests`).
  contact:
    name: Customer console hub (console-root)
servers:
  - url: /
tags:
  - name: Auth
  - name: Session
  - name: Types
  - name: Resources
  - name: Drift
    description: Findings, their decisions, and the shadow-infrastructure finder, through the drift service
  - name: Monitoring
    description: A resource's metrics and alarms, through the drift service
  - name: Rightsizing
    description: Idle and oversized resources, through the drift service
  - name: Commands
  - name: Jobs
  - name: Approvals
  - name: Events
  - name: Search
  - name: Preferences
  - name: Cost
    description: The cost service for the session's account or the organization (decision 25)
  - name: Budgets
  - name: Scorecards
    description: 'Compliance scorecards (WP 9.6), from the drift service: IAM actions `scorecards:list` and `scorecards:remediate`'
  - name: Insights
    description: The executive home's numbers (phase 9)
  - name: Assistant
    description: The console copilot, behind the BFF's AssistantPort (phase 9)
  - name: IAM
    description: The identity service for the session's account, passed through
  - name: Access requests
  - name: Keys
  - name: Service tokens
    description: Tokens for console services calling each other on their own (in-cluster only)
  - name: Device sign-in
    description: The CLI and the SDKs signing in with the device grant (decision 31)
  - name: API sessions
    description: The person's CLI and SDK sign-ins (decision 31)
  - name: ChatOps
    description: Slack and Teams acting as a linked person (decision 31)
  - name: Notifications
    description: The feed and where each kind goes (decision 32)
  - name: Recent and favourites
    description: The console home's recent visits and favourite resources (decision 32)
  - name: Digests
    description: Each account's weekly digest (decision 32)
  - name: Organization
    description: The organization admins' pages, every account and the guardrails (decision 34)
  - name: Activity
    description: The account's activity trail, its seals and its evidence (decision 29)
  - name: Health
security:
  - session: []
  - bearer: []
paths:
  /actuator/health:
    get:
      operationId: health
      summary: Liveness and readiness
      tags: [Health]
      security: []
      responses:
        '200':
          description: Up
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '503':
          description: Down
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
  /auth/login:
    get:
      operationId: login
      summary: Start the sign-in
      description: Redirects to the identity provider (OIDC, authorization code with PKCE); `returnTo` must be a console path. `login_hint` goes to the provider as is (the demo provider then skips its picker); `stepUp=true` asks for a fresh authentication (`prompt=login`, `max_age=0`) and marks the session stepped up for the actions that need it.
      tags: [Auth]
      security: []
      parameters:
        - name: returnTo
          in: query
          schema: { type: string, pattern: '^/' }
        - name: login_hint
          in: query
          schema: { type: string }
        - name: stepUp
          in: query
          schema: { type: boolean, default: false }
      responses:
        '302':
          description: To the identity provider
          headers:
            Location:
              schema: { type: string }
  /auth/callback:
    get:
      operationId: loginCallback
      summary: The identity provider's answer
      description: Exchanges the code, resolves the user at the identity service, opens the session and redirects to `returnTo`.
      tags: [Auth]
      security: []
      parameters:
        - name: code
          in: query
          required: true
          schema: { type: string }
        - name: state
          in: query
          required: true
          schema: { type: string }
      responses:
        '302':
          description: To the console, with the session cookie set
          headers:
            Location:
              schema: { type: string }
            Set-Cookie:
              schema: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403':
          description: The user belongs to no console account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /auth/logout:
    post:
      operationId: logout
      summary: End the session
      tags: [Auth]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: The session is gone and the cookie cleared
          headers:
            Set-Cookie:
              schema: { type: string }
  /console/v1/session:
    get:
      operationId: getSession
      summary: Who is signed in, in which account and region
      tags: [Session]
      responses:
        '200':
          description: The session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      operationId: switchSession
      summary: Switch the account or the region
      description: 'Browser sessions only (403 `browser.only` with a bearer token, which names its account and region per call instead).'
      tags: [Session]
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                accountId: { $ref: '#/components/schemas/AccountId' }
                region: { $ref: '#/components/schemas/RegionName' }
      responses:
        '200':
          description: The session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /console/v1/accounts:
    get:
      operationId: listAccounts
      summary: The accounts the user may switch to
      tags: [Session]
      responses:
        '200':
          description: The accounts
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AccountSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /console/v1/regions:
    get:
      operationId: listRegions
      summary: The regions, with what each offers
      description: The platform's regions (P-07) with their availability, cached and refreshed on `region.changed`.
      tags: [Session]
      responses:
        '200':
          description: The regions
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Region' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /console/v1/types:
    get:
      operationId: listTypes
      summary: The resource types the console shows
      description: One `ConsoleType` per visible type of the current region, grouped by service, built from the platform's resource types, the catalog and the hub's overlays; answers an `ETag` and honours `If-None-Match`.
      tags: [Types]
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: The types
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ConsoleType' }
        '304':
          description: Not modified
        '401': { $ref: '#/components/responses/Unauthorized' }
  /console/v1/types/{key}:
    parameters:
      - name: key
        in: path
        required: true
        description: '`<service>/<type>`, percent-encoded (`compute%2Fvm`)'
        schema: { type: string }
    get:
      operationId: getType
      summary: One type's descriptor
      tags: [Types]
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: The descriptor
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsoleType' }
        '304':
          description: Not modified
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /console/v1/r/{type}:
    parameters:
      - $ref: '#/components/parameters/TypePath'
    get:
      operationId: listResources
      summary: List resources of a type
      description: The account's resources of the type in the current region, from the state service, with the search index for `q`.
      tags: [Resources]
      parameters:
        - name: q
          in: query
          description: Free text over name, wfrn, tags and searchable fields
          schema: { type: string }
        - name: state
          in: query
          schema: { $ref: '#/components/schemas/ResourceState' }
        - name: tag.<name>
          in: query
          schema: { type: string }
          x-name-pattern: '^tag\.[a-z0-9-]{1,32}$'
        - name: drift
          in: query
          schema: { type: boolean }
        - name: sort
          in: query
          description: 'A column, `-` for descending, for example `-created`'
          schema: { type: string }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/After'
      responses:
        '200':
          description: One page
          content:
            application/json:
              schema:
                type: object
                required: [items, next]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ConsoleResource' }
                  next: { $ref: '#/components/schemas/Cursor' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createResource
      summary: Create a resource
      description: >-
        Mints the wfrn, then starts the type's create workflow with the delegation and the context.
        The resource shows at once in `pending`. A budget of the account with `blockCreates` that is
        over refuses the create with 409 `budget.exceeded`, naming the budgets in `detail.budgets`
        (the same rule the preview shows); when the cost service cannot answer within 2 seconds the
        create goes ahead (decision 25).
      tags: [Commands]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommandInput' }
      responses:
        '202': { $ref: '#/components/responses/CommandAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '502': { $ref: '#/components/responses/BadGateway' }
  /console/v1/r/{type}:preview:
    parameters:
      - $ref: '#/components/parameters/TypePath'
    post:
      operationId: previewCreate
      summary: Preview a create
      tags: [Commands]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommandInput' }
      responses:
        '200': { $ref: '#/components/responses/Preview' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/BadGateway' }
  /console/v1/r/{type}:batch:
    parameters:
      - $ref: '#/components/parameters/TypePath'
    post:
      operationId: batchCommand
      summary: Run a verb on many resources
      description: One platform batch (P-04's `contexts` carry each row's wfrn); for `create`, each row is minted first.
      tags: [Commands]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BatchInput' }
      responses:
        '202':
          description: The batch was accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BatchAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '502': { $ref: '#/components/responses/BadGateway' }
  /console/v1/r/{type}/{wfrn}:
    parameters:
      - $ref: '#/components/parameters/TypePath'
      - $ref: '#/components/parameters/WfrnPath'
    get:
      operationId: getResource
      summary: A resource's detail page
      description: The resource, its observed truth, its open finding, its last jobs, its neighbours and what the user may do with it, in one answer.
      tags: [Resources]
      parameters:
        - name: at
          in: query
          description: 'Decision 29 (WP 9.8): the resource as it was then, from the state service''s `?at=`; read only, so `can` is empty'
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: The detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsoleResourceDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410':
          description: Deleted; the tombstone says when
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    patch:
      operationId: updateResource
      summary: Update a resource
      description: 'The type''s `update` verb (P-08): only `mutableFields` may be sent; the state service records `UpdateRequested` and the job is started with the context.'
      tags: [Commands]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommandInput' }
      responses:
        '202': { $ref: '#/components/responses/CommandAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '502': { $ref: '#/components/responses/BadGateway' }
  /console/v1/r/{type}/{wfrn}:{verb}:
    parameters:
      - $ref: '#/components/parameters/TypePath'
      - $ref: '#/components/parameters/WfrnPath'
      - $ref: '#/components/parameters/VerbPath'
    post:
      operationId: runVerb
      summary: Run a verb on a resource
      description: 'Any verb of the type''s catalog but `create` and `update`: `delete`, `restart`, `upgrade` and so on. A destructive verb needs `confirm: true` in the body.'
      tags: [Commands]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommandInput' }
      responses:
        '202': { $ref: '#/components/responses/CommandAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '502': { $ref: '#/components/responses/BadGateway' }
  /console/v1/r/{type}/{wfrn}:{verb}:preview:
    parameters:
      - $ref: '#/components/parameters/TypePath'
      - $ref: '#/components/parameters/WfrnPath'
      - $ref: '#/components/parameters/VerbPath'
    post:
      operationId: previewVerb
      summary: Preview a verb on a resource
      description: '`update` included: `POST .../{wfrn}:update:preview` previews a PATCH.'
      tags: [Commands]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
