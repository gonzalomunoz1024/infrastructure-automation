        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BudgetInput' }
      responses:
        '200':
          description: The budget
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsoleBudget' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      operationId: deleteBudget
      summary: Delete a budget
      description: Needs `budgets:delete`.
      tags: [Budgets]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: Deleted
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /console/v1/budgets/{budgetId}/periods:
    parameters:
      - name: budgetId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: listBudgetPeriods
      summary: How a budget did month by month, newest first
      tags: [Budgets]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/After'
      responses:
        '200':
          description: One page
          content:
            application/json:
              schema:
                type: object
                required: [items, next]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/BudgetStatus' }
                  next: { $ref: '#/components/schemas/Cursor' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /auth/device:
    post:
      operationId: startDeviceAuthorization
      summary: Start signing the CLI or an SDK in (RFC 8628)
      description: |
        The device authorization request of OAuth 2.0's device grant (RFC 8628 §3.1). The CLI shows
        `user_code` and `verification_uri` (the web app's `#/device` page) and polls
        `POST /auth/token` every `interval` seconds until the person approves or denies it in a
        signed-in browser. `user_code` is eight letters from `BCDFGHJKLMNPQRSTVWXZ` written
        `XXXX-XXXX`; only a SHA-256 of `device_code` is kept. At most ten grants a minute from one
        address (429 `slow_down`).
      tags: [Device sign-in]
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [client_id]
              properties:
                client_id: { type: string, enum: [console-cli, console-sdk] }
      responses:
        '200':
          description: The codes
          headers:
            Cache-Control:
              schema: { type: string }
              description: no-store
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceAuthorization' }
        '400':
          description: '`invalid_client`: an unknown client_id'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }
        '429':
          description: '`slow_down`: too many grants from one address'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }
  /auth/token:
    post:
      operationId: issueApiToken
      summary: Redeem an approved device grant, or refresh
      description: |
        The token request of the device grant (RFC 8628 §3.4) and the refresh grant (RFC 6749 §6).
        While the person has not decided, the answer is 400 `authorization_pending`; polling sooner
        than the grant's `interval` is `slow_down` and adds 5 seconds to it; a denied grant is
        `access_denied`, an expired one `expired_token`, and a device code is redeemed once
        (`invalid_grant` after). An approved grant opens an API session and answers a 15-minute
        access token with a refresh token.

        **Refresh tokens rotate**: each refresh answers a new one and ends the old one; a rotated
        refresh token presented again revokes the whole API session (`invalid_grant`). A refresh
        reads the person's memberships from the identity service again, as a sign-in does. An API
        session lasts 12 hours from its approval and ends after 8 hours with no refresh.

        **The access token** is a JWT the BFF signs with its own key (its JWKS), header
        `typ: at+jwt` (RFC 9068): `iss` the BFF, `aud` `console-api`, `sub` the person, `sid` the
        API session, `client_id`, `auth_time` (the browser sign-in that approved the grant),
        `iat`, `exp`, `jti`. No other console service accepts it, and the BFF accepts no internal
        token in its place.
      tags: [Device sign-in]
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: { $ref: '#/components/schemas/ApiTokenRequest' }
      responses:
        '200':
          description: The tokens
          headers:
            Cache-Control:
              schema: { type: string }
              description: no-store
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiToken' }
        '400':
          description: '`invalid_request`, `unsupported_grant_type`, `authorization_pending`, `slow_down`, `access_denied`, `expired_token` or `invalid_grant`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }
        '401':
          description: '`invalid_client`: an unknown client_id, or not the one the grant was started for'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }
  /auth/revoke:
    post:
      operationId: revokeApiToken
      summary: Sign the CLI or an SDK out (RFC 7009)
      description: Revokes the API session a refresh token belongs to. The answer is 200 whatever the token was, as RFC 7009 has it.
      tags: [Device sign-in]
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
                token_type_hint: { type: string, enum: [refresh_token] }
      responses:
        '200':
          description: Revoked, or nothing to revoke
  /console/v1/device-grants/{userCode}:
    parameters:
      - $ref: '#/components/parameters/UserCodePath'
    get:
      operationId: getDeviceGrant
      summary: A device grant waiting for the person's decision
      description: What the `#/device` page shows before the person approves. The code is matched case-insensitively with or without its hyphen.
      tags: [Device sign-in]
      security:
        - session: []
      responses:
        '200':
          description: The grant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceGrant' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /console/v1/device-grants/{userCode}:approve:
    parameters:
      - $ref: '#/components/parameters/UserCodePath'
    post:
      operationId: approveDeviceGrant
      summary: Sign the CLI or SDK in as this person
      description: 'Browser sessions only (403 `browser.only` with a bearer token). Approving needs a fresh sign-in, as a delete does: past `console.auth.step-up.max-age` it is the step-up 403. A grant is decided once (409 `device-grant.decided`) and never after it expired (410 `device-grant.expired`).'
      tags: [Device sign-in]
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: Approved; the CLI's next poll gets its tokens
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceGrant' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { $ref: '#/components/responses/Gone' }
  /console/v1/device-grants/{userCode}:deny:
    parameters:
      - $ref: '#/components/parameters/UserCodePath'
    post:
      operationId: denyDeviceGrant
      summary: Refuse a device grant
      tags: [Device sign-in]
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: Denied; the CLI's next poll gets `access_denied`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceGrant' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { $ref: '#/components/responses/Gone' }
  /console/v1/api-sessions:
    get:
      operationId: listApiSessions
      summary: The person's CLI and SDK sign-ins
      description: Newest first, the open ones only.
      tags: [API sessions]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/After'
      responses:
        '200':
          description: One page
          content:
            application/json:
              schema:
                type: object
                required: [items, next]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ApiSession' }
                  next: { $ref: '#/components/schemas/Cursor' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /console/v1/api-sessions/{apiSessionId}:
    delete:
      operationId: revokeApiSession
      summary: Sign one CLI or SDK out
      description: Its refresh token stops working at once and its access token within 15 minutes. Another person's session is a 404.
      tags: [API sessions]
      parameters:
        - name: apiSessionId
          in: path
          required: true
          schema: { type: string, pattern: '^aps_[0-9a-z]{26}$' }
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Revoked
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /console/v1/chat-links:
    get:
      operationId: listChatLinks
      summary: The person's linked Slack and Teams identities
      tags: [ChatOps]
      responses:
        '200':
          description: The links
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ChatLink' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: createChatLink
      summary: Link a chat identity to this person
      description: 'The `token` comes from the chat app''s answer to `/console link` (the `#/chat-link?token=` page): a BFF-signed token, audience `console-chat-link`, ten minutes, naming the platform, the workspace and the chat user. Browser sessions only. One person per chat user (409 `chat-link.taken`).'
      tags: [ChatOps]
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '201':
          description: Linked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatLink' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /console/v1/chat-links/{linkId}:
    delete:
      operationId: deleteChatLink
      summary: Unlink a chat identity
      tags: [ChatOps]
      parameters:
        - name: linkId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Unlinked
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /chatops/slack/commands:
    post:
      operationId: slackCommand
      summary: A Slack slash command (`/console …`)
      description: |
        Verified with Slack's signature: `X-Slack-Signature` is `v0=` and the HMAC-SHA256 of
        `v0:<X-Slack-Request-Timestamp>:<raw body>` under the signing secret, the timestamp within
        five minutes; anything else is a 401. Acknowledged at once (Slack waits 3 seconds); the
        answer follows through the command's `response_url`. Commands: `find <text>`, `show <wfrn>`,
        `jobs`, `run <verb> <wfrn>` (the preview with Confirm and Cancel), `approve`,
        `account <id> [region]`, `subscribe <kind…>`, `unsubscribe`, `subscriptions`, `link`,
        `unlink`, `help`. Each runs as the linked person through the console's own IAM; a chat call
        never satisfies a step-up, so a destructive verb answers with a link to the console. 404
        while Slack is not configured.
      tags: [ChatOps]
      security: []
      parameters:
        - { name: X-Slack-Signature, in: header, required: true, schema: { type: string } }
        - { name: X-Slack-Request-Timestamp, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: { type: object, additionalProperties: { type: string } }
      responses:
        '200':
          description: The acknowledgement, an ephemeral Slack message
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /chatops/slack/interactions:
    post:
      operationId: slackInteraction
      summary: A button pressed in a Slack message
      description: Verified like the commands. Confirm re-decides the action as the linked person before it runs; an approval button decides as the person, once.
      tags: [ChatOps]
      security: []
      parameters:
        - { name: X-Slack-Signature, in: header, required: true, schema: { type: string } }
        - { name: X-Slack-Request-Timestamp, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [payload]
              properties:
                payload: { type: string, description: 'Slack''s interaction payload, JSON' }
      responses:
        '200':
          description: Taken; the message is updated through its `response_url`
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /chatops/teams/messages:
    post:
      operationId: teamsMessage
      summary: A message or card action sent to the Teams bot
      description: 'Verified with the Bot Framework''s JWT: keys from its OpenID configuration (`https://login.botframework.com/v1/.well-known/openidconfiguration`), `aud` the bot''s app id, `iss` `https://api.botframework.com`; anything else is a 401. The same commands and buttons as Slack. 404 while Teams is not configured.'
      tags: [ChatOps]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, description: A Bot Framework activity, additionalProperties: true }
      responses:
        '200':
          description: Taken
        '202':
          description: Taken; the answer follows as a proactive message
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /console/v1/notifications:
    get:
      operationId: listNotifications
      summary: The person's notifications, newest first
      description: Across the person's accounts, each naming its account; kept 90 days. The live stream carries the new ones as `notification` events.
      tags: [Notifications]
      parameters:
        - { name: unread, in: query, schema: { type: boolean } }
        - { name: kind, in: query, schema: { $ref: '#/components/schemas/NotificationKind' } }
        - { name: accountId, in: query, schema: { $ref: '#/components/schemas/AccountId' } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/After'
      responses:
        '200':
          description: One page and the unread count
          content:
            application/json:
              schema:
                type: object
                required: [items, next, unread]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Notification' }
                  next: { $ref: '#/components/schemas/Cursor' }
                  unread: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /console/v1/notifications:read:
    post:
      operationId: markNotificationsRead
      summary: Mark notifications read
      tags: [Notifications]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: '`ids` (at most 200), or `all: true`'
              properties:
                ids:
                  type: array
                  maxItems: 200
                  items: { type: string }
                all: { type: boolean }
      responses:
        '200':
          description: What is left unread
          content:
            application/json:
              schema:
                type: object
                required: [unread]
                properties:
                  unread: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /console/v1/notification-settings:
    get:
      operationId: getNotificationSettings
      summary: Where the person is notified of what
      tags: [Notifications]
      responses:
        '200':
          description: The settings
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      operationId: putNotificationSettings
      summary: Replace the person's notification settings
      description: 'Needs `If-Match` with the version read (400 without it, 409 `version.moved` when it moved on). The email address is the identity provider''s and cannot be set here; a channel that is not linked cannot be enabled.'
      tags: [Notifications]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationSettings' }
      responses:
        '200':
          description: The settings
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationSettings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /console/v1/notification-settings:test:
    post:
      operationId: testNotificationChannel
      summary: Send a test notification on one channel
      tags: [Notifications]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel]
              properties:
                channel: { $ref: '#/components/schemas/NotificationChannel' }
      responses:
        '202':
          description: Sent to the outbox
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /console/v1/recent:
    get:
      operationId: listRecent
      summary: The session account's recently visited types and resources
      description: The 20 latest, newest first.
      tags: [Recent and favourites]
      responses:
        '200':
          description: The visits
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/RecentVisit' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: recordVisit
      summary: Record a visit
      description: The web app posts when a type's list or a resource's page opens; the same key moves to the top.
      tags: [Recent and favourites]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, key, title]
              properties:
                kind: { type: string, enum: [type, resource] }
                key: { type: string, maxLength: 1024, description: 'A type key, or a wfrn' }
                title: { type: string, maxLength: 256 }
      responses:
        '204':
          description: Recorded
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /console/v1/favourites:
    get:
      operationId: listFavourites
      summary: The session account's favourite resources
      description: Newest first, at most 100, leaving out the ones whose type the person may no longer list. Favourite services stay `Preferences.pinnedTypes`.
      tags: [Recent and favourites]
      responses:
        '200':
          description: The favourites
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Favourite' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /console/v1/favourites/{wfrn}:
    parameters:
      - $ref: '#/components/parameters/WfrnPath'
    put:
      operationId: putFavourite
      summary: Make a resource a favourite
      description: 'Idempotent; 409 `favourites.full` past 100 in the account.'
      tags: [Recent and favourites]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, name]
              properties:
                type: { type: string }
                name: { type: string, maxLength: 256 }
      responses:
        '200':
          description: The favourite
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Favourite' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      operationId: deleteFavourite
      summary: Stop a resource being a favourite
      tags: [Recent and favourites]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Removed, or never a favourite
        '401': { $ref: '#/components/responses/Unauthorized' }
  /console/v1/digests:
    get:
      operationId: listDigests
      summary: The session account's weekly digests, newest first
      description: 'As `digests:get` allows on `wfrn:<partition>:digests::<account>:*`; every managed role reads.'
      tags: [Digests]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/After'
      responses:
        '200':
          description: One page
          content:
            application/json:
              schema:
                type: object
                required: [items, next]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/DigestSummary' }
                  next: { $ref: '#/components/schemas/Cursor' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /console/v1/digests/{weekStart}:
    get:
      operationId: getDigest
      summary: One week's digest of the session account
      tags: [Digests]
      parameters:
        - name: weekStart
          in: path
          required: true
          description: The week's Monday (UTC)
          schema: { type: string, format: date }
      responses:
        '200':
          description: The digest
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Digest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /console/v1/iam/access-reviews/{id}/items:
    parameters:
      - $ref: '#/components/parameters/IamId'
    get:
      operationId: listAccessReviewItems
      summary: The grants an access review asks about
      description: 'Decision 34: passes through to the identity service''s `GET /v1/accounts/{accountId}/access-reviews/{reviewId}/items` (WP 9.11)'
      tags: [IAM]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/After'
      responses:
        '200': { $ref: '#/components/responses/IamAnswer' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /console/v1/iam/access-reviews/{id}/items/{itemId}:decide:
    parameters:
      - $ref: '#/components/parameters/IamId'
      - name: itemId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: decideAccessReviewItem
      summary: Keep or remove one grant of an access review
      description: 'Decision 34: passes through to the identity service''s `:decide` on the review item, the body unchanged'
      tags: [IAM]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IamBody' }
      responses:
        '200': { $ref: '#/components/responses/IamAnswer' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /console/v1/organization/accounts:
    get:
      operationId: listOrganizationAccounts
      summary: Every account of the organization
      description: 'Decision 34: organization admins only (404 for anyone else). The BFF asks the identity service''s `GET /v1/accounts` as the console-internal principal, naming the person in `X-On-Behalf-Of`; closed accounts are included.'
      tags: [Organization]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/After'
      responses:
        '200': { $ref: '#/components/responses/IamAnswer' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /console/v1/organization/accounts/{accountId}:close:
    parameters:
      - $ref: '#/components/parameters/OrganizationAccountId'
    post:
      operationId: closeOrganizationAccount
      summary: Close an account
      description: 'Decision 34: organization admins only, after a fresh sign-in (the step-up 403); the identity service''s `POST /v1/accounts/{accountId}:close`'
      tags: [Organization]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IamBody' }
      responses:
        '200': { $ref: '#/components/responses/IamAnswer' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /console/v1/organization/accounts/{accountId}/break-glass:
    parameters:
      - $ref: '#/components/parameters/OrganizationAccountId'
    post:
      operationId: grantBreakGlass
      summary: Emergency access to an account
      description: 'Decision 34: organization admins only, after a fresh sign-in; the identity service''s `POST /v1/accounts/{accountId}/break-glass` with `approvedBy` set to the admin calling, never the person given access'
      tags: [Organization]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IamBody' }
      responses:
        '201': { $ref: '#/components/responses/IamAnswer' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /console/v1/organization/guardrails:
    get:
      operationId: listGuardrails
      summary: The organization's guardrails
      description: 'Decision 34: organization admins only; the identity service''s `GET /v1/guardrails`'
      tags: [Organization]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/After'
      responses:
        '200': { $ref: '#/components/responses/IamAnswer' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createGuardrail
      summary: Add a guardrail
      description: 'Decision 34: organization admins only, after a fresh sign-in'
      tags: [Organization]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IamBody' }
      responses:
        '201': { $ref: '#/components/responses/IamAnswer' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /console/v1/organization/guardrails/{guardrailId}:
    parameters:
      - name: guardrailId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getGuardrail
      summary: One guardrail
      tags: [Organization]
      responses:
        '200': { $ref: '#/components/responses/IamAnswer' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateGuardrail
      summary: Change a guardrail
      description: 'Decision 34: after a fresh sign-in; `If-Match` carries the version'
      tags: [Organization]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IamBody' }
      responses:
        '200': { $ref: '#/components/responses/IamAnswer' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      operationId: deleteGuardrail
      summary: Remove a guardrail
      description: 'Decision 34: after a fresh sign-in'
      tags: [Organization]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204': { description: Removed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /console/v1/r/{type}/{wfrn}/revert-plan:
    parameters:
      - $ref: '#/components/parameters/TypePath'
      - $ref: '#/components/parameters/WfrnPath'
    get:
      operationId: getRevertPlan
      summary: What bringing a resource back to an earlier time takes
      description: 'Decision 29 (WP 9.8): decided as `<service>:get`; the state service''s `GET /v1/wfrn/{wfrn}/revert-plan`. Nothing runs: the console shows the plan and runs its update only when the person confirms, as the ordinary `PATCH` with `confirm`.'
      tags: [Resources]
      parameters:
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
      responses:
        '200': { $ref: '#/components/responses/StateAnswer' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /console/v1/r/{type}/{wfrn}/activity:verify:
    parameters:
      - $ref: '#/components/parameters/TypePath'
      - $ref: '#/components/parameters/WfrnPath'
    get:
      operationId: verifyResourceActivity
      summary: Check a resource's activity has not been altered
      description: 'Decision 29 (WP 7.1): decided as `<service>:get`; the state service''s hash chain check `GET /v1/wfrn/{wfrn}/events:verify`'
      tags: [Resources]
      responses:
        '200': { $ref: '#/components/responses/StateAnswer' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /console/v1/r/{type}/{wfrn}:transfer:
    parameters:
      - $ref: '#/components/parameters/TypePath'
      - $ref: '#/components/parameters/WfrnPath'
    post:
      operationId: transferResource
      summary: Move a resource to another account
      description: 'Decision 30: needs `<service>:transfer` on the wfrn in its account and `<service>:create` on the type in the target account, each decided in its own account, plus `confirm: true` and a fresh sign-in. The BFF runs the target''s budget check as a create does (409 `budget.exceeded`; the cost service being down lets it go on), the state service''s `:transfer`, then the platform''s re-home of the registry record (safe to repeat; 409 `resource.rehomed` when it moved since). The answer is the resource under its new wfrn; the old wfrn then answers 410 `resource.transferred` with `transferredTo`.'
      tags: [Commands]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransferInput' }
      responses:
        '201': { $ref: '#/components/responses/StateAnswer' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { $ref: '#/components/responses/Gone' }
        '502': { $ref: '#/components/responses/BadGateway' }
  /console/v1/r:blast-radius:
    post:
      operationId: blastRadius
      summary: What deleting a set of resources would touch
      description: 'Decision 29: at most 100 wfrns, each decided as its `<service>:get`; the state service''s `POST /v1/resources:blast-radius`, each dependent counted once'
      tags: [Resources]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [wfrns]
              properties:
                wfrns:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: { type: string }
      responses:
        '200': { $ref: '#/components/responses/StateAnswer' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /console/v1/map:
    get:
      operationId: getResourceMap
      summary: The resource map
      description: 'Decision 29 (WP 9.4): the session account''s resources and their links, from the state service''s `GET /v1/graph`; `accountIds` widens it to the person''s other accounts, each where `<service>:list` allows'
      tags: [Resources]
      parameters:
        - name: accountIds
          in: query
          style: form
          explode: false
          schema:
            type: array
            items: { $ref: '#/components/schemas/AccountId' }
        - name: type
          in: query
          schema: { type: string }
      responses:
        '200': { $ref: '#/components/responses/StateAnswer' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /console/v1/activity:
    get:
      operationId: listAccountActivity
      summary: The account's activity trail
      description: 'Decision 29 (WP 7.1): the state service''s `GET /v1/activity` for the session account, as `activity:list` allows'
      tags: [Activity]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/After'
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
      responses:
        '200': { $ref: '#/components/responses/StateAnswer' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /console/v1/activity/digests:
    get:
      operationId: listActivityDigests
      summary: The trail's sealed periods
      description: 'Decision 29: the state service''s `GET /v1/activity/digests`'
      tags: [Activity]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/After'
      responses:
        '200': { $ref: '#/components/responses/StateAnswer' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /console/v1/activity/keys:
    get:
      operationId: listActivityKeys
      summary: The public keys that seal the trail
      description: 'Decision 29: the state service''s `GET /v1/activity/keys`'
      tags: [Activity]
      responses:
        '200': { $ref: '#/components/responses/StateAnswer' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /console/v1/activity/evidence:
    get:
      operationId: getActivityEvidence
      summary: The audit evidence pack for a period
      description: 'Decision 29 (WP 7.1): `account-admin` and `auditor` only (403 for anyone else); the state service''s `GET /v1/activity/evidence`'
      tags: [Activity]
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
      responses:
        '200': { $ref: '#/components/responses/StateAnswer' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: console_session
      description: The session cookie set by /auth/callback; state-changing calls also send X-Csrf-Token
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'An access token from POST /auth/token (decision 31): typ at+jwt, aud console-api, 15 minutes; no CSRF token'
  parameters:
    CsrfToken:
      name: X-Csrf-Token
      in: header
      required: true
      description: The token the session answers; a state-changing call without it is 403
      schema: { type: string }
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      schema: { type: string }
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: The version the caller holds; 409 when the record moved on
      schema: { type: string }
    IamCollection:
      name: collection
      in: path
      required: true
      description: 'Decision 34 adds guardrails (the ones that apply to the account; read only), policy-simulations (POST only; nothing is written), access-reviews (WP 9.11), elevations (WP 9.12), and quota-rules and elevation-rules (not account-scoped; GET only, anyone signed in)'
      schema: { type: string, enum: [users, groups, roles, policies, access-keys, quotas, guardrails, policy-simulations, access-reviews, elevations, quota-rules, elevation-rules] }
    IamId:
      name: id
      in: path
      required: true
      description: The record's id (a quota's key)
      schema: { type: string }
    IamAction:
      name: action
      in: path
      required: true
      description: '`decide` and `revoke` on an elevation, `cancel` on an access review (decision 34)'
      schema: { type: string, enum: [rotate, request-increase, decide, cancel, revoke] }
    PackName:
      name: pack
      in: path
      required: true
      schema: { type: string, pattern: '^[a-z][a-z0-9-]{0,62}[a-z0-9]$' }
    RuleId:
      name: ruleId
      in: path
      required: true
      schema: { type: string, pattern: '^[a-z][a-z0-9-]{0,62}[a-z0-9]$' }
    TypePath:
      name: type
      in: path
      required: true
      description: A resource type name
      schema: { type: string, pattern: '^[a-z0-9-]{1,64}$' }
    OrganizationAccountId:
      name: accountId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/AccountId' }
    WfrnPath:
      name: wfrn
      in: path
      required: true
      description: The resource's wfrn, percent-encoded; its type segment must be the path's type
      schema: { $ref: '#/components/schemas/Wfrn' }
    VerbPath:
      name: verb
      in: path
      required: true
      description: 'A verb of the type''s catalog other than create and update'
      schema: { type: string, pattern: '^[a-z][a-z0-9-]{0,31}$' }
    JobIdPath:
      name: jobId
      in: path
      required: true
      schema: { type: string }
    FindingIdPath:
      name: findingId
      in: path
      required: true
      schema: { type: string }
    RunIdPath:
      name: runId
      in: path
      required: true
      schema: { type: string }
    AlarmIdPath:
      name: alarmId
      in: path
      required: true
      description: Chosen by the web app when it creates the alarm
      schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$' }
    RecommendationIdPath:
      name: recommendationId
      in: path
      required: true
      schema: { type: string }
    UserCodePath:
      name: userCode
      in: path
      required: true
      description: 'The code the CLI shows, XXXX-XXXX; matched case-insensitively, with or without the hyphen'
      schema: { type: string, pattern: '^[A-Za-z]{4}-?[A-Za-z]{4}$' }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    After:
      name: after
      in: query
      required: false
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Passed through to the platform (P-21) and to the state service; the web app sends one per form submission
      schema: { type: string, maxLength: 255 }
  responses:
    CommandAccepted:
      description: The job was started
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CommandAccepted' }
    Preview:
      description: What the run would do
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Preview' }
    BadRequest:
      description: Bad input
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: No session
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: 'The account''s policies deny it (`denied` says which layer, why, and what to request), a step-up is needed (`detail.stepUp`), or the CSRF token is missing (no `denied`)'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    IamAnswer:
      description: 'The identity service''s answer, unchanged: its schema for the collection (contracts/openapi/console-identity-service.yaml), its ETag'
      headers:
        ETag:
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/IamBody' }
    NotFound:
      description: Unknown, or another account's
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    StateAnswer:
      description: 'The state service''s answer, unchanged: its schema for the operation (contracts/openapi/console-state-service.yaml)'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/StateBody' }
    Gone:
      description: Ended, such as a device grant past its expiry
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: A conflict
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: Over a quota
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BadGateway:
      description: The platform or a console service answered an error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Wfrn:
      type: string
      maxLength: 1024
      pattern: '^wfrn:[a-z0-9-]{1,32}:[a-z0-9-]{2,32}:(|[a-z0-9-]{2,32}):(|[0-9]{12}):[a-z0-9-]{1,64}/[a-z0-9-]{1,128}(/[a-z0-9-]{1,128})*$'
    AccountId:
      type: string
      pattern: '^[0-9]{12}$'
    RegionName:
      type: string
      pattern: '^[a-z0-9-]{2,32}$'
    Cursor:
      type: [string, 'null']
    ResourceState:
      type: string
      enum: [pending, active, updating, deleting, deleted, failed]
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        problems:
          type: array
          items: { $ref: '#/components/schemas/Problem' }
        denied: { $ref: '#/components/schemas/Denial' }
        detail:
          type: object
          description: 'More about the refusal; a step-up refusal is `{ stepUp: true, action, login }`'
          properties:
            stepUp: { type: boolean }
            action: { type: string, description: 'The `<service>:<verb>` that needs a fresh sign-in' }
            login: { type: string, description: 'The /auth/login URL to send the person to, with stepUp=true and returnTo set' }
          additionalProperties: true
        correlationId: { type: string }
    Denial:
      type: object
      description: Why an action is refused or greyed, from the layer that decided
      required: [layer, action, reason, requestable]
      properties:
        layer: { type: string, enum: [console-iam, platform], description: "The account's roles and policies, or the platform's own scopes" }
        action: { type: string, description: '`<service>:<verb>`' }
        resource: { type: string, description: The wfrn or pattern checked }
        reason: { type: string, description: One sentence a person can act on }
        role: { type: string, description: 'console-iam: the role the decision came from' }
        policyId: { type: string, description: 'console-iam: the policy' }
        statement: { type: string, description: 'console-iam: the statement id' }
        scope: { type: string, description: 'platform: the scope the service account lacks' }
        refusedBy: { type: string, enum: [policy, boundary, guardrail], description: 'console-iam (decision 34): a policy, the role''s permissions boundary or an organization guardrail; a boundary or guardrail refusal is never requestable' }
        guardrailId: { type: string, description: 'console-iam: the guardrail that refused it' }
        requestable: { type: boolean, description: Whether the person may open an access request for it }
        suggestedRole: { type: string, description: The managed role that would allow it }
    Problem:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        field: { type: string, description: A JSON pointer into the submitted body }
        message: { type: string }
        level: { type: string, enum: [error, warning] }
    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [UP, DOWN, OUT_OF_SERVICE, UNKNOWN] }
        components: { type: object, additionalProperties: true }
    Session:
      type: object
      required: [user, account, region, csrfToken, expiresAt]
      properties:
        user:
          type: object
          required: [userId, email]
          properties:
            userId: { type: string }
            email: { type: string }
            name: { type: string }
            groups:
              type: array
              items: { type: string }
        account: { $ref: '#/components/schemas/AccountSummary' }
        region: { $ref: '#/components/schemas/RegionName' }
        csrfToken: { type: string, description: "Computed at run time, sent back as X-Csrf-Token" }
        expiresAt: { type: string, format: date-time }
        organizationAdmin: { type: boolean, description: 'Decision 34: the person''s sign-in groups include one of the organization admin groups, which opens the organization pages' }
    AccountSummary:
      type: object
      required: [accountId, name]
      properties:
        accountId: { $ref: '#/components/schemas/AccountId' }
        name: { type: string }
        status: { type: string }
        defaultRegion: { $ref: '#/components/schemas/RegionName' }
        roles:
          type: array
          description: 'The managed role names the person holds in the account: viewer, operator, account-admin, auditor (shown as Viewer, Operator, Admin, Auditor)'
          items: { type: string }
        groups:
          type: array
          description: The person's groups in the account
          items: { type: string }
    Region:
      type: object
      required: [name, status, environments]
      properties:
        name: { $ref: '#/components/schemas/RegionName' }
        title: { type: string }
        status: { type: string, enum: [available, opt-in, retired] }
        environments:
          type: array
          items: { type: string }
        types:
          type: array
          description: The types available there
          items: { type: string }
    ConsoleAction:
      type: object
      description: One verb of the type's catalog, as the Actions menu draws it (P-08)
      required: [verb, title, method, destructive, approval, bulk, preview, allowed]
      properties:
        verb: { type: string }
        title: { type: string }
        description: { type: string }
        method: { type: string, enum: [POST, PATCH, DELETE], description: "The catalog entry's own method when it names one, else create is POST, update is PATCH, delete is DELETE and any other verb is POST" }
        allowed: { type: boolean, description: 'Whether this session may run it, decided with `<service>:<verb>` on `wfrn:<partition>:<service>:<region>:<account>:<type>/*`' }
        denied: { $ref: '#/components/schemas/Denial', description: "Why not, when allowed is false" }
        destructive: { type: boolean }
        approval: { type: boolean }
        bulk: { type: boolean }
        preview: { type: boolean }
        effect: { type: string, enum: [create, change, delete, read, none, unknown] }
        subjectInput: { type: [string, 'null'] }
        mutableFields:
          type: array
          items: { type: string }
        input: { type: object, description: The JSON Schema of the inputs the form shows (the subject left out), additionalProperties: true }
        workflow: { type: string }
        version: { type: string }
        deprecated:
          type: object
          properties:
            since: { type: string }
            sunset: { type: string }
            message: { type: string }
    ConsoleType:
      type: object
      description: 'Everything the web app needs to draw a type''s list, detail and forms'
      required: [key, type, service, plural, title, schema, states, list, detail, lifecycle, actions, etag]
      properties:
        key: { type: string, description: '`<service>/<type>`' }
        type: { type: string }
        service: { type: string }
        plural: { type: string }
        title: { type: string }
        icon: { type: string }
        description: { type: string }
        schema: { type: object, description: The JSON Schema of the attributes with the x-console hints merged in, additionalProperties: true }
        states:
          type: array
          items: { type: string }
        list:
          type: object
          required: [columns]
          properties:
            columns:
              type: array
              items: { type: string }
            defaultSort: { type: string }
        detail:
          type: object
          required: [tabs]
          properties:
            tabs:
              type: array
              items: { type: string, enum: [configuration, drift, activity, relationships, tags, monitoring, permissions, json] }
        lifecycle:
          type: object
          description: Platform status to lifecycle class
          additionalProperties: { $ref: '#/components/schemas/ResourceState' }
        observe:
          type: object
          properties:
            supported: { type: boolean }
            interval: { type: string }
            metrics: { type: boolean }
            discover: { type: boolean }
        actions:
          type: array
          items: { $ref: '#/components/schemas/ConsoleAction' }
        etag: { type: string }
    ConsoleResource:
      type: object
      required: [wfrn, type, service, state, version, attributes, tags, createdAt, updatedAt]
      properties:
        wfrn: { $ref: '#/components/schemas/Wfrn' }
        type: { type: string }
        service: { type: string }
        name: { type: string }
        region: { $ref: '#/components/schemas/RegionName' }
        state: { $ref: '#/components/schemas/ResourceState' }
        version: { type: integer }
        attributes: { type: object, additionalProperties: true }
        observed: { type: object, additionalProperties: true }
        drift: { type: boolean }
        tags:
          type: object
          additionalProperties: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        lastJob: { $ref: '#/components/schemas/JobSummary' }
    ConsoleResourceDetail:
      allOf:
        - $ref: '#/components/schemas/ConsoleResource'
        - type: object
          required: [can]
          properties:
            finding: { $ref: '#/components/schemas/Finding' }
            jobs:
              type: array
              items: { $ref: '#/components/schemas/JobSummary' }
            builtFrom:
              type: array
              items: { $ref: '#/components/schemas/ResourceRef' }
            dependents:
              type: array
              items: { $ref: '#/components/schemas/ResourceRef' }
            can:
              type: array
              description: The verbs the user may run on this resource, from the account's policies
              items: { type: string }
            observedAt: { type: string, format: date-time }
    ResourceRef:
      type: object
      required: [wfrn, type]
      properties:
        wfrn: { $ref: '#/components/schemas/Wfrn' }
        type: { type: string }
        name: { type: string }
        state: { $ref: '#/components/schemas/ResourceState' }
    Lineage:
      type: object
      required: [resource, nodes, edges]
      properties:
        resource: { $ref: '#/components/schemas/ResourceRef' }
        nodes:
          type: array
          items: { $ref: '#/components/schemas/ResourceRef' }
        edges:
          type: array
          items:
            type: object
            required: [from, to]
            properties:
              from: { $ref: '#/components/schemas/Wfrn' }
              to: { $ref: '#/components/schemas/Wfrn' }
              via: { type: string }
    CommandInput:
      type: object
      description: The form's values; `confirm` for a destructive verb, `labels` become X-Job-Label-* headers
      required: [input]
      properties:
        input: { type: object, additionalProperties: true }
        confirm: { type: boolean }
        reason: { type: string, maxLength: 1000 }
        labels:
          type: object
          maxProperties: 16
          additionalProperties: { type: string, maxLength: 128 }
    BatchInput:
      type: object
      required: [verb, items]
      properties:
        verb: { type: string }
        items:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: object
            required: [input]
            properties:
              wfrn: { $ref: '#/components/schemas/Wfrn', description: "The subject, for every verb but create" }
              input: { type: object, additionalProperties: true }
        defaults: { type: object, additionalProperties: true }
        rollout:
          type: object
          properties:
            waves:
              type: array
              items: { type: integer }
            maxParallel: { type: integer }
            stopIfFailedPercent: { type: integer }
        confirm: { type: boolean }
    CommandAccepted:
      type: object
      required: [wfrn, jobId, requestId]
      properties:
        wfrn: { $ref: '#/components/schemas/Wfrn' }
        jobId: { type: string }
        requestId: { type: string, description: "The console request id, also the X-Console-Request-Id the platform saw" }
        approval: { type: boolean, description: The job waits for an approval }
    BatchAccepted:
      type: object
      required: [jobId, rows, requestId]
      properties:
        jobId: { type: string }
        rows: { type: integer }
        requestId: { type: string }
        wfrns:
          type: array
          description: 'For create: the minted names, one per row'
          items: { $ref: '#/components/schemas/Wfrn' }
    Preview:
      type: object
      description: 'The platform''s Preview with wfrns on the affected resources'
      required: [steps, affectedResources, policy]
      properties:
        workflow: { type: string }
        version: { type: string }
        steps:
          type: array
          items:
            type: object
            required: [id, name, effect]
            properties:
              id: { type: string }
              name: { type: string }
              effect: { type: string, enum: [create, change, delete, read, none, unknown] }
              detail: { type: string }
              skipped: { type: boolean }
        affectedResources:
          type: array
          items: { $ref: '#/components/schemas/ResourceRef' }
        cost:
          type: object
          properties:
            monthly: { type: number }
            currency: { type: string }
            detail: { type: string }
        policy:
          type: object
          required: [decision]
          properties:
            decision: { type: string, enum: [allow, deny, needs-approval] }
            rules:
              type: array
              items:
                type: object
                description: "The platform's rules, then the console's own: `quota.resources` (the identity service's quota) and `budget.exceeded` (deny) or `budget.forecast-over` (warn) from the cost service's `checkBudgets`, with the budget in `budgetId`"
                properties:
                  id: { type: string }
                  result: { type: string }
                  message: { type: string }
                  budgetId: { type: string }
    JobSummary:
      type: object
      required: [jobId, workflow, status]
      properties:
        jobId: { type: string }
        workflow: { type: string }
        title: { type: string }
        version: { type: string }
        status: { type: string, enum: [queued, running, waiting-approval, needs-attention, succeeded, failed, cancelled, rolled-back] }
        requester: { type: string }
        wfrn: { $ref: '#/components/schemas/Wfrn' }
        startedAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time }
        durationMs: { type: integer }
        kind: { type: string, enum: [single, batch] }
        progress:
          type: object
          properties:
            done: { type: integer }
            total: { type: integer }
            failed: { type: integer }
        errorClass: { type: string }
        failedStep: { type: string }
    JobDetail:
      allOf:
        - $ref: '#/components/schemas/JobSummary'
        - type: object
          properties:
            input: { type: object, additionalProperties: true }
            output: { type: object, additionalProperties: true }
            steps:
              type: array
              items:
                type: object
                required: [id, status]
                properties:
                  id: { type: string }
                  name: { type: string }
                  type: { type: string }
                  status: { type: string }
                  attempt: { type: integer }
                  startedAt: { type: string, format: date-time }
                  endedAt: { type: string, format: date-time }
                  durationMs: { type: integer }
                  error:
                    type: object
                    properties:
                      class: { type: string }
                      message: { type: string }
                      retryable: { type: boolean }
            approvals:
              type: array
              items: { $ref: '#/components/schemas/Approval' }
            preview: { $ref: '#/components/schemas/Preview' }
            attention:
              type: object
              properties:
                step: { type: string }
                options:
                  type: array
                  items: { type: string }
                since: { type: string, format: date-time }
            children:
              type: array
              items: { $ref: '#/components/schemas/JobSummary' }
            can:
              type: array
              description: 'cancel, retry, skip, abort, rerun as the user may'
              items: { type: string }
    Approval:
      type: object
      required: [approvalId, jobId, status]
      properties:
        approvalId: { type: string }
        jobId: { type: string }
        workflow: { type: string }
        step: { type: string }
        group: { type: string }
        message: { type: string }
        requestedAt: { type: string, format: date-time }
        timeout: { type: string }
        status: { type: string, enum: [pending, approved, rejected, expired] }
        decidedBy: { type: string }
        decidedAt: { type: string, format: date-time }
        comment: { type: string }
        wfrn: { $ref: '#/components/schemas/Wfrn' }
        preview: { $ref: '#/components/schemas/Preview' }
        canDecide: { type: boolean }
    Severity:
      type: string
      enum: [info, warning, critical]
    RuleStatus:
      type: string
      enum: [pass, fail, error]
      description: '`error`: the policy engine could not judge it (counted neither way)'
    RemediationSpec:
      type: object
      required: [title, kind, inputs]
      properties:
        title: { type: string }
        kind: { type: string, enum: [workflow, tags] }
        verb: { type: string }
        workflow: { type: string }
        inputs:
          type: array
          items:
            type: object
            required: [name, title, type, required]
            properties:
              name: { type: string }
              title: { type: string }
              type: { type: string, enum: [string, integer, number, boolean] }
              enum: { type: array, items: {} }
              default: { description: 'May be a `{{ $resource.<path> }}` template, filled per resource by the caller or left to the service' }
              required: { type: boolean }
    RuleSummary:
      type: object
      required: [id, title, severity, types]
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string }
        severity: { $ref: '#/components/schemas/Severity' }
        types:
          type: array
          items: { type: string }
        remediation: { $ref: '#/components/schemas/RemediationSpec' }
    RulePackSummary:
      type: object
      required: [name, title, version, rules]
      properties:
        name: { type: string }
        title: { type: string }
        description: { type: string }
        version: { type: integer }
        owner: { type: string }
        rules:
          type: array
          items: { $ref: '#/components/schemas/RuleSummary' }
    Counts:
      type: object
      required: [passed, failed]
      properties:
        passed: { type: integer, minimum: 0 }
        failed: { type: integer, minimum: 0 }
    RuleScore:
      allOf:
        - $ref: '#/components/schemas/Counts'
        - type: object
          required: [id, title, severity, score, remediable]
          properties:
            id: { type: string }
            title: { type: string }
            severity: { $ref: '#/components/schemas/Severity' }
            score: { type: [integer, 'null'], minimum: 0, maximum: 100 }
            remediable: { type: boolean, description: The rule has a one-click fix }
    PackScore:
      allOf:
        - $ref: '#/components/schemas/Counts'
        - type: object
          required: [name, title, version, score, rules]
          properties:
            name: { type: string }
            title: { type: string }
            version: { type: integer }
            score: { type: [integer, 'null'], minimum: 0, maximum: 100 }
            rules:
              type: array
              items: { $ref: '#/components/schemas/RuleScore' }
    TrendPoint:
      type: object
      required: [day, score]
      properties:
        day: { type: string, format: date }
        score: { type: [integer, 'null'], minimum: 0, maximum: 100 }
    Scorecard:
      allOf:
        - $ref: '#/components/schemas/Counts'
        - type: object
          required: [accountId, score, resources, bySeverity, packs, trend]
          properties:
            accountId: { $ref: '#/components/schemas/AccountId' }
            score: { type: [integer, 'null'], minimum: 0, maximum: 100, description: Null while nothing has been scored }
            resources: { type: integer, description: Resources with at least one applicable rule }
            failingResources: { type: integer, description: Resources failing at least one rule }
            bySeverity:
              type: object
              required: [critical, warning, info]
              properties:
                critical: { $ref: '#/components/schemas/Counts' }
                warning: { $ref: '#/components/schemas/Counts' }
                info: { $ref: '#/components/schemas/Counts' }
            packs:
              type: array
              items: { $ref: '#/components/schemas/PackScore' }
            trend:
              type: array
              description: One point per day with a snapshot, oldest first; today's is the live score
              items: { $ref: '#/components/schemas/TrendPoint' }
            evaluatedAt: { type: string, format: date-time, description: When an evaluation of the account last changed }
    ScorecardHeatmap:
      type: object
      required: [packs, rows]
      properties:
        packs:
          type: array
          items:
            type: object
            required: [name, title]
            properties:
              name: { type: string }
              title: { type: string }
        rows:
          type: array
          items:
            type: object
            required: [accountId, score, failed, packs]
            properties:
              accountId: { $ref: '#/components/schemas/AccountId' }
              accountName: { type: string }
              score: { type: [integer, 'null'] }
              failed: { type: integer, description: Failing evaluations }
              packs:
                type: object
                description: The pack's score by pack name; null where nothing applies
                additionalProperties: { type: [integer, 'null'] }
    Evaluation:
      type: object
      required: [wfrn, accountId, region, type, pack, ruleId, severity, status, since, evaluatedAt]
      properties:
        wfrn: { $ref: '#/components/schemas/Wfrn' }
        accountId: { $ref: '#/components/schemas/AccountId' }
        region: { $ref: '#/components/schemas/RegionName' }
        type: { type: string }
        name: { type: string }
        pack: { type: string }
        ruleId: { type: string }
        severity: { $ref: '#/components/schemas/Severity' }
        status: { $ref: '#/components/schemas/RuleStatus' }
        message: { type: string }
        since: { type: string, format: date-time, description: When the status last changed }
        evaluatedAt: { type: string, format: date-time, description: When the resource's evaluations last changed }
    RuleResult:
      type: object
      required: [pack, ruleId, title, severity, status, since, remediable]
      properties:
        pack: { type: string }
        ruleId: { type: string }
        title: { type: string }
        severity: { $ref: '#/components/schemas/Severity' }
        status: { $ref: '#/components/schemas/RuleStatus' }
        message: { type: string }
        since: { type: string, format: date-time }
        remediable: { type: boolean }
    ResourceCompliance:
      type: object
      required: [wfrn, accountId, region, type, passed, failed, results]
      properties:
        wfrn: { $ref: '#/components/schemas/Wfrn' }
        accountId: { $ref: '#/components/schemas/AccountId' }
        region: { $ref: '#/components/schemas/RegionName' }
        type: { type: string }
        evaluatedAt: { type: string, format: date-time }
        passed: { type: integer }
        failed: { type: integer }
        results:
          type: array
          description: The rules that apply, failing first
          items: { $ref: '#/components/schemas/RuleResult' }
    RemediateRequest:
      type: object
      required: [wfrn]
      properties:
        wfrn: { $ref: '#/components/schemas/Wfrn' }
        input:
          type: object
          description: Values for the remediation's inputs, by name; defaults fill the rest
          additionalProperties: true
        reason: { type: string, maxLength: 1000 }
    Remediation:
      type: object
      required: [wfrn, pack, ruleId, kind]
      properties:
        wfrn: { $ref: '#/components/schemas/Wfrn' }
        pack: { type: string }
        ruleId: { type: string }
        kind: { type: string, enum: [workflow, tags] }
        jobId: { type: string, description: 'kind workflow: the job' }
        workflow: { type: string }
        tags:
          type: object
          description: 'kind tags: the tags set'
          additionalProperties: { type: string }
    Finding:
      type: object
      required: [findingId, wfrn, status, severity, fields, openedAt]
      properties:
        findingId: { type: string }
        wfrn: { $ref: '#/components/schemas/Wfrn' }
        status: { type: string, enum: [open, closed] }
        severity: { type: string, enum: [info, warning, critical] }
        fields:
          type: array
          items:
            type: object
            required: [path]
            properties:
              path: { type: string }
              expected: {}
              observed: {}
              ignored: { type: boolean }
        openedAt: { type: string, format: date-time }
        observedAt: { type: string, format: date-time }
        closedAt: { type: string, format: date-time }
        resolution: { type: string, enum: [reverted, accepted, ignored, vanished] }
        can:
          type: array
          items: { type: string, enum: [revert, accept, ignore] }
        accountId: { $ref: '#/components/schemas/AccountId' }
        region: { $ref: '#/components/schemas/RegionName' }
        type: { type: string }
        version: { type: integer }
        decidedBy: { type: string }
        reason: { type: string }
        revertJobId: { type: string }
        revertStatus:
          type: string
          enum: [running, succeeded, failed]
          description: How the revert job of `revertJobId` stands; a failed one leaves the finding open
        ignoredUntil: { type: string, format: date-time }
    DriftDecision:
      type: object
      properties:
        reason: { type: string, maxLength: 1000 }
    FindingsSummary:
      type: object
      required: [open, byType, bySeverity]
      properties:
        open: { type: integer }
        byType:
          type: object
          additionalProperties: { type: integer }
        bySeverity:
          type: object
          additionalProperties: { type: integer }
        lastScanAt: { type: string, format: date-time }
    FindingStats:
      type: object
      required: [since, until, opened, closed, open, bySeverity]
      properties:
        accountId: { $ref: '#/components/schemas/AccountId' }
        since: { type: string, format: date-time }
        until: { type: string, format: date-time }
        opened: { type: integer, description: Findings opened in the window }
        closed:
          type: object
          description: Findings closed in the window, by resolution
          required: [total, reverted, accepted, ignored, vanished]
          properties:
            total: { type: integer }
            reverted: { type: integer }
            accepted: { type: integer }
            ignored: { type: integer }
            vanished: { type: integer }
        open: { type: integer, description: Findings open now }
        bySeverity:
          type: object
          description: Findings opened in the window, by severity
          additionalProperties: { type: integer }
        meanMinutesToClose: { type: [number, 'null'], description: Over the findings closed in the window }
    DiscoveryRun:
      type: object
      required: [runId, type, region, status, startedAt]
      properties:
        runId: { type: string }
        type: { type: string }
        region: { $ref: '#/components/schemas/RegionName' }
        status: { type: string, enum: [running, succeeded, failed] }
        startedAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time }
        seen: { type: integer }
        unmanaged: { type: integer }
        error: { type: string }
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount: { type: number, description: Per month }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        basis: { type: string, description: The price list the figure comes from }
    OwnerGuess:
      type: object
      description: The account an unmanaged object most likely belongs to, and why
      required: [accountId, confidence, reasons]
      properties:
        accountId: { $ref: '#/components/schemas/AccountId' }
        accountName: { type: string }
        team: { type: string, description: The account's owning team }
        confidence: { type: string, enum: [high, medium, low] }
        reasons:
          type: array
          description: In plain words, such as "Tagged team=payments"
          items: { type: string }
    Assignment:
      type: object
      description: An unmanaged object handed to another team's account
      required: [accountId, fromAccountId, by, at]
      properties:
        accountId: { $ref: '#/components/schemas/AccountId' }
        accountName: { type: string }
        fromAccountId: { $ref: '#/components/schemas/AccountId' }
        by: { type: string }
        note: { type: string }
        at: { type: string, format: date-time }
    UnmanagedObject:
      type: object
      required: [providerId, type, region, observed, seenAt, can]
      properties:
        providerId: { type: string }
        type: { type: string }
        region: { $ref: '#/components/schemas/RegionName' }
        name: { type: string }
        observed: { type: object, additionalProperties: true }
        seenAt: { type: string, format: date-time }
        firstSeenAt: { type: string, format: date-time }
        ownerGuess: { $ref: '#/components/schemas/OwnerGuess' }
        monthlyCost: { $ref: '#/components/schemas/Money' }
        assignment: { $ref: '#/components/schemas/Assignment' }
        can:
          type: array
          items: { type: string, enum: [import, assign] }
    MetricSeries:
      type: object
      required: [name, points]
      properties:
        name: { type: string, description: 'The series name the type''s metrics read maps, such as cpuPercent' }
        unit: { type: string }
        points:
          type: array
          items:
            type: object
            required: [at, value]
            properties:
              at: { type: string, format: date-time }
              value: { type: [number, 'null'] }
    ResourceMetrics:
      type: object
      required: [wfrn, from, to, step, series]
      properties:
        wfrn: { $ref: '#/components/schemas/Wfrn' }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        step: { type: string, description: An ISO-8601 duration }
        series:
          type: array
          items: { $ref: '#/components/schemas/MetricSeries' }
        provider: { type: string }
        action: { type: string }
    AlarmInput:
      type: object
      required: [wfrn, metric, comparison, threshold]
      properties:
        wfrn: { $ref: '#/components/schemas/Wfrn' }
        name: { type: string, maxLength: 128 }
        metric: { type: string, description: A series name of the type's metrics read }
        comparison: { type: string, enum: [above, below] }
        threshold: { type: number }
        windowMinutes: { type: integer, minimum: 1, maximum: 1440, default: 10, description: The average over this window is compared }
    Alarm:
      type: object
      required: [alarmId, wfrn, accountId, type, metric, comparison, threshold, windowMinutes, state, createdAt, updatedAt]
      properties:
        alarmId: { type: string }
        wfrn: { $ref: '#/components/schemas/Wfrn' }
        accountId: { $ref: '#/components/schemas/AccountId' }
        type: { type: string }
        name: { type: string }
        metric: { type: string }
        comparison: { type: string, enum: [above, below] }
        threshold: { type: number }
        windowMinutes: { type: integer }
        state: { type: string, enum: [ok, alarm, insufficient] }
        stateSince: { type: string, format: date-time }
        lastValue: { type: [number, 'null'], description: The window's average at the last evaluation }
        lastEvaluatedAt: { type: string, format: date-time }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Utilisation:
      type: object
      required: [from, to, samples]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        samples: { type: integer }
        cpuP95: { type: number, description: Percent }
        cpuMax: { type: number }
        memoryP95: { type: number, description: Percent }
        memoryMax: { type: number }
    Recommendation:
      type: object
      required: [recommendationId, wfrn, accountId, region, type, kind, action, status, utilisation, createdAt, updatedAt, can]
      properties:
        recommendationId: { type: string }
        wfrn: { $ref: '#/components/schemas/Wfrn' }
        accountId: { $ref: '#/components/schemas/AccountId' }
        region: { $ref: '#/components/schemas/RegionName' }
        type: { type: string }
        name: { type: string }
        kind: { type: string, enum: [idle, oversized] }
        action: { type: string, enum: [delete, resize] }
        status: { type: string, enum: [open, applied, dismissed, superseded] }
        current: { type: object, additionalProperties: true, description: 'The size fields as they are, such as cpu and memoryGb' }
        proposed: { type: object, additionalProperties: true, description: 'The size fields a resize sets; absent for a delete' }
        utilisation: { $ref: '#/components/schemas/Utilisation' }
        monthlyCost: { $ref: '#/components/schemas/Money' }
        monthlySaving: { $ref: '#/components/schemas/Money' }
        jobId: { type: string, description: 'The resize or delete job, once applied' }
        decidedBy: { type: string }
        reason: { type: string }
        dismissedUntil: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        can:
          type: array
          items: { type: string, enum: [apply, dismiss] }
    RecommendationsSummary:
      type: object
      required: [open, byKind, monthlySaving]
      properties:
        open: { type: integer }
        byKind:
          type: object
          additionalProperties: { type: integer }
        monthlySaving: { $ref: '#/components/schemas/Money' }
        lastPassAt: { type: string, format: date-time }
    ActivityEntry:
      type: object
      required: [at, kind]
      properties:
        at: { type: string, format: date-time }
        kind: { type: string, enum: [event, job] }
        type: { type: string, description: The state event type }
        actor: { type: string }
        job: { $ref: '#/components/schemas/JobSummary' }
        data: { type: object, additionalProperties: true }
    LiveEvent:
      type: object
      required: [type, at]
      properties:
        type: { type: string, description: 'A state.resources or drift.findings event type, job.updated, budget.alert (data: budgetId, name, threshold, percent, period, the cost service''s BudgetThresholdCrossed), or notification (the person''s own, a Notification in data)' }
        wfrn: { $ref: '#/components/schemas/Wfrn' }
        at: { type: string, format: date-time }
        version: { type: integer }
        key: { type: string }
        data: { type: object, additionalProperties: true }
    SearchHit:
      type: object
      required: [wfrn, type, score]
      properties:
        wfrn: { $ref: '#/components/schemas/Wfrn' }
        type: { type: string }
        name: { type: string }
        state: { $ref: '#/components/schemas/ResourceState' }
        score: { type: number }
        highlights:
          type: object
          additionalProperties: { type: string }
    Suggestion:
      type: object
      required: [kind, value, label]
      properties:
        kind: { type: string, enum: [resource, type, tag, wfrn] }
        value: { type: string }
        label: { type: string }
    Preferences:
      type: object
      properties:
        theme: { type: string, enum: [system, light, dark] }
        density: { type: string, enum: [comfortable, compact] }
        defaultRegion: { $ref: '#/components/schemas/RegionName' }
        pinnedTypes:
          type: array
          items: { type: string }
        columns:
          type: object
          description: Per type key, the list columns the user chose
          additionalProperties:
            type: array
            items: { type: string }
        version: { type: integer }
    IamBody:
      type: object
      description: 'A body of the identity service''s API, unchanged (contracts/openapi/console-identity-service.yaml)'
      additionalProperties: true
    StateBody:
      type: object
      description: 'A body of the state service''s API, unchanged (contracts/openapi/console-state-service.yaml)'
      additionalProperties: true
    TransferInput:
      type: object
      description: Decision 30
      required: [toAccountId, confirm]
      properties:
        toAccountId: { $ref: '#/components/schemas/AccountId' }
        reason: { type: string, maxLength: 500 }
        confirm: { type: boolean, const: true, description: The person confirmed the move }
    AccessRequestStatus:
      type: string
      enum: [pending, approved, rejected, expired]
    AccessRequestInput:
      type: object
      required: [action, reason]
      properties:
        action: { type: string, description: '`<service>:<verb>`, as the denial named it' }
        resource: { type: string, description: "The wfrn or pattern, as the denial named it" }
        role: { type: string, description: The role asked for; the denial's suggestedRole by default }
        reason: { type: string, maxLength: 2000 }
    AccessDecision:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [approve, reject] }
        comment: { type: string, maxLength: 2000 }
    AccessRequest:
      type: object
      required: [requestId, accountId, requester, action, reason, status, requestedAt]
      properties:
        requestId: { type: string }
        accountId: { $ref: '#/components/schemas/AccountId' }
        requester:
          type: object
          required: [userId]
          properties:
            userId: { type: string }
            email: { type: string }
            name: { type: string }
        action: { type: string }
        resource: { type: string }
        role: { type: string }
        reason: { type: string }
        status: { $ref: '#/components/schemas/AccessRequestStatus' }
        requestedAt: { type: string, format: date-time }
        decidedAt: { type: string, format: date-time }
        decidedBy: { type: string }
        comment: { type: string }
        approvers:
          type: array
          description: Who may decide it
          items: { type: string }
    ServiceTokenRequest:
      type: object
      required: [grant_type, client_assertion_type, client_assertion, audience]
      properties:
        grant_type:
          type: string
          enum: [client_credentials]
        client_assertion_type:
          type: string
          enum: ['urn:ietf:params:oauth:client-assertion-type:jwt-bearer']
        client_assertion:
          type: string
          description: The projected service-account token, or the JWT the client signed
        client_id:
          type: string
          description: The client's service id; when sent, it must be the assertion's client
          examples: [console-search-indexer]
        audience:
          type: string
          description: 'The one service the token is for (decision 35): required, sent once'
          examples: [console-state-service]
    ServiceToken:
      type: object
      required: [access_token, token_type, expires_in, audience]
      properties:
        access_token:
          type: string
          description: The internal JWT
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          description: Seconds the token lives (300); ask again before it ends
          examples: [300]
        audience:
          type: string
          description: The one service the token is for
    OAuthError:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: 'RFC 6749 §5.2, RFC 8628 §3.5 and RFC 8707; the service-token path answers the first four'
          enum: [invalid_request, invalid_client, unsupported_grant_type, invalid_target, invalid_grant, authorization_pending, slow_down, access_denied, expired_token]
        error_description:
          type: string
    JsonWebKeySet:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items:
            type: object
            required: [kty, kid]
            properties:
              kty: { type: string }
              kid: { type: string }
              use: { type: string }
              alg: { type: string }
              crv: { type: string }
              x: { type: string }
              y: { type: string }
              n: { type: string }
              e: { type: string }
            additionalProperties: true
    Insights:
      type: object
      description: What the console did for the accounts it covers, over one period
      required: [period, from, to, asOf, scope, accounts, managed, requests, leadTime, drift, adoption]
      properties:
        period: { type: string, enum: [7d, 30d, 90d] }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        asOf: { type: string, format: date-time }
        scope: { type: string, enum: [account, organization] }
        accounts:
          type: array
          description: The accounts the numbers cover
          items:
            type: object
            required: [accountId, name]
            properties:
              accountId: { $ref: '#/components/schemas/AccountId' }
              name: { type: string }
              owningTeam: { type: string }
              costCentre: { type: string }
        managed:
          type: object
          required: [resources, atStart]
          properties:
            resources: { type: integer, description: 'Live resources now; tombstones left out' }
            atStart: { type: integer, description: Live resources at the start of the period }
            byService:
              type: array
              description: Largest first
              items:
                type: object
                required: [service, resources]
                properties:
                  service: { type: string }
                  title: { type: string }
                  resources: { type: integer }
        requests:
          type: object
          required: [total, selfServed, failed]
          properties:
            total: { type: integer, description: 'Console requests started in the period: creates, verbs, updates and deletes' }
            selfServed: { type: integer, description: 'Requests that ended `succeeded` with no person stepping in: no failed step retried, skipped or aborted by hand' }
            failed: { type: integer }
        leadTime:
          type: object
          description: From the request to the resource running, over the period's self-served requests, against today's tickets
          required: [p50Ms, p90Ms]
          properties:
            p50Ms: { type: integer }
            p90Ms: { type: integer }
            baselineP50Ms: { type: integer, description: 'The median lead time of today''s tickets for the same kinds of request' }
            baselineSource: { type: string, description: 'Where the baseline comes from, such as "ticket export, September 2026"' }
        hoursSaved: { type: number, description: 'Over the self-served requests, the baseline less the lead time, never below 0 for one request, in hours; absent without a baseline' }
        drift:
          type: object
          required: [found, fixed, open]
          properties:
            found: { type: integer, description: Findings opened in the period }
            fixed: { type: integer, description: 'Findings closed in the period: reverted, accepted, or the resource changed back' }
            open: { type: integer, description: Findings open now }
            meanTimeToFixMs: { type: integer }
        adoption:
          type: array
          description: Week by week, oldest first, each week starting on a Monday (UTC)
          items:
            type: object
            required: [weekStart, activeUsers, requests, selfServed]
            properties:
              weekStart: { type: string, format: date }
              activeUsers: { type: integer, description: People who started at least one request }
              requests: { type: integer }
              selfServed: { type: integer }
    SearchFilter:
      type: object
      description: 'The list''s own filter names; `q` holds only what they cannot say: free text, wfrn patterns and created:/updated: terms'
      properties:
        q: { type: string }
        state: { $ref: '#/components/schemas/ResourceState' }
        drift: { type: boolean }
        region: { $ref: '#/components/schemas/RegionName' }
        tags:
          type: object
          description: 'Tag key to value; an empty value means "has the tag", which the list sends as `tag.<key>=`'
          additionalProperties: { type: string }
    SearchInterpretation:
      type: object
      description: The search indexer's reading of plain English (console-search-indexer.yaml 1.2.0)
      required: [filter, explanation, confidence, q, total]
      properties:
        type: { type: string, description: 'The resource type the text names, when it names one' }
        filter: { $ref: '#/components/schemas/SearchFilter' }
        sort: { type: string, enum: [name, -name, created, -created, updated, -updated] }
        explanation: { type: string, description: One sentence saying what was understood }
        confidence: { type: string, enum: [high, medium, low] }
        unparsed:
          type: array
          description: Words the reading left out
          items: { type: string }
        q: { type: string, description: The whole reading as one search query }
        total: { type: integer, description: How many resources it lists now }
    CountGroup:
      type: object
      required: [key, total]
      properties:
        key: { type: string }
        total: { type: integer }
        byState:
          type: object
          additionalProperties: { type: integer }
        drift: { type: integer, description: Resources of the group that drifted }
        service: { type: string, description: 'The service of a type group (groupBy=type)' }
    GroupedCounts:
      type: object
      required: [total, groups]
      properties:
        total: { type: integer }
        byState:
          type: object
          additionalProperties: { type: integer }
        drift: { type: integer }
        cappedAt: { type: integer, description: 'Set when a count stopped at a cap; the console shows "1,000+"' }
        groups:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/CountGroup' }
        asOf: { type: string, format: date-time }
    AssistantAsk:
      type: object
      required: [intent]
      properties:
        conversationId: { type: string, description: The conversation to continue; a new one when left out }
        intent: { type: string, enum: [ask, explain] }
        message: { type: string, minLength: 1, maxLength: 2000, description: 'The question; needed for `ask`' }
        context:
          type: object
          description: 'Where the person is, so "these" and "this one" mean something; `explain` needs `wfrn`'
          properties:
            path: { type: string, description: 'The console route, such as /console/compute/vm' }
            service: { type: string }
            type: { type: string }
            wfrn: { $ref: '#/components/schemas/Wfrn' }
            filter: { $ref: '#/components/schemas/SearchFilter' }
    AssistantConversation:
      type: object
      required: [conversationId, status, turns]
      properties:
        conversationId: { type: string }
        status: { type: string, enum: [thinking, ready, failed], description: '`thinking` while the last turn is under way' }
        startedAt: { type: string, format: date-time }
        turns:
          type: array
          description: Oldest first
          items: { $ref: '#/components/schemas/AssistantTurn' }
    AssistantTurn:
      type: object
      required: [turnId, role, at]
      properties:
        turnId: { type: string }
        role: { type: string, enum: [person, assistant] }
        at: { type: string, format: date-time }
        status: { type: string, enum: [thinking, answered, failed], description: An assistant turn's progress }
        text: { type: string, description: 'Plain text in short paragraphs, no markup' }
        proposals:
          type: array
          maxItems: 5
          items: { $ref: '#/components/schemas/AssistantProposal' }
        explanation: { $ref: '#/components/schemas/ResourceExplanation' }
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, description: 'assistant.unavailable, assistant.timeout, assistant.refused' }
            message: { type: string }
    AssistantProposal:
      type: object
      description: 'Something the console opens for the person to review; the copilot never runs it'
      required: [kind, label]
      properties:
        kind: { type: string, enum: [filter, create, action, open] }
        label: { type: string, description: 'What opening it does, such as "List the 12 stopped VMs in prod"' }
        service: { type: string }
        type: { type: string }
        filter: { $ref: '#/components/schemas/SearchFilter' }
        sort: { type: string }
        input: { type: object, additionalProperties: true, description: 'create and action: the inputs the copilot could fill; the form shows the rest' }
        missing:
          type: array
          description: Required inputs the copilot could not fill
          items: { type: string }
        wfrn: { $ref: '#/components/schemas/Wfrn' }
        verb: { type: string, description: 'action: the verb to open' }
        path: { type: string, description: 'open: a console route' }
    ResourceExplanation:
      type: object
      required: [wfrn, summary]
      properties:
        wfrn: { $ref: '#/components/schemas/Wfrn' }
        summary: { type: string, description: Two or three sentences on what it is and how it is doing }
        sections:
          type: array
          items:
            type: object
            required: [title, text]
            properties:
              title: { type: string }
              text: { type: string }
        facts:
          type: object
          properties:
            monthlyCost: { type: number }
            currency: { type: string }
            createdAt: { type: string, format: date-time }
            createdBy: { type: string }
            lastChangeAt: { type: string, format: date-time }
            lastChangeBy: { type: string }
            dependents: { type: integer }
            drift: { type: boolean }
    JobExplanation:
      type: object
      required: [jobId, status, cause, source]
      properties:
        jobId: { type: string }
        status: { type: string, enum: [failed, needs-attention] }
        cause:
          type: object
          required: [title]
          properties:
            class: { type: string, description: "The platform's error class" }
            title: { type: string, description: 'What went wrong, in plain words' }
            detail: { type: string }
        failedStep:
          type: object
          required: [id]
          properties:
            id: { type: string }
            name: { type: string }
            attempt: { type: integer }
            message: { type: string }
        fix:
          type: object
          required: [summary, confidence]
          properties:
            summary: { type: string, description: 'The fix to try, in one or two sentences' }
            input: { type: object, additionalProperties: true, description: "A merge over the job's input; the retry's body" }
            fromStep: { type: string }
            confidence: { type: string, enum: [high, medium, low] }
        retry:
          type: object
          required: [allowed]
          properties:
            allowed: { type: boolean }
            denied: { $ref: '#/components/schemas/Denial' }
        similar:
          type: object
          required: [count]
          properties:
            count: { type: integer, description: 'Jobs of the same workflow that failed with the same class in the account, 30 days' }
            lastFixed:
              type: object
              properties:
                jobId: { type: string }
                by: { type: string }
                at: { type: string, format: date-time }
        source: { type: string, enum: [rules, assistant] }
        links:
          type: array
          items:
            type: object
            required: [title, url]
            properties:
              title: { type: string }
              url: { type: string }
    Currency:
      type: string
      pattern: '^[A-Z]{3}$'
      description: ISO 4217; every price list in force today is USD
    CostGroup:
      type: object
      required: [key, label, total]
      properties:
        key: { type: string, description: 'The group''s value (a service, type, account id, region, cost centre or tag value); `__none` for resources without the tag, `__other` for the groups past `top`' }
        label: { type: string, description: 'What to show: the account''s name for an account, "No <key> tag", "Other"' }
        total: { type: number }
    CostPoint:
      type: object
      required: [start, total, groups]
      properties:
        start: { type: string, format: date, description: 'The day, or the first of the month' }
        total: { type: number }
        groups:
          type: object
          description: The point's amount per group key of `groups`
          additionalProperties: { type: number }
        provisional: { type: boolean, description: 'The point holds today, which is still open' }
    Forecast:
      type: object
      required: [monthEnd, low, high, method]
      properties:
        month: { type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$' }
        monthToDate: { type: number }
        monthEnd: { type: number, description: The month's expected total }
        low: { type: number }
        high: { type: number }
        method: { type: string, enum: [run-rate], description: 'Month to date plus the current run rate for the days left; the band is two standard deviations of the last 14 closed days'' change' }
    CostReport:
      type: object
      required: [currency, from, to, granularity, total, groups, series, runRate, asOf, source, unpriced]
      properties:
        currency: { $ref: '#/components/schemas/Currency' }
        from: { type: string, format: date }
        to: { type: string, format: date }
        granularity: { type: string, enum: [day, month] }
        groupBy: { type: string }
        total: { type: number }
        groups:
          type: array
          description: Largest first; empty without groupBy
          items: { $ref: '#/components/schemas/CostGroup' }
        series:
          type: array
          items: { $ref: '#/components/schemas/CostPoint' }
        forecast: { $ref: '#/components/schemas/Forecast' }
        runRate:
          type: object
          required: [monthly]
          description: What the resources the filters select cost a month at today's rates
          properties:
            monthly: { type: number }
            resources: { type: integer, description: How many charged resources make it up }
        asOf: { type: string, format: date-time, description: 'How fresh the numbers are: the newest change the ledger has applied' }
        closedThrough: { type: string, format: date, description: The last closed day; later points are provisional }
        source: { type: string, enum: [list-prices], description: 'Priced from the platform''s price lists' }
        unpriced:
          type: object
          required: [resources]
          description: Charged resources the filters select that no price covers, today
          properties:
            resources: { type: integer }
            types:
              type: array
              items: { type: string }
        accounts:
          type: array
          description: With groupBy account or costCentre, the accounts named, with their names and cost centres
          items:
            type: object
            required: [accountId]
            properties:
              accountId: { $ref: '#/components/schemas/AccountId' }
              name: { type: string }
              costCentre: { type: string }
    PriceRule:
      type: object
      required: [priceList, provider, action]
      properties:
        priceList: { type: string }
        provider: { type: string }
        action: { type: string }
        by: { type: string, description: 'The attribute whose value picks the price, when the price depends on one' }
        value: { description: The attribute's value the price was picked by }
    ResourceCost:
      type: object
      required: [wfrn, accountId, type, service, charged, monthly, monthToDate, currency, source]
      properties:
        wfrn: { $ref: '#/components/schemas/Wfrn' }
        accountId: { $ref: '#/components/schemas/AccountId' }
        type: { type: string }
        service: { type: string }
        state: { type: string }
        charged: { type: boolean, description: 'Whether the resource is charged now (it exists at the provider)' }
        monthly: { type: number, description: 'Its monthly rate now; 0 when not charged or unpriced' }
        monthToDate: { type: number }
        currency: { $ref: '#/components/schemas/Currency' }
        since: { type: string, format: date-time, description: When the current rate started }
        source: { type: string, enum: [list-prices, unpriced] }
        rule: { $ref: '#/components/schemas/PriceRule' }
        pricedFrom: { type: string, enum: [observed, desired], description: 'Whether the attribute came from the provider''s last observation or the desired attributes' }
        history:
          type: array
          description: The rates of the last 13 months, newest first
          items:
            type: object
            required: [from, monthly]
            properties:
              from: { type: string, format: date-time }
              to: { type: string, format: date-time }
              monthly: { type: number }
    PriceList:
      type: object
      required: [name, currency, prices, version]
      properties:
        name: { type: string }
        title: { type: string }
        currency: { $ref: '#/components/schemas/Currency' }
        version: { type: string, description: The platform content version it was read at }
        prices:
          type: array
          items:
            type: object
            required: [provider, action, monthly]
            properties:
              provider: { type: string }
              action: { type: string }
              by: { type: string }
              monthly:
                description: A flat monthly price, or a price per value of `by`
                oneOf:
                  - type: number
                  - type: object
                    additionalProperties: { type: number }
    PriceBinding:
      type: object
      required: [type, priceList, provider, action]
      description: "A type's `cost` block (P-06 as extended by P-22): which price prices its resources"
      properties:
        type: { type: string }
        priceList: { type: string }
        provider: { type: string }
        action: { type: string }
        by: { type: string, description: The resource attribute whose value is looked up in the price's map }
    BudgetScope:
      type: object
      required: [accountId]
      properties:
        accountId: { $ref: '#/components/schemas/AccountId' }
        tag:
          type: object
          description: Only resources with this tag value count
          required: [key, value]
          properties:
            key: { type: string, pattern: '^[a-z0-9-]{1,32}$' }
            value: { type: string, maxLength: 256 }
    BudgetInput:
      type: object
      required: [name, amount]
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        scope: { $ref: '#/components/schemas/BudgetScope', description: 'On create only; accountId defaults to the caller''s' }
        amount: { type: number, exclusiveMinimum: 0, maximum: 1000000000, description: The monthly amount }
        currency: { $ref: '#/components/schemas/Currency' }
        thresholds:
          type: array
          description: Percentages of the amount that send an alert, at most once each a month
          minItems: 1
          maxItems: 5
          uniqueItems: true
          default: [80, 100]
          items: { type: integer, minimum: 1, maximum: 1000 }
        blockCreates: { type: boolean, default: false, description: 'Refuse creates in its scope while it is over' }
    BudgetStatus:
      type: object
      required: [period, amount, spent, forecast, percent, state, alertsSent]
      properties:
        period: { type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$' }
        amount: { type: number, description: The amount in force for the period }
        spent: { type: number }
        forecast: { type: number, description: The month's expected total; equal to spent for a closed month }
        percent: { type: number, description: spent / amount × 100 }
        forecastPercent: { type: number }
        state: { type: string, enum: [ok, forecast-over, over] }
        alertsSent:
          type: array
          description: The thresholds crossed this period, in the order they were crossed
          items: { type: integer }
        asOf: { type: string, format: date-time }
    Budget:
      type: object
      required: [budgetId, name, scope, amount, currency, thresholds, blockCreates, version, createdAt, status]
      properties:
        budgetId: { type: string }
        name: { type: string }
        scope: { $ref: '#/components/schemas/BudgetScope' }
        amount: { type: number }
        currency: { $ref: '#/components/schemas/Currency' }
        thresholds:
          type: array
          items: { type: integer }
        blockCreates: { type: boolean }
        version: { type: integer }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        status: { $ref: '#/components/schemas/BudgetStatus' }
    ChargebackRow:
      type: object
      required: [costCentre, accountId, service, amount]
      properties:
        costCentre: { type: string }
        accountId: { $ref: '#/components/schemas/AccountId' }
        accountName: { type: string }
        service: { type: string }
        tag:
          type: object
          properties:
            key: { type: string }
            value: { type: string }
        amount: { type: number }
    ChargebackReport:
      type: object
      required: [month, currency, final, total, rows, generatedAt]
      properties:
        month: { type: string }
        currency: { $ref: '#/components/schemas/Currency' }
        final: { type: boolean, description: 'The month is closed and was published to finance' }
        total: { type: number }
        rows:
          type: array
          description: By cost centre, account, service and tag value
          items: { $ref: '#/components/schemas/ChargebackRow' }
        generatedAt: { type: string, format: date-time }
        sha256: { type: string, description: "For a final month, the sha256 of the published CSV of every account" }
    ConsoleBudget:
      allOf:
        - $ref: '#/components/schemas/Budget'
        - type: object
          required: [can]
          properties:
            can:
              type: object
              required: [update, delete]
              properties:
                update: { type: boolean }
                delete: { type: boolean }
    DeviceAuthorization:
      type: object
      description: RFC 8628 §3.2
      required: [device_code, user_code, verification_uri, verification_uri_complete, expires_in, interval]
      properties:
        device_code: { type: string, description: 'The CLI''s secret for polling; 32 random bytes, base64url' }
        user_code: { type: string, pattern: '^[BCDFGHJKLMNPQRSTVWXZ]{4}-[BCDFGHJKLMNPQRSTVWXZ]{4}$' }
        verification_uri: { type: string, description: 'The web app''s #/device page' }
        verification_uri_complete: { type: string, description: The page with the code filled in }
        expires_in: { type: integer, examples: [600] }
        interval: { type: integer, description: Seconds between polls, examples: [5] }
    DeviceGrant:
      type: object
      required: [userCode, clientId, status, requestedAt, expiresAt]
      properties:
        userCode: { type: string }
        clientId: { type: string, enum: [console-cli, console-sdk] }
        status: { type: string, enum: [pending, approved, denied, expired] }
        requestedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        requestedFrom:
          type: object
          description: Where the CLI asked from, so the person can tell it is theirs
          properties:
            ip: { type: string }
            userAgent: { type: string }
        decidedAt: { type: string, format: date-time }
    ApiTokenRequest:
      type: object
      required: [grant_type, client_id]
      properties:
        grant_type:
          type: string
          enum: ['urn:ietf:params:oauth:grant-type:device_code', refresh_token]
        client_id: { type: string, enum: [console-cli, console-sdk] }
        device_code: { type: string, description: With the device grant }
        refresh_token: { type: string, description: With the refresh grant }
    ApiToken:
      type: object
      required: [access_token, token_type, expires_in, refresh_token, refresh_expires_in, scope]
      properties:
        access_token: { type: string, description: 'The access token, a JWT (typ at+jwt, aud console-api)' }
        token_type: { type: string, enum: [Bearer] }
        expires_in: { type: integer, description: Seconds the access token lives, examples: [900] }
        refresh_token: { type: string, description: 'Rotates on every refresh; a rotated one presented again ends the API session' }
        refresh_expires_in: { type: integer, description: 'Seconds until the API session ends, whatever the refreshes' }
        scope: { type: string, enum: [console] }
    ApiSession:
      type: object
      description: A CLI or SDK signed in with the device grant
      required: [id, clientId, createdAt, expiresAt]
      properties:
        id: { type: string, pattern: '^aps_[0-9a-z]{26}$' }
        clientId: { type: string, enum: [console-cli, console-sdk] }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        accountId: { $ref: '#/components/schemas/AccountId' }
        region: { $ref: '#/components/schemas/RegionName' }
        userAgent: { type: string }
        ip: { type: string }
    ChatLink:
      type: object
      required: [id, platform, workspaceId, chatUserId, linkedAt]
      properties:
        id: { type: string }
        platform: { type: string, enum: [slack, teams] }
        workspaceId: { type: string, description: 'The Slack team or the Teams tenant' }
        chatUserId: { type: string }
        chatUserName: { type: string }
        linkedAt: { type: string, format: date-time }
    NotificationKind:
      type: string
      enum: [job.succeeded, job.failed, job.needs-attention, approval.requested, approval.decided, access-request.created, access-request.decided, drift.found, quota.near-limit, budget.alert, digest.ready]
    NotificationChannel:
      type: string
      enum: [console, email, slack, teams]
    Notification:
      type: object
      required: [id, kind, severity, title, accountId, link, createdAt]
      properties:
        id: { type: string }
        kind: { $ref: '#/components/schemas/NotificationKind' }
        severity: { type: string, enum: [info, warning, critical] }
        title: { type: string }
        body: { type: string }
        accountId: { $ref: '#/components/schemas/AccountId' }
        region: { $ref: '#/components/schemas/RegionName' }
        wfrn: { $ref: '#/components/schemas/Wfrn' }
        jobId: { type: string }
        link: { type: string, description: 'The console path it opens, such as /r/<type>/<wfrn> or /jobs/<jobId>; absolute in emails and chat' }
        createdAt: { type: string, format: date-time }
        readAt: { type: string, format: date-time }
    NotificationSettings:
      type: object
      required: [version, channels, rules]
      properties:
        version: { type: integer }
        channels:
          type: object
          required: [email, slack, teams]
          properties:
            email:
              type: object
              required: [enabled]
              properties:
                address: { type: string, readOnly: true, description: 'The identity provider''s address; never set here' }
                enabled: { type: boolean }
            slack: { $ref: '#/components/schemas/LinkedChannel' }
            teams: { $ref: '#/components/schemas/LinkedChannel' }
        rules:
          type: object
          description: 'Per kind, the channels it goes to; a kind left out takes its default (console for every kind; email, and Slack or Teams once linked, for job.failed, job.needs-attention, approval.requested, access-request.created, access-request.decided, budget.alert and digest.ready)'
          propertyNames: { $ref: '#/components/schemas/NotificationKind' }
          additionalProperties:
            type: array
            uniqueItems: true
            items: { $ref: '#/components/schemas/NotificationChannel' }
    LinkedChannel:
      type: object
      required: [linked, enabled]
      properties:
        linked: { type: boolean, readOnly: true, description: Whether the person linked a chat identity (ChatOps) }
        enabled: { type: boolean }
    RecentVisit:
      type: object
      required: [kind, key, title, visitedAt]
      properties:
        kind: { type: string, enum: [type, resource] }
        key: { type: string, description: 'A type key, or a wfrn' }
        title: { type: string }
        visitedAt: { type: string, format: date-time }
    Favourite:
      type: object
      required: [wfrn, type, name, addedAt]
      properties:
        wfrn: { $ref: '#/components/schemas/Wfrn' }
        type: { type: string }
        name: { type: string }
        addedAt: { type: string, format: date-time }
    DigestSummary:
      type: object
      required: [weekStart, headline, generatedAt]
      properties:
        weekStart: { type: string, format: date }
        headline: { type: string }
        generatedAt: { type: string, format: date-time }
    Digest:
      type: object
      description: 'One account''s week, Monday to Sunday (UTC), written every Monday at 06:00 UTC by the copilot, or by a template without it'
      required: [accountId, weekStart, weekEnd, generatedAt, source, headline, sections]
      properties:
        accountId: { $ref: '#/components/schemas/AccountId' }
        weekStart: { type: string, format: date }
        weekEnd: { type: string, format: date }
        generatedAt: { type: string, format: date-time }
        source: { type: string, enum: [assistant, rules] }
        headline: { type: string }
        sections:
          type: array
          items:
            type: object
            required: [kind, title, text]
            properties:
              kind: { type: string, enum: [changes, drift, cost, access] }
              title: { type: string }
              text: { type: string }
              facts: { type: object, additionalProperties: true, description: The numbers the text was written from }
              highlights:
                type: array
                items:
                  type: object
                  required: [text]
                  properties:
                    text: { type: string }
                    link: { type: string }
