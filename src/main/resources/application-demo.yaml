# The demo: the fake platform runs inside this JVM on its own port, seeded with the two console
# accounts, and a stand-in of the state service (fed from the fake's registry) answers the state
# calls unless console.state.mode=http points at a running state service. Dev headers stand in for
# the BFF's JWT. The loops run fast so a change in the recorded world shows within seconds.
console:
  demo:
    platform-port: 18090
    step-delay: 250ms
  auth:
    dev-headers: true
    authorization: roles   # no identity service in the demo: the caller's managed roles decide its writes
  state:
    mode: embedded
  # the demos keep the dev headers (hub decision 23): X-Console-Service names this service
  service-tokens:
    mode: dev-headers
  scorecards:
    snapshot-interval: 30s
  drift:
    tiers:
      hot: 10s
      warm: 30s
      cold: 60s
    scan:
      # the fake's single reads (vm.get) answer a fixed sample for small VMs, its pages the
      # recorded world: the demo reads every shard by page so only real changes show as drift
      list-threshold: 1
      in-flight-retry: 2s
      error-retry: 5s
    loop:
      interval: 2s
    sync:
      interval: 3s
    follower:
      interval: 1s
    webhooks:
      vsphere:
        secret: demo-vsphere-webhook-secret

---
# Monitoring and rightsizing in the demo: the fake platform's types have no metrics read, so the
# demo makes up CPU, memory and disk series for its VMs (two idle, one oversized, one busy), and the
# utilisation pass wakes soon after the start, so recommendations show within a minute.
console:
  monitoring:
    metrics:
      mode: demo
      demo:
        types: [vm]
        idle: [batch-01, shop-01]
        oversized: [web-02]
        busy: [cache-01]
    alarms:
      interval: 30s
    rightsizing:
      interval: 1h
      check-interval: 10m
      initial-delay: 20s
