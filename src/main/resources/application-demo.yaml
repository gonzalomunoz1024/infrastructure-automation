# The demo: everything in one JVM. The platform is platform-fake on port 18090, the identity
# provider is the built-in /demo-idp with a user picker (login_hint skips it), and the identity
# service, the state service, the search indexer, the cost service and the drift service's
# scorecards are built-in stand-ins under /demo-identity, /demo-state, /demo-search, /demo-cost
# and /demo-drift. Sign in at http://localhost:18081/auth/login.
console:
  oidc:
    issuer: http://localhost:18081/demo-idp
    client-id: console
    redirect-uri: http://localhost:18081/auth/callback
  session:
    secure: false
  organization:
    admin-groups: [console-org-admins]   # gonzalo's sign-in carries it
  identity:
    url: ""
  state:
    url: ""
  search:
    url: ""
  cost:
    url: ""
  drift:
    url: ""
  platform:
    fake:
      enabled: true
      port: 18090
      step-delay: 250ms
  live:
    relay:
      enabled: true
  tags:
    accounts:
      "123456789012":
        cost-centre: cc-1001
      "210987654321":
        cost-centre: cc-2001
  insights:
    baseline:                       # a made-up ticket export, so the demo's executive home shows hours saved
      source: "Demo ticket export, September 2026"
      lead-time: 3d
      by-workflow:
        create-vm: 5d
        vm-restart: 4h
        update-vm: 1d
logging:
  level:
    com.iaf.console.bff: info
