# The identity service's defaults. Profiles: mongo (MongoDB instead of memory), kafka (the outbox
# relay publishes to Kafka), opa (decisions come from an OPA holding this service's bundle), vault
# (platform service account tokens in Vault), demo (dev headers, the demo seed, platform-fake on
# 18090), fake (platform-fake embedded in this process).
# 18083: the state service has 18082, the BFF 18081 and platform-fake-app 18090.
server:
  port: ${CONSOLE_IDENTITY_PORT:18083}

spring:
  application:
    name: console-identity-service
  jackson:
    default-property-inclusion: non_null
  # the stores are in memory unless the mongo profile is on, which turns these back on
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration
      - org.springframework.boot.autoconfigure.mongo.MongoReactiveAutoConfiguration
      - org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration
      - org.springframework.boot.autoconfigure.data.mongo.MongoReactiveDataAutoConfiguration
      - org.springframework.boot.autoconfigure.data.mongo.MongoReactiveRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.data.mongo.MongoRepositoriesAutoConfiguration

console:
  identity:
    partition: wf
    region: global
    platform:
      base-url: http://localhost:18090
      # admin-token: the console's admin service account (P-03); without it the dev header names the user
      dev-user: gonzalo
      catalog-refresh: 5m
    auth:
      issuer: console-bff
      # its own name only (hub decision 23): a token the BFF minted for another service is refused here
      audiences: [console-identity-service]
      # jwks or jwks-uri: the BFF's signing keys; the demo profile points at the BFF's JWKS endpoint
      jwks-refresh: 5m
      max-lifetime: 1h
      skew: 30s
      dev-headers: false
      # bundle-token: what OPA presents for GET /internal/opa/bundles/console-authz.tar.gz
    authz:
      opa-url: http://localhost:8181
      cache-ttl: 2s
    vault:
      base-url: http://localhost:8200
      mount: secret
      path-prefix: console/accounts
    quotas:
      # who decides an increase no rule approves: the platform team, with the internal :decide (decision 22)
      approver: platform-team
      # the first rule that covers the key and the ask approves an increase at once; a rule's
      # approval of an account's key starts the cooldown of every rule for that key
      auto-approval:
        - name: resources-double
          keys: ["resources.*"]
          max-factor: 2
          max-limit: 1000
          cooldown: 30d
        - name: access-keys-double
          keys: [access-keys]
          max-factor: 2
          max-limit: 100
          cooldown: 30d
        - name: jobs-half-again
          keys: [jobs-per-minute]
          max-factor: 1.5
          max-limit: 600
          cooldown: 7d
    lifecycle:
      # the identity provider group sync (also POST /internal/v1/group-sync:run): a Spring cron expression in its zone
      group-sync:
        enabled: true
        cron: "0 0 2 * * *"
        zone: UTC
    elevations:
      # how long an ask lasts when it names none, and at most; break-glass access lasts at most 4 hours
      default-minutes: 60
      max-minutes: 480
      break-glass-max-minutes: 240
      # an ask nobody decided expires after this; the sweep also stores ended elevations expired
      pending-for: 24h
      sweep-every: 1m
      # the first rule that covers the role, the person's roles and the duration approves an ask at once.
      # None by default, so every elevation waits for a person: a rule that grants account-admin lets
      # its requesters make the role permanent (an admin can change any group), so add one knowingly.
      auto-approval: []
  outbox:
    relay:
      enabled: true
      interval: 1s
  platform-fake:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.iaf.console: info
