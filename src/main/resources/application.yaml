# console-drift-service. Profiles: `mongo` stores in MongoDB (else in memory), `kafka` publishes the
# outbox to Kafka and follows the state service's `state.resources` topic (else the outbox stays
# in memory and the inventory is synced from the state service's list alone), `temporal` runs the
# shard loops as Temporal workflows (else as loops inside this process), `demo` embeds the fake
# platform and a stand-in of the state service in this JVM and accepts dev headers.
server:
  port: 18084

spring:
  application:
    name: console-drift-service
  autoconfigure:
    # the kit's MongoDB handle is wired under the mongo profile; without it Boot's client stays off
    exclude:
      - org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration
      - org.springframework.boot.autoconfigure.mongo.MongoReactiveAutoConfiguration
      - org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration
      - org.springframework.boot.autoconfigure.data.mongo.MongoReactiveDataAutoConfiguration
      - org.springframework.boot.autoconfigure.data.mongo.MongoReactiveRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.data.mongo.MongoRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

console:
  region: global
  wfrn:
    partition: wf
  drift:
    shards: 64
    tiers:
      hot: 15m            # changed in the last 24 hours, in production, or drifted lately
      warm: 1h            # the type's observe.interval when it has one
      cold: 24h           # untouched for 30 days and never drifted
      recent-change: 24h
      drifted-for: 7d
      cold-after: 30d
    scan:
      page-size: 500      # the platform's largest observe-list page (P-09)
      batch-size: 100     # the platform's largest resources:observe batch
      list-threshold: 20  # a list never walked is walked once this many of its resources are due (across the shards)
      max-per-scan: 5000
      observation-refresh: 24h
      in-flight-retry: 1m # a resource with a change in flight is looked at again after this
      error-retry: 5m     # and one whose read failed
    budget:
      observe-per-minute: 300   # the platform's observe bucket per provider and region (P-09)
      burst: 50
      account-share: 0.25
      providers: {}             # <provider>: { observe-per-minute, burst }, as its spec.limits raise them
    loop:
      enabled: true
      interval: 30s
    sync:
      interval: 60s
      accounts-refresh: 5m
      accounts: []
    follower:
      interval: 5s
    idempotency-ttl: 24h
    types-ttl: 60s
    webhooks: {}          # <provider>: { secret: ... }
  state:
    mode: http            # http (the state service) or embedded (the demo's stand-in)
    base-url: http://localhost:18082
    timeout: 30s
  identity:
    base-url: http://localhost:18083
    timeout: 10s
  # monthly costs of unmanaged objects (WP 5.3) and of resources to rightsize (WP 9.22): the cost
  # service's list-price estimates (POST /v1/cost:estimate, audience console-cost-service) at
  # base-url, or, with base-url empty, this price list per type: a base a month, a rate per unit of
  # a numeric attribute, and the attribute whose value picks a price. Keys with capitals are
  # bracketed so they bind as written.
  cost:
    base-url: ""
    timeout: 5s
    currency: USD
    basis: list-prices
    prices:
      vm:
        monthly: 5.00
        per:
          cpu: 14.60
          "[memoryGb]": 3.65
      database:
        by: tier
        choices:
          "[M10]": 57.00
          "[M30]": 388.00
      volume:
        per:
          "[sizeGb]": 0.10
  # how this service names itself to the state and identity services (hub decision 23): a service
  # token from the BFF, authenticated by the pod's projected service-account token (assertion-file,
  # in a cluster) or by a JWT signed with this service's own registered EC key (signing-key-file,
  # a PKCS#8 PEM, anywhere else); never a static token. dev-headers is for the demos.
  service-tokens:
    mode: bff
    token-url: http://localhost:18081/internal/v1/token
    client-id: console-drift-service
    assertion-file: ${CONSOLE_SERVICE_ASSERTION_FILE:}
    signing-key-file: ${CONSOLE_SERVICE_KEY_FILE:}
    key-id: ${CONSOLE_SERVICE_KEY_ID:}
    refresh-before: 60s   # a token is fetched again this long before it ends
    timeout: 10s
  platform:
    base-url: http://localhost:18090
    token: ${CONSOLE_PLATFORM_TOKEN:}
    timeout: 30s
    account-tokens: {}    # <accountId>: <token>, for a dev box without the identity service
  auth:
    jwks-uri: http://localhost:18081/.well-known/jwks.json
    jwks-timeout: 10s     # a slower fetch of the BFF's keys fails; the next request fetches again
    issuer: console-bff
    audiences: [console-drift-service, console]
    dev-headers: false
  temporal:
    target: localhost:7233
    namespace: default
    task-queue: console-drift
    iterations: 96        # loop turns before a workflow continues as new
  kafka:
    bootstrap-servers: localhost:9092
    group-id: console-drift-service
    topics: [state.resources]
  outbox:
    relay:
      enabled: true
      interval: 1s
    kafka:
      # the service kit's producer of drift.findings (kafka profile): the consumer's cluster
      bootstrap-servers: ${console.kafka.bootstrap-servers}
      client-id: console-drift-service

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.iaf.console: info

---
# Monitoring and rightsizing (WP 9.21, 9.22), in their own document so the drift settings above stay
# as they are. Series come from each type's metrics read (P-09 observe.metrics) with the account's own
# platform credential, under the observe budget above; the demo profile makes them up instead.
console:
  monitoring:
    metrics:
      mode: platform      # platform (the type's metrics read) or demo (made-up series, demo only)
      max-range: 92d      # GET /v1/metrics: the longest range one read may ask for
      max-steps: 5000     # and the most steps it may hold
    alarms:
      enabled: true
      interval: 1m        # every alarm is evaluated this often (the contract says every minute)
      concurrency: 4      # resources read at once by one evaluation
    rightsizing:
      enabled: true
      interval: 24h       # each resource's utilisation is read once in this
      check-interval: 1h  # the loop wakes this often and reads the resources whose turn has come
      initial-delay: 1m   # the first wake after a start
      window: 14d         # how far back a read reaches (only since the resource's last change of size)
      step: 1h            # one point per this
      min-history: 7d     # the points a judgement needs, at that step (168)
      idle-cpu: 5         # 95th percentiles in percent: both under these is idle (delete)
      idle-memory: 10
      oversized-cpu: 20   # under one of these shrinks that dimension
      oversized-memory: 30
      target-p95: 60      # to the smallest allowed size that keeps its 95th percentile under this
      cpu-series: cpuPercent
      memory-series: memoryPercent
      cpu-field: cpu      # the size fields a resize sets
      memory-field: memoryGb
      min-cpu: 1          # a size without allowed values is halved down to these
      min-memory: 2
      concurrency: 4      # resources read at once by one pass
