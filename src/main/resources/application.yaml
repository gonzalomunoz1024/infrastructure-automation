# console-cost-service. Profiles: `mongo` keeps the ledger, budgets and published months in MongoDB
# (else in memory), `kafka` reads state.resources and identity.changes from Kafka and publishes
# cost.events there (else the state service's lists are polled and events stay in memory), `demo`
# accepts dev headers, prices from the bundled lists and talks to the demo state service.
server:
  port: 18086

spring:
  application:
    name: console-cost-service
  jackson:
    default-property-inclusion: non_null
  autoconfigure:
    # the kit's MongoDB handle is wired under the mongo profile; without it Boot's client stays off
    exclude:
      - org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration
      - org.springframework.boot.autoconfigure.mongo.MongoReactiveAutoConfiguration
      - org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration
      - org.springframework.boot.autoconfigure.data.mongo.MongoReactiveDataAutoConfiguration
      - org.springframework.boot.autoconfigure.data.mongo.MongoReactiveRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.data.mongo.MongoRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

console:
  region: global
  pricing:
    # platform: the price lists and the types' bindings over P-22; bundled: the copy in this jar
    source: ${CONSOLE_PRICING_SOURCE:platform}
    refresh: 5m
  ledger:
    close-grace: 30m
    close-interval: 5m
    repair-interval: 1m
    backfill-days: 0
    demo-spread-days: 0
  budgets:
    evaluate-interval: 5m
  chargeback:
    interval: 30m
    export: ${CONSOLE_CHARGEBACK_EXPORT:log}
    webhook-url: ${CONSOLE_CHARGEBACK_WEBHOOK_URL:}
  state:
    url: ${CONSOLE_STATE_URL:http://localhost:18082}
    dev-headers: false
    timeout: 30s
  platform:
    base-url: ${CONSOLE_PLATFORM_URL:http://localhost:18090}
    token: ${CONSOLE_PLATFORM_TOKEN:}
    dev-user: ${CONSOLE_PLATFORM_DEV_USER:}
  identity:
    url: ${CONSOLE_IDENTITY_URL:}
    cache-ttl: 5m
  ingest:
    enabled: true
    kafka:
      bootstrap-servers: ${CONSOLE_KAFKA_BOOTSTRAP:localhost:9092}
      group-id: console-cost-service
      topics: [state.resources, identity.changes]
    poll:
      interval: 5s
  auth:
    jwks-uri: http://localhost:18081/.well-known/jwks.json
    issuer: console-bff
    audiences: [console-cost-service, console]
    dev-headers: false
    # this service's own tokens for the state and identity services come from the BFF (hub decision
    # 23), asked for with the pod's projected service-account token (the file) or, outside a cluster,
    # a JWT signed with this service's registered key (a private EC JWK with a kid)
    token-url: ${CONSOLE_AUTH_TOKEN_URL:http://localhost:18081/internal/v1/token}
    token-timeout: 5s
    client-assertion-file: ${CONSOLE_AUTH_CLIENT_ASSERTION_FILE:}
    client-key: ${CONSOLE_AUTH_CLIENT_KEY:}
  outbox:
    relay:
      enabled: true
      interval: 500ms
    kafka:
      bootstrap-servers: ${CONSOLE_KAFKA_BOOTSTRAP:localhost:9092}
      client-id: console-cost-service

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.iaf.console: info
