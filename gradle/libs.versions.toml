# The one place a version is written. Libraries the Spring Boot BOM manages have no version here:
# the BOM (spring-boot-dependencies, the same version as the platform's Spring Boot) decides.

[versions]
java = "21"
springBoot = "3.5.16"
springDependencyManagement = "1.1.7"
archunit = "1.4.1"
nimbusJoseJwt = "10.10"
jsonSchemaValidator = "1.5.8"

[libraries]
# plugins, as libraries, for build-logic's classpath
spring-boot-gradle-plugin = { module = "org.springframework.boot:spring-boot-gradle-plugin", version.ref = "springBoot" }
spring-dependency-management-plugin = { module = "io.spring.gradle:dependency-management-plugin", version.ref = "springDependencyManagement" }

# the BOM every module that uses Spring, Jackson or Reactor aligns on
spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "springBoot" }

# Spring
spring-boot-starter = { module = "org.springframework.boot:spring-boot-starter" }
spring-boot-starter-webflux = { module = "org.springframework.boot:spring-boot-starter-webflux" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-data-mongodb-reactive = { module = "org.springframework.boot:spring-boot-starter-data-mongodb-reactive" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-autoconfigure = { module = "org.springframework.boot:spring-boot-autoconfigure" }
spring-webflux = { module = "org.springframework:spring-webflux" }
spring-context = { module = "org.springframework:spring-context" }

# Jackson
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind" }
jackson-datatype-jsr310 = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jsr310" }
jackson-datatype-jdk8 = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jdk8" }
jackson-dataformat-yaml = { module = "com.fasterxml.jackson.dataformat:jackson-dataformat-yaml" }

# Reactor and Kafka
reactor-core = { module = "io.projectreactor:reactor-core" }
reactor-netty-http = { module = "io.projectreactor.netty:reactor-netty-http" }
reactor-test = { module = "io.projectreactor:reactor-test" }
reactor-kafka = { module = "io.projectreactor.kafka:reactor-kafka" }
kafka-clients = { module = "org.apache.kafka:kafka-clients" }

# MongoDB (the reactive driver, through Spring Data)
mongodb-driver-reactivestreams = { module = "org.mongodb:mongodb-driver-reactivestreams" }

# Observability
micrometer-core = { module = "io.micrometer:micrometer-core" }
micrometer-observation = { module = "io.micrometer:micrometer-observation" }
micrometer-tracing = { module = "io.micrometer:micrometer-tracing" }
micrometer-tracing-bridge-otel = { module = "io.micrometer:micrometer-tracing-bridge-otel" }
opentelemetry-exporter-otlp = { module = "io.opentelemetry:opentelemetry-exporter-otlp" }
micrometer-registry-prometheus = { module = "io.micrometer:micrometer-registry-prometheus" }
micrometer-context-propagation = { module = "io.micrometer:context-propagation" }

# Security and schemas
nimbus-jose-jwt = { module = "com.nimbusds:nimbus-jose-jwt", version.ref = "nimbusJoseJwt" }
json-schema-validator = { module = "com.networknt:json-schema-validator", version.ref = "jsonSchemaValidator" }

# Tests
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj-core = { module = "org.assertj:assertj-core" }
mockito-core = { module = "org.mockito:mockito-core" }
mockito-junit-jupiter = { module = "org.mockito:mockito-junit-jupiter" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
testcontainers-junit-jupiter = { module = "org.testcontainers:junit-jupiter" }
testcontainers-mongodb = { module = "org.testcontainers:mongodb" }
testcontainers-kafka = { module = "org.testcontainers:kafka" }
slf4j-simple = { module = "org.slf4j:slf4j-simple" }

[bundles]
spring-test = ["spring-boot-starter-test", "reactor-test"]
testcontainers = ["testcontainers-junit-jupiter", "testcontainers-mongodb", "testcontainers-kafka"]

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "springDependencyManagement" }
