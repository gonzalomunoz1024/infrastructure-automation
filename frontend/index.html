<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='22' cy='50' r='12' fill='%23007aff'/%3E%3Ccircle cx='78' cy='26' r='12' fill='%23007aff'/%3E%3Ccircle cx='78' cy='74' r='12' fill='%23007aff'/%3E%3Cpath d='M34 50h16M50 50l17-17M50 50l17 17' fill='none' stroke='%23007aff' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Infrastructure Automation</title>
    <script>
      // apply the saved appearance before first paint so there is no flash
      (function () {
        try {
          var m = localStorage.getItem('atlas-theme');
          var dark = m === 'dark' || ((!m || m === 'system') && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
