# Local stack: a Temporal dev server (with its UI), the backend running the interpreter on it,
# and the frontend served by Vite.
#
#   docker compose up temporal temporal-ui        just Temporal, then scripts/dev.sh --temporal
#   docker compose up                              everything: app on :3000, api on :8080, Temporal UI on :8233
services:
  temporal:
    image: temporalio/temporal:1.4.1
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--db-filename", "/data/temporal.db", "--headless"]
    ports:
      - "7233:7233"
    volumes:
      - temporal-data:/data
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "localhost:7233"]
      interval: 5s
      timeout: 3s
      retries: 20

  temporal-ui:
    # the Temporal web UI on :8233, as a deployment runs it; each job's "Open in Temporal" link lands here
    image: temporalio/ui:2.54.1
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports:
      - "8233:8080"
    depends_on:
      temporal:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: demo,temporal
      PLATFORM_TEMPORAL_TARGET: temporal:7233
      PLATFORM_TEMPORAL_UI_URL: http://localhost:8233
      PLATFORM_CONTENT_DIR: /content
    volumes:
      - ./workflows:/content/workflows:ro
      - ./providers:/content/providers:ro
      - ./resource-types:/content/resource-types:ro
    ports:
      - "8080:8080"
    depends_on:
      temporal:
        condition: service_healthy

  frontend:
    # the production build behind nginx, which proxies /api and /ws to the backend (scripts/dev.sh for hot reload)
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      API_UPSTREAM: http://backend:8080
    ports:
      - "3000:8080"
    depends_on:
      - backend

  ip-pool-worker:
    # the Go SDK's example provider worker: ip-pool's actions on task queue provider-ip-pool
    build:
      context: ./sdk/go
      dockerfile: examples/ip-pool/Dockerfile
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    depends_on:
      temporal:
        condition: service_healthy

  dns-records-worker:
    # the Python SDK's example provider worker: dns-records' actions on task queue provider-dns-records
    build:
      context: ./sdk/python
      dockerfile: examples/dns_records/Dockerfile
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    depends_on:
      temporal:
        condition: service_healthy

volumes:
  temporal-data:
  frontend-modules:
