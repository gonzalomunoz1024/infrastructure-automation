# The customer console, every service together, for the full-system journey (journey/).
#
# Started by ./e2e.sh, which builds the console-e2e/* images from the commits in services.lock and
# writes .work/env/*.env (fresh dev keys, and the platform token platform-fake logs at boot) first.
# Every console service runs its production profiles (mongo, kafka, and opa or temporal where it has
# them); none runs a demo profile or an in-memory stand-in. Ports are published on 127.0.0.1 only.
name: console-e2e

x-java: &java
  restart: "no"
  stop_grace_period: 20s
  environment: &java-env
    SPRING_CONFIG_ADDITIONAL_LOCATION: optional:file:/e2e/config/
    JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70 -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -Xss512k -Djava.security.egd=file:/dev/./urandom

services:
  # ------------------------------------------------------------------ infrastructure
  mongo:
    image: mongo:7
    command: ["--quiet", "--wiredTigerCacheSizeGB", "0.25"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 3s
      timeout: 5s
      retries: 40

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 15s
      retries: 30

  # the topics of the platform's feed (P-01) and of the console's own events, made before anyone reads
  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka: { condition: service_healthy }
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        for t in platform.jobs platform.resources platform.content platform.audit state.resources drift.findings drift.scorecards identity.changes cost.events; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic "$$t" --partitions 3 --replication-factor 1
        done
    restart: "no"

  opensearch:
    image: opensearchproject/opensearch:2.19.6
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
      # one throwaway node: never refuse an index because the build machine's disk is full-ish
      cluster.routing.allocation.disk.threshold_enabled: "false"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=2s' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 60

  temporal-db:
    image: postgres:16-alpine
    environment:
      # dev only: the database lives for one run
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 3s
      timeout: 5s
      retries: 40

  temporal:
    image: temporalio/auto-setup:1.27.2
    depends_on:
      temporal-db: { condition: service_healthy }
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: temporal-db
      DEFAULT_NAMESPACE: default
    healthcheck:
      test: ["CMD-SHELL", "temporal operator namespace describe --address temporal:7233 default >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 60

  opa:
    # the -debug variant is the same OPA with a shell, for the health check
    image: openpolicyagent/opa:1.9.0-debug
    command: ["run", "--server", "--addr", "0.0.0.0:8181", "--config-file", "/e2e/config/config.yaml", "--log-level", "info"]
    env_file: [.work/env/opa.env]
    volumes:
      - ./config/opa:/e2e/config:ro
    ports: ["127.0.0.1:8181:8181"]
    healthcheck:
      # 200 once the identity service's bundle is active
      test: ["CMD-SHELL", "wget -qO- 'http://localhost:8181/health?bundles' >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 100

  # the dev SSO (config/dex/config.yaml): the browser reaches it as http://dex:5556 too
  dex:
    image: dexidp/dex:v2.41.1
    command: ["dex", "serve", "/e2e/config/config.yaml"]
    volumes:
      - ./config/dex:/e2e/config:ro
    ports: ["127.0.0.1:5556:5556"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5556/dex/.well-known/openid-configuration >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 40

  # ------------------------------------------------------------------ the platform
  platform-fake:
    <<: *java
    image: console-e2e/platform-fake-app:local
    env_file: [.work/env/platform-fake.env]
    volumes:
      - ./config/platform-fake:/e2e/config:ro
    ports: ["127.0.0.1:18090:18090"]
    mem_limit: 640m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:18090/actuator/health | grep -q UP"]
      interval: 3s
      timeout: 3s
      retries: 80

  platform-feed-bridge:
    image: console-e2e/platform-feed-bridge:local
    depends_on:
      kafka-init: { condition: service_completed_successfully }
      platform-fake: { condition: service_healthy }
    env_file: [.work/env/platform-feed-bridge.env]
    environment:
      PLATFORM_URL: http://platform-fake:18090
      KAFKA_BROKERS: kafka:9092
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 60

  # ------------------------------------------------------------------ console services
  identity:
    <<: *java
    image: console-e2e/console-identity-service:local
    depends_on:
      mongo: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
      platform-fake: { condition: service_healthy }
    environment:
      <<: *java-env
      SPRING_PROFILES_ACTIVE: mongo,kafka,opa
    env_file: [.work/env/identity.env]
    volumes:
      - ./config/identity:/e2e/config:ro
    ports: ["127.0.0.1:18083:18083"]
    mem_limit: 768m
    healthcheck: &spring-health
      test: ["CMD-SHELL", "wget -qO- http://localhost:18083/actuator/health/readiness | grep -q UP"]
      interval: 3s
      timeout: 3s
      retries: 100

  state:
    <<: *java
    image: console-e2e/console-state-service:local
    depends_on:
      mongo: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
      platform-fake: { condition: service_healthy }
    environment:
      <<: *java-env
      SPRING_PROFILES_ACTIVE: mongo,kafka
    env_file: [.work/env/state.env]
    volumes:
      - ./config/state:/e2e/config:ro
    ports: ["127.0.0.1:18082:18082"]
    mem_limit: 768m
    healthcheck:
      <<: *spring-health
      test: ["CMD-SHELL", "wget -qO- http://localhost:18082/actuator/health/readiness | grep -q UP"]

  bff:
    <<: *java
    image: console-e2e/console-bff:local
    depends_on:
      mongo: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
      platform-fake: { condition: service_healthy }
      dex: { condition: service_healthy }
    environment:
      <<: *java-env
      SPRING_PROFILES_ACTIVE: mongo,kafka
    env_file: [.work/env/bff.env]
    volumes:
      - ./config/bff:/e2e/config:ro
    ports: ["127.0.0.1:18081:18081"]
    mem_limit: 768m
    healthcheck:
      <<: *spring-health
      test: ["CMD-SHELL", "wget -qO- http://localhost:18081/actuator/health/readiness | grep -q UP"]

  indexer:
    <<: *java
    image: console-e2e/console-search-indexer:local
    depends_on:
      mongo: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
      opensearch: { condition: service_healthy }
    environment:
      <<: *java-env
      SPRING_PROFILES_ACTIVE: mongo,kafka
    env_file: [.work/env/indexer.env]
    volumes:
      - ./config/indexer:/e2e/config:ro
    ports: ["127.0.0.1:18085:18085"]
    mem_limit: 640m
    healthcheck:
      <<: *spring-health
      test: ["CMD-SHELL", "wget -qO- http://localhost:18085/actuator/health/readiness | grep -q UP"]

  drift:
    <<: *java
    image: console-e2e/console-drift-service:local
    depends_on:
      mongo: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
      temporal: { condition: service_healthy }
    environment:
      <<: *java-env
      SPRING_PROFILES_ACTIVE: mongo,kafka,temporal
    env_file: [.work/env/drift.env]
    volumes:
      - ./config/drift:/e2e/config:ro
      - ./.work/keys/drift.pk8.pem:/e2e/keys/drift.pk8.pem:ro
    ports: ["127.0.0.1:18084:18084"]
    mem_limit: 768m
    healthcheck:
      <<: *spring-health
      test: ["CMD-SHELL", "wget -qO- http://localhost:18084/actuator/health/readiness | grep -q UP"]

  cost:
    <<: *java
    image: console-e2e/console-cost-service:local
    depends_on:
      mongo: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
    environment:
      <<: *java-env
      SPRING_PROFILES_ACTIVE: mongo,kafka
    env_file: [.work/env/cost.env]
    volumes:
      - ./config/cost:/e2e/config:ro
    ports: ["127.0.0.1:18086:18086"]
    mem_limit: 640m
    healthcheck:
      <<: *spring-health
      test: ["CMD-SHELL", "wget -qO- http://localhost:18086/actuator/health/readiness | grep -q UP"]

  # ------------------------------------------------------------------ the web app, live mode
  web:
    image: console-e2e/console-web:local
    depends_on:
      bff: { condition: service_started }
      platform-fake: { condition: service_started }
    volumes:
      - ./config/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["127.0.0.1:3000:3000"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 40
