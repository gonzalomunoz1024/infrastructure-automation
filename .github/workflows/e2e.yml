# The customer console's full-system journey (./e2e.sh): every console service at its commit in
# services.lock, the platform fake and the infrastructure in one docker compose stack, and the
# Playwright journey through console-web in live mode. The Playwright report, the JUnit results,
# the traces and, on a failure, every container's log are kept as the run's artifacts.
name: console-e2e

on:
  push:
    branches: [console-e2e]
  pull_request:
    branches: [console-e2e]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: console-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # this branch's history only (it is an orphan), every commit of it
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks:v8.21.2 git --redact --no-banner --log-opts=HEAD .

  journey:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Gradle and npm caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.npm
          key: console-e2e-${{ hashFiles('services.lock') }}
          restore-keys: console-e2e-
      - name: Playwright's browser and its system packages
        working-directory: journey
        run: npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: ./e2e.sh
        run: ./e2e.sh
      - name: The Playwright report, the results and the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: console-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
