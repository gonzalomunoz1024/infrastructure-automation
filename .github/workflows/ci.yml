name: CI

on:
  push:
  pull_request:

jobs:
  web:
    name: Web (Node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install workspaces
        run: npm ci
      - name: Verify the contracts pin
        run: npm run contracts:verify
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build

  e2e:
    name: Shell journey (Playwright, mock mode)
    runs-on: ubuntu-latest
    needs: web
    env:
      # the config keeps this value (??=), so the install and the run look in the same place
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pw-browsers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install workspaces
        run: npm ci
      - name: Install Chromium
        # only CI installs a browser; the development container ships one under /opt/pw-browsers
        run: npx playwright install --with-deps chromium
        working-directory: console
      - name: Run the journey
        run: npm run e2e
      - name: Keep the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            console/playwright-report
            console/test-results
          retention-days: 7

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false
      - name: Install gitleaks
        # the platform's pin: a release built from its module; the Go checksum database verifies the sources
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Scan the files
        run: |
          mkdir -p "$RUNNER_TEMP/tree"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/tree"
          cp .gitleaks.toml "$RUNNER_TEMP/tree/"
          "$(go env GOPATH)/bin/gitleaks" dir --redact --verbose --no-banner --exit-code 1 --config .gitleaks.toml "$RUNNER_TEMP/tree"
      - name: Scan the new commits
        # the commits of the pull request or the push; with no range (the first push of a branch)
        # the commits this branch added since it left the platform's main, whose own history the
        # platform's CI scans with its own reviewed exceptions; the whole history only when there is
        # no main to compare with
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          range=""
          if [ -n "$BASE" ]; then
            range="$BASE..HEAD"
          elif [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..HEAD"
          elif git rev-parse --verify -q origin/main > /dev/null; then
            range="origin/main..HEAD"
          fi
          if [ -n "$range" ]; then
            "$(go env GOPATH)/bin/gitleaks" git --redact --verbose --no-banner --exit-code 1 --config .gitleaks.toml --log-opts="$range" .
          else
            "$(go env GOPATH)/bin/gitleaks" git --redact --verbose --no-banner --exit-code 1 --config .gitleaks.toml .
          fi
