name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (Java 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test
        run: mvn -B -q test
        working-directory: backend

  frontend:
    name: Frontend (Node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install workspaces
        # npm ci needs the root lockfile; until every workspace has landed it may be missing
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build

  content:
    name: Config as code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install workspaces
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Check workflows, providers and resource types
        run: npm run check:workflows
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Lint playbooks
        run: |
          if [ -d playbooks ]; then
            pip install ansible-lint
            shopt -s globstar nullglob
            files=(playbooks/**/*.yml)
            if [ ${#files[@]} -eq 0 ]; then
              echo "no playbooks in repo"
            else
              ansible-lint "${files[@]}"
            fi
          else
            echo "no playbooks in repo"
          fi
