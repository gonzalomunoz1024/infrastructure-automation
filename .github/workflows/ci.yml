name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (Java 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test
        run: mvn -B -q test
        working-directory: backend

  frontend:
    name: Frontend (Node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install workspaces
        # npm ci needs the root lockfile; until every workspace has landed it may be missing
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build

  content:
    name: Config as code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install workspaces
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Check workflows, providers and resource types
        run: npm run check:workflows
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Lint playbooks
        run: |
          if [ -d playbooks ]; then
            pip install ansible-lint
            shopt -s globstar nullglob
            files=(playbooks/**/*.yml)
            if [ ${#files[@]} -eq 0 ]; then
              echo "no playbooks in repo"
            else
              ansible-lint "${files[@]}"
            fi
          else
            echo "no playbooks in repo"
          fi

  sdk-java:
    name: Provider SDK (Java)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test
        run: mvn -B -q test
        working-directory: sdk/java

  sdk-go:
    name: Provider SDK (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: sdk/go/go.mod
          cache-dependency-path: sdk/go/go.sum
      - name: Vet
        run: go vet ./...
        working-directory: sdk/go
      - name: Test
        run: go test ./...
        working-directory: sdk/go

  sdk-python:
    name: Provider SDK (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -e '.[test]'
        working-directory: sdk/python
      - name: Test
        run: pytest
        working-directory: sdk/python

  deploy:
    name: Images and Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint the Dockerfiles
        uses: hadolint/hadolint-action@v3.1.0
        with:
          recursive: true
      - uses: azure/setup-helm@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Lint the chart and validate what it renders
        run: |
          go install github.com/yannh/kubeconform/cmd/kubeconform@v0.8.0
          chart=deploy/helm/platform
          crds='https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          for values in "" "-f $chart/ci/full-values.yaml"; do
            helm lint $chart $values
            helm template platform $chart $values | "$(go env GOPATH)/bin/kubeconform" -strict -summary \
              -kubernetes-version 1.30.0 -schema-location default -schema-location "$crds"
          done
