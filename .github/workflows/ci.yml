name: CI

on:
  push:
    branches: ['console-sdk', 'console-sdk--**']
  pull_request:
    branches: ['console-sdk', 'console-sdk--**']
  workflow_dispatch:

jobs:
  typescript:
    name: TypeScript (Node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: The generated files match the contract
        run: npm run generate:check
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        # unit tests, and the built CLI end to end against a stub BFF
        run: npm test

  java:
    name: Java 21
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Generate, build and test
        run: ./gradlew build --no-daemon
