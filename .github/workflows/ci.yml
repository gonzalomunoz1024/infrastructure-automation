name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (Java 21)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: platform
          POSTGRES_USER: platform
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U platform -d platform"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test
        run: mvn -B -q test
        working-directory: backend
        env:
          # the JDBC adapters' tests run on H2 always, and on this PostgreSQL too
          PLATFORM_TEST_POSTGRES_URL: jdbc:postgresql://localhost:5432/platform?user=platform

  frontend:
    name: Frontend (Node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install workspaces
        # npm ci needs the root lockfile; until every workspace has landed it may be missing
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build

  content:
    name: Config as code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install workspaces
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Check workflows, providers and resource types
        run: npm run check:workflows
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false
      - name: Lint pinned playbooks
        # every git playbook the content pins, fetched at its commit (linted and scanned for secrets),
        # and playbooks/ when the repo has one; a source CI cannot fetch (private, gone) is skipped
        # with a notice
        run: |
          pip install ansible-lint==26.9.0
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          GITLEAKS="$(go env GOPATH)/bin/gitleaks" npm run lint:playbooks
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Dry-run the sample workflows
        # every sample workflow runs to its end against the samples recorded in the provider files
        run: mvn -B -q test -Dtest=SampleWorkflowsDryRunTest -Dsurefire.failIfNoSpecifiedTests=false
        working-directory: backend

  playbook-scan:
    name: Playbook upload scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build the upload scan rule
        run: mvn -B -q compile
        working-directory: backend
      - name: Scan the repository's playbooks
        # the rule POST /playbooks:upload applies (playbooks.domain.SecretScan), over every file under a
        # playbooks/ directory at the root, in workflows/ or in providers/ (the content keeps none today:
        # it pins its playbooks in git, which the content job lints and scans, or uploads them); first
        # over scripts/scan-playbooks/fixture, which must be flagged on exactly its marked lines
        run: java -cp backend/target/classes scripts/scan-playbooks/ScanPlaybooks.java .

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false
      - name: Install gitleaks
        # a pinned release built from its module; the Go checksum database verifies the sources
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Scan the files
        run: |
          mkdir -p "$RUNNER_TEMP/tree"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/tree"
          "$(go env GOPATH)/bin/gitleaks" dir --redact --verbose --no-banner --exit-code 1 "$RUNNER_TEMP/tree"
      - name: Scan the new commits
        # the commits of the pull request or the push; the whole history when there is no range
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          range=""
          if [ -n "$BASE" ]; then
            range="$BASE..HEAD"
          elif [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..HEAD"
          fi
          if [ -n "$range" ]; then
            "$(go env GOPATH)/bin/gitleaks" git --redact --verbose --no-banner --exit-code 1 --log-opts="$range" .
          else
            "$(go env GOPATH)/bin/gitleaks" git --redact --verbose --no-banner --exit-code 1 .
          fi

  sdk-java:
    name: Provider SDK (Java)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test
        run: mvn -B -q test
        working-directory: sdk/java

  sdk-go:
    name: Provider SDK (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: sdk/go/go.mod
          cache-dependency-path: sdk/go/go.sum
      - name: Vet
        run: go vet ./...
        working-directory: sdk/go
      - name: Test
        run: go test ./...
        working-directory: sdk/go

  sdk-python:
    name: Provider SDK (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -e '.[test]'
        working-directory: sdk/python
      - name: Test
        run: pytest
        working-directory: sdk/python

  deploy:
    name: Images and Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint the Dockerfiles
        uses: hadolint/hadolint-action@v3.1.0
        with:
          recursive: true
      - name: Check the Grafana dashboard
        # the JSON model parses, and the copy the chart ships as a ConfigMap is the same file
        run: |
          python3 -m json.tool deploy/grafana/platform-dashboard.json > /dev/null
          cmp deploy/grafana/platform-dashboard.json deploy/helm/platform/dashboards/platform-dashboard.json
      - uses: azure/setup-helm@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Lint the chart and validate what it renders
        run: |
          go install github.com/yannh/kubeconform/cmd/kubeconform@v0.8.0
          chart=deploy/helm/platform
          crds='https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          for values in "" "-f $chart/ci/full-values.yaml" "-f $chart/ci/worm-files-values.yaml" "-f $chart/ci/git-store-values.yaml"; do
            helm lint $chart $values
            helm template platform $chart $values | "$(go env GOPATH)/bin/kubeconform" -strict -summary \
              -kubernetes-version 1.30.0 -schema-location default -schema-location "$crds"
          done
      - name: Check the workflow store switch
        # without a repository the workflows live in the database; with one, in its clone (the Git
        # workflow store), which the chart runs on one backend pod only, since the store pushes nothing
        run: |
          chart=deploy/helm/platform
          helm template platform $chart | grep -qE '^ +git: false$'
          helm template platform $chart -f $chart/ci/full-values.yaml | grep -qE '^ +git: false$'
          helm template platform $chart -f $chart/ci/git-store-values.yaml | grep -qE '^ +git: true$'
          if helm template platform $chart --set content.repository=https://git.example.com/platform/content.git > /dev/null 2>&1; then
            echo "a repository with two API pods and the workers rendered the Git workflow store"
            exit 1
          fi
