name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (Java 21)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: platform
          POSTGRES_USER: platform
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U platform -d platform"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test
        run: mvn -B -q test
        working-directory: backend
        env:
          # the JDBC adapters' tests run on H2 always, and on this PostgreSQL too
          PLATFORM_TEST_POSTGRES_URL: jdbc:postgresql://localhost:5432/platform?user=platform

  frontend:
    name: Frontend (Node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install workspaces
        # npm ci needs the root lockfile; until every workspace has landed it may be missing
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build

  content:
    name: Config as code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install workspaces
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Check workflows, providers and resource types
        run: npm run check:workflows
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Lint playbooks
        run: |
          if [ -d playbooks ]; then
            pip install ansible-lint
            shopt -s globstar nullglob
            files=(playbooks/**/*.yml)
            if [ ${#files[@]} -eq 0 ]; then
              echo "no playbooks in repo"
            else
              ansible-lint "${files[@]}"
            fi
          else
            echo "no playbooks in repo"
          fi
