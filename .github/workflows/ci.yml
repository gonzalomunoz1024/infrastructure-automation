name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    services:
      mongo:
        # the MongoDB adapter tests run against it; without CONSOLE_TEST_MONGO_URI they skip
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      opensearch:
        # the index contract, the alias checks and the API journey run against it; the same image as
        # deploy/compose; without CONSOLE_TEST_OPENSEARCH_URL they skip
        image: opensearchproject/opensearch:2.19.6
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: "true"
          DISABLE_INSTALL_DEMO_CONFIG: "true"
          OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -fs http://localhost:9200/_cluster/health || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 40
      kafka:
        # the consumer test runs against it (KRaft, one node, PLAINTEXT on localhost:9092)
        image: apache/kafka:3.9.1
        ports:
          - 9092:9092
    env:
      CONSOLE_TEST_MONGO_URI: mongodb://localhost:27017
      CONSOLE_TEST_OPENSEARCH_URL: http://localhost:9200
      CONSOLE_TEST_KAFKA_BOOTSTRAP: localhost:9092
      # the console-libs branch this build takes com.iaf.console:* from until the published
      # packages exist (hub decision 15); CONSOLE_LIBS_REF moves it to the service branch then
      CONSOLE_LIBS_REF: ${{ vars.CONSOLE_LIBS_REF || 'console-libs--phase-0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check out console-libs
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CONSOLE_LIBS_REF }}
          path: .libs
      - name: Publish console-libs' convention plugins to the local Maven repository
        # build-logic is an included build: the root's publish leaves it out, and without it the
        # plugin console.spring-service does not resolve
        working-directory: .libs/build-logic
        run: ../gradlew publishToMavenLocal --no-daemon
      - name: Publish console-libs to the local Maven repository
        # the service resolves mavenLocal first; GitHub Packages serves the same coordinates once
        # merges to console-libs publish them
        working-directory: .libs
        run: ./gradlew publishToMavenLocal -x test --no-daemon
      - name: Wait for Kafka
        # the image has no health check of its own, so the job does not wait for it
        run: |
          for i in $(seq 1 60); do
            if (echo > /dev/tcp/127.0.0.1/9092) 2>/dev/null; then echo "Kafka answers"; exit 0; fi
            sleep 2
          done
          echo "Kafka did not start" >&2
          exit 1
      - name: Build and test the service
        run: ./gradlew build --no-daemon
      - name: Show the failed tests' output
        # the report artifact is the whole record; this puts each failure and its test class's
        # output (the access log, a thread dump after a hang) in the job's log, where it is read first
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for path in sorted(glob.glob('build/test-results/test/*.xml')):
              suite = ET.parse(path).getroot()
              failed = [c for c in suite.findall('testcase') if c.find('failure') is not None or c.find('error') is not None]
              if not failed:
                  continue
              print('::group::' + suite.get('name'))
              for case in failed:
                  problem = case.find('failure') if case.find('failure') is not None else case.find('error')
                  print('FAILED ' + case.get('name'))
                  print(problem.text or problem.get('message') or '')
              for stream in ('system-out', 'system-err'):
                  print('--- ' + stream)
                  print(suite.findtext(stream) or '')
              print('::endgroup::')
          PY
      - name: Keep the test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/
          if-no-files-found: ignore
      - name: Keep the jar
        uses: actions/upload-artifact@v4
        with:
          name: console-search-indexer.jar
          path: build/libs/console-search-indexer.jar
          if-no-files-found: error

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false
      - name: Install gitleaks
        # a pinned release built from its module; the Go checksum database verifies the sources
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Scan the files
        run: |
          mkdir -p "$RUNNER_TEMP/tree"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/tree"
          cp .gitleaks.toml "$RUNNER_TEMP/tree/"
          "$(go env GOPATH)/bin/gitleaks" dir --redact --verbose --no-banner --exit-code 1 --config .gitleaks.toml "$RUNNER_TEMP/tree"
      - name: Scan the new commits
        # the commits of the pull request or the push; with no range (the first push of a branch)
        # the commits this branch added since it left the platform's main, whose own history the
        # platform's CI scans with its own reviewed exceptions; the whole history only when there
        # is no main to compare with
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          range=""
          if [ -n "$BASE" ]; then
            range="$BASE..HEAD"
          elif [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..HEAD"
          elif git rev-parse --verify -q origin/main > /dev/null; then
            range="origin/main..HEAD"
          fi
          if [ -n "$range" ]; then
            "$(go env GOPATH)/bin/gitleaks" git --redact --verbose --no-banner --exit-code 1 --config .gitleaks.toml --log-opts="$range" .
          else
            "$(go env GOPATH)/bin/gitleaks" git --redact --verbose --no-banner --exit-code 1 --config .gitleaks.toml .
          fi

  chart:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - name: Lint and render the chart
        run: |
          helm lint deploy/helm/console-search-indexer
          helm template console-search-indexer deploy/helm/console-search-indexer > "$RUNNER_TEMP/rendered.yaml"
          helm template console-search-indexer deploy/helm/console-search-indexer \
            --set ingest.kafka.enabled=false --set autoscaling.enabled=true --set networkPolicy.enabled=true \
            --set metrics.serviceMonitor.enabled=true --set opensearchCredentials.existingSecret= \
            --set 'console.rebuild.accounts={123456789012}' > /dev/null

  load:
    name: Load smoke
    # the load test's harness on a small estate (README, Load): the seeder, the simulation and gate
    # 6's lookups by name, tag and wfrn, with every request answered; the latency targets themselves
    # are asserted by the full run in the load environment, so the limits here catch only a gross
    # regression on a shared runner
    runs-on: ubuntu-latest
    services:
      opensearch:
        image: opensearchproject/opensearch:2.19.6
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: "true"
          DISABLE_INSTALL_DEMO_CONFIG: "true"
          OPENSEARCH_JAVA_OPTS: -Xms1g -Xmx1g
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -fs http://localhost:9200/_cluster/health || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 40
    env:
      CONSOLE_LIBS_REF: ${{ vars.CONSOLE_LIBS_REF || 'console-libs--phase-0' }}
      # the same estate for the seeder and the simulation; one node keeps no replica
      ESTATE: -Pload.size=100000 -Pload.accounts=20 -Pload.largestShare=0.5 -Pload.replicas=0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check out console-libs
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CONSOLE_LIBS_REF }}
          path: .libs
      - name: Publish console-libs' convention plugins to the local Maven repository
        working-directory: .libs/build-logic
        run: ../gradlew publishToMavenLocal --no-daemon
      - name: Publish console-libs to the local Maven repository
        working-directory: .libs
        run: ./gradlew publishToMavenLocal -x test --no-daemon
      - name: Build the service
        run: ./gradlew bootJar --no-daemon
      - name: Seed the estate
        run: ./gradlew seedEstate $ESTATE --no-daemon
      - name: Start the service
        # ingestion off, so the estate stays as seeded; the simulation speaks as the BFF does with
        # the dev headers, which only a load environment of its own turns on
        run: |
          java -jar build/libs/console-search-indexer.jar --console.ingest.enabled=false --console.auth.dev-headers=true \
            > "$RUNNER_TEMP/indexer.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl -fs http://localhost:18085/actuator/health/readiness > /dev/null; then echo "the service is ready"; exit 0; fi
            sleep 2
          done
          cat "$RUNNER_TEMP/indexer.log"
          exit 1
      - name: Run the searches
        run: >-
          ./gradlew gatlingRun --simulation com.iaf.console.search.load.SearchSimulation $ESTATE --no-daemon
          -Pload.users=30 -Pload.ramp=PT10S -Pload.duration=PT60S -Pload.thinkMin=PT1S -Pload.thinkMax=PT3S
          -Pload.searchP95=1500 -Pload.listP95=1500 -Pload.suggestP95=1500 -Pload.homeP95=3000
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gatling-report
          path: |
            build/reports/gatling/
            ${{ runner.temp }}/indexer.log
          if-no-files-found: ignore
