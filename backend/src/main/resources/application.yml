spring:
  application:
    name: infrastructure-automation
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  profiles:
    default: demo
  webflux:
    multipart:
      max-disk-usage-per-part: ${platform.playbooks.max-upload-size:20MB}   # a part sent without a length stops at the upload limit
      max-parts: 16

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  tracing:
    sampling:
      probability: 1.0    # every request and job is traced (spans for the gateway, MCP calls, jobs, steps and provider calls)
  metrics:
    distribution:         # each provider call (span iaf.provider.call) is also a timer: buckets, so its p95 can be computed across replicas
      percentiles-histogram:
        iaf.provider.call: true
      minimum-expected-value:
        iaf.provider.call: 10ms
      maximum-expected-value:
        iaf.provider.call: 1h
  # otlp:
  #   tracing:
  #     endpoint: http://localhost:4318/v1/traces   # set it (or MANAGEMENT_OTLP_TRACING_ENDPOINT) to export spans; unset, nothing leaves the process

platform:
  # the content repo: workflows, providers and resource types as config as code
  content:
    dir: ..               # the repo root: workflows/, providers/ and resource-types/ live under it
    git: false            # true: commit every draft/publish through JGit (GitWorkflowStore)
  identity:
    mode: dev             # dev | oidc
    default-user: gonzalo
    # Under the oidc profile (mode: oidc) the issuer, the audience and the JWKS endpoint are
    # required and the start fails with a message naming a blank one, for example:
    # oidc-issuer: https://login.example.com/realms/platform
    # oidc-audience: platform
    # oidc-jwks-uri: https://login.example.com/realms/platform/protocol/openid-connect/certs
    oidc-teams-claim: groups          # the token claim that lists the caller's teams
    oidc-roles-claim: roles           # the token claim that lists the caller's roles
    oidc-admin-role: platform-admin   # the role in that claim that makes the caller a platform admin
  execution:
    mode: in-memory       # in-memory | temporal; the temporal profile (end of this file) sets temporal
  roles: api, worker      # api (the API) and/or worker (the interpreter's Temporal worker); one alone needs the temporal profile
  temporal:               # used with the temporal profile: the server, namespace and task queue of the interpreter
    target: 127.0.0.1:7233
    namespace: default
    task-queue: platform-interpreter
    heartbeat-timeout: 60s  # a step's call (provider, automation, script) without a heartbeat this long fails as worker-lost; 0 = never
    heartbeat-interval: 15s # how often those calls heartbeat
    ui-url: ""              # the Temporal web UI (e.g. http://localhost:8233): each job's view links to its execution there; blank = no link
    payload-key: ""         # a vault: reference to the AES-256 key (32 bytes, base64) that encrypts the payloads in Temporal's history; blank = in clear, with a warning at startup
    api-key: ""             # a vault: reference to a Temporal Cloud API key, sent with every call over TLS; blank = none
    tls:                    # TLS to the server from PEM files; on when any is set (or an API key is)
      ca: ""                # the CA of the server's certificate; blank = the JVM's trust store
      cert: ""              # the client certificate for mTLS, with key
      key: ""               # its PKCS#8 private key
  policy:
    mode: mock            # mock | opa
    opa-url: http://localhost:8181/v1/data/platform
  credentials:
    mode: in-memory       # in-memory | vault
    vault-url: http://localhost:8200
    vault-mount: secret
  artifacts:              # uploads and saved plans, kept by SHA-256
    dir: ${java.io.tmpdir}/iaf-platform/artifacts
    s3:                   # profile s3: any S3-compatible store
      bucket: ""
      endpoint: ""        # blank for AWS
      credential: ""      # vault:<path> holding <access key id>:<secret access key>; blank uses the AWS default chain
  playbooks:
    max-upload-size: 20MB
    lint-command: ""    # e.g. ansible-lint --offline {playbook}: runs in the unpacked upload, a non-zero exit refuses it; blank skips the lint (the upload answers lint: skipped)
    lint-timeout: PT60S
    git:
      cache-dir: ${java.io.tmpdir}/iaf-platform/git
  runners:                # profile live: ansible, terraform, script and http steps run for real
    work-dir: ${java.io.tmpdir}/iaf-platform/runners
    container-runtime: "" # docker | podman runs every step in a container; blank runs on the host
    ansible:
      default-image: ""   # the execution environment of steps and providers that name none
      dynamic-inventory: ""   # what inventory: dynamic means (inventory plugin configs)
    terraform:
      backend: ""         # blank keeps state under work-dir; or s3, gcs, pg, ... with backend-config pairs
  assistant:
    mode: mock            # mock | devin (the devin profile switches the adapter)
    devin-url: https://api.devin.ai/v3
    devin-org: ""
    devin-api-key: ""                  # the service user's key (Authorization: Bearer): a vault: reference, e.g. vault:devin/api-key,
                                       # resolved at each call; the key itself still works but is warned about at startup
    devin-playbook-id: ""              # the !workflow-draft playbook (devin/nl-builder-playbook.md)
    devin-provider-playbook-id: ""     # the !provider-draft playbook (devin/provider-draft-playbook.md)
    platform-token-secret-id: ""       # the Devin secret holding PLATFORM_TOKEN, attached to every session
    devin-repos: []                    # repositories attached as read-only context, e.g. [acme/platform-content]
    devin-max-acu-limit: 10            # ACU ceiling per session; 0 sends none
    devin-poll-every: PT15S            # kept within 10 to 30 seconds
    devin-timeout: PT30M
    devin-dir: ""                      # the playbooks and schemas; blank = <content.dir>/devin
    sync-playbooks-on-startup: false   # create or update the Devin playbooks from devin/*.md at startup
    platform-api-url: ""               # what the agent calls back; blank = http://localhost:<server.port>
    max-rounds: 3                      # times the platform sends its own check results back to the agent
    session-retention: P30D            # builder sessions not updated for this long are deleted (checked every hour)
  providers:
    git-allow-local: false             # read file: repositories (tests and local demos only)
    git-timeout: PT60S                 # one fetch of a spec, playbook or module repository
    terraform-registry-url: https://registry.terraform.io
  github:                              # the github profile: change requests are pull requests on the content repo
    api-url: https://api.github.com    # GitHub Enterprise Server: https://<host>/api/v3
    repo: ""                           # owner/name of the content repository
    base-branch: main
    token: vault:github/platform-token         # opens, merges and closes the pull requests
    webhook-secret: vault:github/webhook-secret  # signs POST /api/v1/change-requests:github-webhook
    merge-method: squash               # merge | squash | rebase
    timeout: PT20S
  audit:
    retention-years: 7
    seal-every: PT1H
    signing-key: ""       # HMAC-SHA256 key for seals and export packs: a vault: reference, e.g. vault:platform/audit-signing-key,
                          # resolved when it signs; blank = a random key per run (its id is logged, never the key); the key
                          # itself still works but is warned about at startup
    worm:                 # write-once evidence; every object is kept retention-years after it was written
      dir: data/evidence  # profile worm: one read-only file per entry, seal and checkpoint, each with a retention sidecar
      s3:                 # profile worm-s3: S3 Object Lock in COMPLIANCE mode; AWS credentials from the SDK's default chain
        bucket: ""        # created with Object Lock enabled, or the store refuses to start
        prefix: ""
        region: ""        # blank = AWS_REGION / the profile / instance metadata
        endpoint: ""      # blank = AWS; set for an S3-compatible store with Object Lock
  siem:                   # profile siem: every evidence entry (jobs, releases, the platform stream) also goes to the SIEM
    queue-capacity: 10000 # bounded; when the SIEM is down long enough the newest entries are dropped and counted
    batch-size: 100
    max-attempts: 5       # per batch and SIEM, backing off from initial-backoff, doubling
    initial-backoff: PT1S
    hec:                  # Splunk HTTP Event Collector; on when url is set
      url: ""             # e.g. https://splunk.example.com:8088/services/collector/event
      token: ""           # a vault: reference to the HEC token, never the token
      index: ""
    syslog:               # RFC 5424; on when host is set
      host: ""
      port: 514
      protocol: udp       # udp | tcp (octet counting, RFC 6587)
      facility: 13        # log audit
      sd-id: iaf@32473    # the structured-data id; replace 32473 with the firm's enterprise number
  change:                 # change records for workflows with policy.change.required
    evidence-url: http://localhost:3000/#/audit/{jobId}   # the link back to the job's evidence every change carries
    servicenow:           # profiles servicenow and live: the Table API on change_request
      instance: ""        # e.g. https://firm.service-now.com
      credential: ""      # a vault: reference: user:password for basic auth, the token for bearer
      auth: basic         # basic | bearer
      type: normal        # normal | standard | emergency
      assignment-group: ""
      open-state: ""      # blank = the instance's default; -1 = Implement
      close-state: "3"    # Closed
      evidence-field: work_notes   # or a custom field such as u_evidence_url
  notifications:          # notify steps, provider alerts, approval requests and escalations
    keep: 5000            # in-app notifications kept (GET /api/v1/notifications)
    fresh-for: PT15M      # older events (seeded or replayed history) notify nobody
    link-base: http://localhost:3000/#   # links in chat and email open the UI here
    channels: {}          # by name without '#': { vm-ops: { teams: [team-compute], webhook: vault:slack/vm-ops, email: [vm-ops@example.com] } }
    teams: {}             # approver groups: { data-approvers: { channel: "#data-approvals", email: data-approvers@example.com } }
    slack:                # profile slack: Slack-compatible incoming webhooks
      default-webhook: "" # a vault: reference for channels without their own webhook
    mail:                 # profile mail: spring.mail.host/port/username name the server
      from: iaf@localhost
      password: ""        # a vault: reference to the SMTP password
  gateway:                # guards on the requests that start jobs
    idempotency:          # Idempotency-Key on POST generated routes, /jobs and /jobs:batch; idempotencyKey on MCP tools/call
      ttl: PT24H          # a key gives back its first answer this long; per caller
      keep: 100000        # keys kept at most, the oldest dropped first
    quotas:               # token bucket per team (the caller's first team) on job starts; a batch takes one token
      enabled: true
      per-minute: 60      # every team's sustained starts per minute
      burst: 60           # and how many at once
      teams: {}           # overrides: { team-data: { per-minute: 120, burst: 120 } }
  demo:
    seed-history: true    # generate recent jobs so health, releases and evidence have data
  persistence:            # used with the mongo profile
    telemetry-retention: P30D   # provider-call samples older than this are deleted

---
# The temporal profile (docker compose, scripts/dev.sh --temporal): jobs run as Temporal workflows on
# platform.temporal.*, with the interpreter worker inside this process. Without it the in-memory
# engine runs them and nothing connects to Temporal.
spring:
  config:
    activate:
      on-profile: temporal
platform:
  execution:
    mode: temporal

---
# The mongo profile (docker compose, scripts/dev.sh --mongo): the stores live in MongoDB instead of
# memory, so workflow versions, change requests, providers with their kept versions and review
# evidence, releases, the resource registry, audit evidence, service accounts, builder sessions,
# provider-call samples and the jobs (with their steps and events) survive a restart. The
# connection is spring.data.mongodb.uri: set SPRING_DATA_MONGODB_URI in the environment (with the
# user and password in it; a password never goes in this file). Each store creates its indexes on
# start. A standalone server works; production runs a replica set for durability.
spring:
  config:
    activate:
      on-profile: mongo
  data:
    mongodb:
      uri: mongodb://localhost:27017/platform
