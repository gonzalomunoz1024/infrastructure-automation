spring:
  application:
    name: infrastructure-automation
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  profiles:
    default: demo
  webflux:
    multipart:
      max-disk-usage-per-part: ${platform.playbooks.max-upload-size:20MB}   # a part sent without a length stops at the upload limit
      max-parts: 16

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics

platform:
  # the content repo: workflows, providers and resource types as config as code
  content:
    dir: ..               # the repo root: workflows/, providers/ and resource-types/ live under it
    git: false            # true: commit every draft/publish through JGit (GitWorkflowStore)
  identity:
    mode: dev             # dev | oidc
    default-user: gonzalo
  execution:
    mode: in-memory       # in-memory | temporal; the temporal profile (end of this file) sets temporal
  roles: api, worker      # api (the API) and/or worker (the interpreter's Temporal worker); one alone needs the temporal profile
  temporal:               # used with the temporal profile: the server, namespace and task queue of the interpreter
    target: 127.0.0.1:7233
    namespace: default
    task-queue: platform-interpreter
    heartbeat-timeout: 60s  # a step's call (provider, automation, script) without a heartbeat this long fails as worker-lost; 0 = never
    heartbeat-interval: 15s # how often those calls heartbeat
    ui-url: ""              # the Temporal web UI (e.g. http://localhost:8233): each job's view links to its execution there; blank = no link
  policy:
    mode: mock            # mock | opa
    opa-url: http://localhost:8181/v1/data/platform
  credentials:
    mode: in-memory       # in-memory | vault
    vault-url: http://localhost:8200
    vault-mount: secret
  artifacts:              # uploads and saved plans, kept by SHA-256
    dir: ${java.io.tmpdir}/iaf-platform/artifacts
    s3:                   # profile s3: any S3-compatible store
      bucket: ""
      endpoint: ""        # blank for AWS
      credential: ""      # vault:<path> holding <access key id>:<secret access key>; blank uses the AWS default chain
  playbooks:
    max-upload-size: 20MB
    git:
      cache-dir: ${java.io.tmpdir}/iaf-platform/git
  runners:                # profile live: ansible, terraform, script and http steps run for real
    work-dir: ${java.io.tmpdir}/iaf-platform/runners
    container-runtime: "" # docker | podman runs every step in a container; blank runs on the host
    ansible:
      default-image: ""   # the execution environment of steps and providers that name none
      dynamic-inventory: ""   # what inventory: dynamic means (inventory plugin configs)
    terraform:
      backend: ""         # blank keeps state under work-dir; or s3, gcs, pg, ... with backend-config pairs
  assistant:
    mode: mock            # mock | devin (the devin profile switches the adapter)
    devin-url: https://api.devin.ai/v3
    devin-org: ""
    devin-api-key: ""                  # Authorization: Bearer <key>
    devin-playbook-id: ""              # the !workflow-draft playbook (devin/nl-builder-playbook.md)
    devin-provider-playbook-id: ""     # the !provider-draft playbook (devin/provider-draft-playbook.md)
    platform-token-secret-id: ""       # the Devin secret holding PLATFORM_TOKEN, attached to every session
  audit:
    retention-years: 7
    seal-every: PT1H
    signing-key: ""       # HMAC-SHA256 key for seals and export packs; blank = a random key per run (its id is logged, never the key)
  demo:
    seed-history: true    # generate recent jobs so health, releases and evidence have data
  persistence:            # used with the postgres profile
    telemetry-retention: P30D   # provider-call samples older than this are deleted

---
# The temporal profile (docker compose, scripts/dev.sh --temporal): jobs run as Temporal workflows on
# platform.temporal.*, with the interpreter worker inside this process. Without it the in-memory
# engine runs them and nothing connects to Temporal.
spring:
  config:
    activate:
      on-profile: temporal
platform:
  execution:
    mode: temporal

---
# The postgres profile (docker compose, scripts/dev.sh --postgres): the stores live in PostgreSQL
# instead of memory, so workflow versions, change requests, providers, releases, the resource
# registry, audit evidence, service accounts, builder sessions, provider-call samples and the jobs
# (with their steps and events) survive a restart. The connection is spring.datasource.*: set
# SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME and SPRING_DATASOURCE_PASSWORD in the
# environment (a password never goes in this file). Flyway applies db/migration on start.
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: jdbc:postgresql://localhost:5432/platform
    username: platform
