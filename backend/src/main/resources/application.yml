spring:
  application:
    name: infrastructure-automation
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  profiles:
    default: demo

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics

platform:
  # the content repo: workflows, providers and resource types as config as code
  content:
    dir: ..               # the repo root: workflows/, providers/ and resource-types/ live under it
    git: false            # true: commit every draft/publish through JGit (GitWorkflowStore)
  identity:
    mode: dev             # dev | oidc
    default-user: gonzalo
  execution:
    mode: in-memory       # in-memory | temporal
  temporal:
    target: 127.0.0.1:7233
    namespace: default
    task-queue: platform-interpreter
  policy:
    mode: mock            # mock | opa
    opa-url: http://localhost:8181/v1/data/platform
  credentials:
    mode: in-memory       # in-memory | vault
    vault-url: http://localhost:8200
    vault-mount: secret
  assistant:
    mode: mock            # mock | devin (the devin profile switches the adapter)
    devin-url: https://api.devin.ai/v3
    devin-org: ""
    devin-api-key: ""                  # Authorization: Bearer <key>
    devin-playbook-id: ""              # the !workflow-draft playbook (devin/nl-builder-playbook.md)
    devin-provider-playbook-id: ""     # the !provider-draft playbook (devin/provider-draft-playbook.md)
    platform-token-secret-id: ""       # the Devin secret holding PLATFORM_TOKEN, attached to every session
    devin-repos: []                    # repositories attached as read-only context, e.g. [acme/platform-content]
    devin-max-acu-limit: 10            # ACU ceiling per session; 0 sends none
    devin-poll-every: PT15S            # kept within 10 to 30 seconds
    devin-timeout: PT30M
    devin-dir: ""                      # the playbooks and schemas; blank = <content.dir>/devin
    sync-playbooks-on-startup: false   # create or update the Devin playbooks from devin/*.md at startup
    platform-api-url: ""               # what the agent calls back; blank = http://localhost:<server.port>
    max-rounds: 3                      # times the platform sends its own check results back to the agent
  providers:
    git-allow-local: false             # read file: repositories (tests and local demos only)
    git-timeout: PT60S                 # one fetch of a spec, playbook or module repository
    terraform-registry-url: https://registry.terraform.io
  audit:
    retention-years: 7
    seal-every: PT1H
    signing-key: ""       # HMAC-SHA256 key for seals and export packs; blank = a random key per run (its id is logged, never the key)
  demo:
    seed-history: true    # generate recent jobs so health, releases and evidence have data
