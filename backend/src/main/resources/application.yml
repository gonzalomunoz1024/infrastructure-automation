spring:
  application:
    name: infrastructure-automation
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  profiles:
    default: demo

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics

platform:
  # the content repo: workflows, providers and resource types as config as code
  content:
    dir: ..               # the repo root: workflows/, providers/ and resource-types/ live under it
    git: false            # true: commit every draft/publish through JGit (GitWorkflowStore)
  identity:
    mode: dev             # dev | oidc
    default-user: gonzalo
  execution:
    mode: in-memory       # in-memory | temporal
  temporal:
    target: 127.0.0.1:7233
    namespace: default
    task-queue: platform-interpreter
  policy:
    mode: mock            # mock | opa
    opa-url: http://localhost:8181/v1/data/platform
  credentials:
    mode: in-memory       # in-memory | vault
    vault-url: http://localhost:8200
    vault-mount: secret
  assistant:
    mode: mock            # mock | devin (the devin profile switches the adapter)
    devin-url: https://api.devin.ai/v3
    devin-org: ""
    devin-api-key: ""                  # Authorization: Bearer <key>
    devin-playbook-id: ""              # the !workflow-draft playbook (devin/nl-builder-playbook.md)
    devin-provider-playbook-id: ""     # the !provider-draft playbook (devin/provider-draft-playbook.md)
    platform-token-secret-id: ""       # the Devin secret holding PLATFORM_TOKEN, attached to every session
  audit:
    retention-years: 7
    seal-every: PT1H
    signing-key: ""       # HMAC-SHA256 key for seals and export packs; blank = a random key per run (its id is logged, never the key)
    worm:                 # write-once evidence; every object is kept retention-years after it was written
      dir: data/evidence  # profile worm: one read-only file per entry, seal and checkpoint, each with a retention sidecar
      s3:                 # profile worm-s3: S3 Object Lock in COMPLIANCE mode; AWS credentials from the SDK's default chain
        bucket: ""        # created with Object Lock enabled, or the store refuses to start
        prefix: ""
        region: ""        # blank = AWS_REGION / the profile / instance metadata
        endpoint: ""      # blank = AWS; set for an S3-compatible store with Object Lock
  siem:                   # profile siem: every evidence entry (jobs, releases, the platform stream) also goes to the SIEM
    queue-capacity: 10000 # bounded; when the SIEM is down long enough the newest entries are dropped and counted
    batch-size: 100
    max-attempts: 5       # per batch and SIEM, backing off from initial-backoff, doubling
    initial-backoff: PT1S
    hec:                  # Splunk HTTP Event Collector; on when url is set
      url: ""             # e.g. https://splunk.example.com:8088/services/collector/event
      token: ""           # a vault: reference to the HEC token, never the token
      index: ""
    syslog:               # RFC 5424; on when host is set
      host: ""
      port: 514
      protocol: udp       # udp | tcp (octet counting, RFC 6587)
      facility: 13        # log audit
      sd-id: iaf@32473    # the structured-data id; replace 32473 with the firm's enterprise number
  change:                 # change records for workflows with policy.change.required
    evidence-url: http://localhost:3000/#/audit/{jobId}   # the link back to the job's evidence every change carries
    servicenow:           # profiles servicenow and live: the Table API on change_request
      instance: ""        # e.g. https://firm.service-now.com
      credential: ""      # a vault: reference: user:password for basic auth, the token for bearer
      auth: basic         # basic | bearer
      type: normal        # normal | standard | emergency
      assignment-group: ""
      open-state: ""      # blank = the instance's default; -1 = Implement
      close-state: "3"    # Closed
      evidence-field: work_notes   # or a custom field such as u_evidence_url
  notifications:          # notify steps, provider alerts, approval requests and escalations
    keep: 5000            # in-app notifications kept (GET /api/v1/notifications)
    fresh-for: PT15M      # older events (seeded or replayed history) notify nobody
    link-base: http://localhost:3000/#   # links in chat and email open the UI here
    channels: {}          # by name without '#': { vm-ops: { teams: [team-compute], webhook: vault:slack/vm-ops, email: [vm-ops@example.com] } }
    teams: {}             # approver groups: { data-approvers: { channel: "#data-approvals", email: data-approvers@example.com } }
    slack:                # profile slack: Slack-compatible incoming webhooks
      default-webhook: "" # a vault: reference for channels without their own webhook
    mail:                 # profile mail: spring.mail.host/port/username name the server
      from: iaf@localhost
      password: ""        # a vault: reference to the SMTP password
  demo:
    seed-history: true    # generate recent jobs so health, releases and evidence have data
